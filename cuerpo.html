<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuerpo Explorador</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
img{max-width:100%}

body{margin:0;background:#EEF5FF;color:#1B2A4A}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
button{font:inherit}
button:focus-visible{outline:3px solid #1B2A4A;outline-offset:3px}
.spot-live{animation:spotpulse 1.4s ease-in-out infinite}
@keyframes spotpulse{0%,100%{box-shadow:0 0 0 0 rgba(27,42,74,.35)}50%{box-shadow:0 0 0 12px rgba(27,42,74,0)}}
.bn{fill:#FFFDF6;stroke:#55627E;stroke-width:1.5;stroke-linejoin:round}
.bnd{fill:#C9D1E0;stroke:#55627E;stroke-width:1.2;stroke-linejoin:round}
.bnl{fill:none;stroke:#55627E;stroke-width:1.2;stroke-linecap:round}
.bo,.bo2,.bo3,.bo4,.bo5,.ro{fill:none;stroke:#55627E;stroke-linecap:round;stroke-linejoin:round}
.bi,.bi2,.bi3,.bi4,.bi5,.ri{fill:none;stroke:#FFFDF6;stroke-linecap:round;stroke-linejoin:round}
.bo{stroke-width:8}.bi{stroke-width:5}
.bo2{stroke-width:12}.bi2{stroke-width:8.5}
.bo3{stroke-width:7}.bi3{stroke-width:4}
.bo4{stroke-width:5}.bi4{stroke-width:2.4}
.bo5{stroke-width:15}.bi5{stroke-width:11}
.ro{stroke-width:6}.ri{stroke-width:3.2}
.ms{fill:#E07A6C;stroke:#9E3B31;stroke-width:1.2;stroke-linejoin:round}
.ms2{fill:#C9594D;stroke:#9E3B31;stroke-width:1.2;stroke-linejoin:round}
.msl{fill:none;stroke:#9E3B31;stroke-width:1;stroke-linecap:round;opacity:.55}
.jt{fill:#FFFFFF;stroke:#0F766E;stroke-width:3}
.og{stroke:#5B2333;stroke-width:1.3;stroke-linejoin:round}
.br{fill:#F4A7B9}.brl{fill:none;stroke:#9D2D55;stroke-width:1.4;stroke-linecap:round}
.tr{fill:#CFE3F5;stroke:#4B6B8F;stroke-width:1.3}.trl{fill:none;stroke:#4B6B8F;stroke-width:1}
.trb{fill:none;stroke:#8FB3D9;stroke-width:5;stroke-linecap:round}
.lu{fill:#F6B5BF}.ht{fill:#D9344B}.htv{fill:none;stroke:#8E1B2C;stroke-width:4;stroke-linecap:round}
.lv{fill:#A1473A}.st{fill:#F2A65A}.kd{fill:#B5484A}.bl{fill:#F4D35E}
.lio{fill:none;stroke:#8A5A2B;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}
.lii{fill:none;stroke:#E3A56A;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.sio{fill:none;stroke:#8A5A2B;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.sii{fill:none;stroke:#F5C99A;stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.lift{transition:transform .15s ease, box-shadow .15s ease}
.lift:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(27,42,74,.14)}
</style>
</head>
<body>
<a id="lupiExitBtn" href="./" aria-label="Salir a la portada" title="Salir a la portada" style="position:fixed;left:16px;bottom:16px;z-index:9999;display:flex;align-items:center;gap:8px;min-height:52px;padding:0 20px 0 14px;border-radius:999px;background:#FF6B4A;color:#FFFFFF;border:3px solid #FFFFFF;box-shadow:0 6px 16px rgba(0,0,0,.3);font:800 20px/1 'Baloo 2','Nunito',system-ui,sans-serif;text-decoration:none;box-sizing:border-box"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h8"/><path d="M10 12h10"/><path d="M16 8l4 4-4 4"/></svg><span>Salir</span></a>
<script>
(function(){
  var KEY = 'lupi-progreso-v1';
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function load(){
    var o;
    try { o = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { o = {}; }
    if (!o || typeof o !== 'object') o = {};
    if (!o.days || typeof o.days !== 'object') o.days = {};
    if (!o.total || typeof o.total !== 'object') o.total = {};
    return o;
  }
  function add(game, n){
    n = Number(n) || 0;
    if (n <= 0) return;
    var o = load();
    var k = dateKey(new Date());
    if (!o.days[k]) o.days[k] = {};
    o.days[k][game] = (o.days[k][game] || 0) + n;
    o.total[game] = (o.total[game] || 0) + n;
    var cut = new Date(); cut.setDate(cut.getDate() - 400);
    var cutKey = dateKey(cut);
    Object.keys(o.days).forEach(function(d){ if (d < cutKey) delete o.days[d]; });
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }
  /* Estrellas del mes en curso: el marcador vuelve a cero el día 1 de cada mes. */
  function month(){
    var o = load(), pre = dateKey(new Date()).slice(0, 7), per = {}, sum = 0;
    Object.keys(o.days).forEach(function(d){
      if (d.slice(0, 7) !== pre) return;
      Object.keys(o.days[d]).forEach(function(g){ var n = Number(o.days[d][g]) || 0; per[g] = (per[g] || 0) + n; sum += n; });
    });
    return { key: pre, sum: sum, per: per };
  }
  /* ----- tiempo dedicado: segundos por día y por juego, solo mientras se juega de verdad ----- */
  var TKEY = 'lupi-tiempo-v1';
  function loadTime(){ var o; try { o = JSON.parse(localStorage.getItem(TKEY) || '{}'); } catch (e) { o = {}; } return (o && typeof o === 'object') ? o : {}; }
  function addTime(game, secs){
    var o = loadTime(), k = dateKey(new Date());
    if (!o[k] || typeof o[k] !== 'object') o[k] = {};
    o[k][game] = (Number(o[k][game]) || 0) + secs;
    var cut = new Date(); cut.setDate(cut.getDate() - 400); var ck = dateKey(cut);
    Object.keys(o).forEach(function(d){ if (d < ck) delete o[d]; });
    try { localStorage.setItem(TKEY, JSON.stringify(o)); } catch (e) {}
  }
  function timeOf(key){ var r = loadTime()[key] || {}, per = {}, sum = 0; Object.keys(r).forEach(function(g){ var n = Number(r[g]) || 0; per[g] = n; sum += n; }); return { sum: sum, per: per }; }
  function fmtTime(s){ var m = Math.floor((Number(s) || 0) / 60); if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : ''); }
  /* cuenta de 5 en 5 segundos si la página está a la vista y ha habido actividad en los últimos 3 minutos */
  function startTimer(game, isActive){
    var last = Date.now(), STEP = 5000, IDLE = 180000;
    ['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll'].forEach(function(ev){ window.addEventListener(ev, function(){ last = Date.now(); }, { passive: true, capture: true }); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) last = Date.now(); });
    setInterval(function(){
      if (document.hidden || Date.now() - last > IDLE) return;
      if (isActive && !isActive()) return;
      addTime(game, STEP / 1000);
    }, STEP);
  }
  window.LupiScore = { add: add, load: load, dateKey: dateKey, month: month, timeOf: timeOf, fmtTime: fmtTime, startTimer: startTimer };
})();
(function(){var a=document.getElementById("lupiExitBtn");if(!a)return;a.addEventListener("click",function(e){var r=document.referrer;try{if(r&&new URL(r).origin===location.origin&&new URL(r).pathname!==location.pathname){e.preventDefault();location.href=r;}}catch(err){}});})();
(function(){var g=(location.pathname.match(/(abecedario|tablas|cuerpo|mates|obby)\.html/)||[])[1];if(g==="obby")g="mundo";if(g&&window.LupiScore)window.LupiScore.startTimer(g);})();
</script>
<div id="app"></div>
<template id="tpl">
<div style="min-height: 100vh; box-sizing: border-box; padding: 24px 16px 56px; background: #EEF5FF; color: #1B2A4A; font-family: 'Nunito', system-ui, sans-serif">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 14px">
<div style="width: 56px; height: 56px; border-radius: 18px; background: #1B2A4A; display: flex; align-items: center; justify-content: center">
<dc-import name="Icon" kind="heart" size="32" color="#FFFFFF" hint-size="32px,32px"></dc-import>
</div>
<div style="display: flex; flex-direction: column">
<div style="font-family: 'Baloo 2', system-ui, sans-serif; font-size: 28px; font-weight: 800; line-height: 1.1">Cuerpo Explorador</div>
<div style="font-size: 16px; color: #43536F; font-weight: 600">Aprende cómo funciona tu cuerpo</div>
</div>
</div>
<sc-if value="{{notHome}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 999px; background: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 22px; font-weight: 800">
<dc-import name="Icon" kind="star" size="26" color="#D97706" hint-size="26px,26px"></dc-import>
<span>{{stars}}</span>
<span style="font-family: 'Nunito', system-ui, sans-serif; font-size: 15px; font-weight: 700; color: #43536F">estrellas</span>
</div>
<button onClick="{{goHome}}" aria-label="Volver al inicio" style="display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 18px; border: none; border-radius: 999px; background: #1B2A4A; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer">
<dc-import name="Icon" kind="home" size="22" color="#FFFFFF" hint-size="22px,22px"></dc-import>
<span>Inicio</span>
</button>
</div>
</sc-if>
</header>

<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-direction: column; gap: 24px">
<div style="background: #1B2A4A; color: #FFFFFF; border-radius: 32px; padding: 36px 32px; display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 48px; font-weight: 800; line-height: 1.05">¡Explora tu cuerpo!</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.5; max-width: 640px; color: #DCE7F7">Elige un juego para empezar. En cada pregunta verás un dibujo que te da una pista de para qué sirve esa parte del cuerpo.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="5">
<button class="lift" onClick="{{m.start}}" style="display: flex; flex-direction: column; align-items: flex-start; gap: 14px; padding: 24px; border: none; border-radius: 28px; background: #FFFFFF; color: #1B2A4A; text-align: left; cursor: pointer; box-shadow: 0 2px 0 rgba(27,42,74,.08)">
<div style="width: 76px; height: 76px; border-radius: 24px; background: {{m.color}}; display: flex; align-items: center; justify-content: center">
<dc-import name="Icon" kind="{{m.icon}}" size="44" color="#FFFFFF" hint-size="44px,44px"></dc-import>
</div>
<div style="font-family: 'Baloo 2', system-ui, sans-serif; font-size: 28px; font-weight: 800; line-height: 1.1">{{m.name}}</div>
<div style="font-size: 17px; line-height: 1.4; color: #43536F; font-weight: 600">{{m.desc}}</div>
<div style="margin-top: auto; padding: 6px 14px; border-radius: 999px; background: {{m.tint}}; color: {{m.color}}; font-size: 15px; font-weight: 800">{{m.count}} preguntas · {{m.hint}}</div>
</button>
</sc-for>
</div>
</section>
</sc-if>

<sc-if value="{{playBody}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<section style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 800; font-size: 17px">
<span style="color: {{color}}">{{modeName}}</span>
<span>Pregunta {{qNum}} de {{qTotal}}</span>
</div>
<div style="height: 14px; border-radius: 999px; background: #FFFFFF; overflow: hidden">
<div style="height: 100%; width: {{progress}}; border-radius: 999px; background: {{color}}"></div>
</div>
</div>
<sc-if value="{{isFind}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<div style="padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 16px; background: {{step1Bg}}; color: {{step1Fg}}">1 · Adivina</div>
<div style="padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 16px; background: {{step2Bg}}; color: {{step2Fg}}">2 · Colócalo en el cuerpo</div>
</div>
</sc-if>
<sc-if value="{{isWhat}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<div style="padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 16px; background: {{color}}; color: #FFFFFF">Repaso · ¿Para qué sirve?</div>
</div>
</sc-if>
<div style="background: #FFFFFF; border-radius: 28px; padding: 24px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap">
<div style="width: 104px; height: 104px; flex: none; border-radius: 30px; background: {{color}}; display: flex; align-items: center; justify-content: center">
<dc-import name="Icon" kind="{{clueIcon}}" size="62" color="#FFFFFF" hint-size="62px,62px"></dc-import>
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 15px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: {{color}}">{{cardLabel}}</div>
<div style="font-size: 22px; line-height: 1.45; font-weight: 700">{{clue}}</div>
</div>
</div>
<sc-if value="{{isGuess}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 28px; font-weight: 800">{{question}}</h2>
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<button onClick="{{o.pick}}" disabled="{{o.disabled}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 12px 22px; border-radius: 20px; border: 3px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 25px; font-weight: 700; text-align: left; cursor: {{o.cursor}}">
<span style="display: flex; align-items: center; gap: 14px">
<sc-if value="{{o.showIcon}}" hint-placeholder-val="{{ false }}"><span style="width: 48px; height: 48px; flex: none; border-radius: 14px; background: {{o.iconBg}}; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" kind="{{o.icon}}" size="30" color="{{o.iconFg}}" hint-size="30px,30px"></dc-import></span></sc-if>
<span>{{o.label}}</span>
</span>
<sc-if value="{{o.isWrong}}" hint-placeholder-val="{{ false }}"><dc-import name="Icon" kind="x" size="26" color="#B42318" hint-size="26px,26px"></dc-import></sc-if>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{isPlace}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 22px; background: {{tint}}">
<dc-import name="Icon" kind="target" size="40" color="{{color}}" hint-size="40px,40px"></dc-import>
<div style="font-size: 20px; line-height: 1.4; font-weight: 700">Ahora toca el círculo del cuerpo donde va <strong style="color: {{color}}">{{target}}</strong>.</div>
</div>
</sc-if>
<sc-if value="{{hasFb}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: 20px; background: {{fbBg}}; color: {{fbFg}}; font-size: 19px; font-weight: 800; line-height: 1.4">
<dc-import name="Icon" kind="{{fbIcon}}" size="30" color="{{fbFg}}" hint-size="30px,30px"></dc-import>
<span>{{fbText}}</span>
</div>
</sc-if>
<sc-if value="{{hasDoubt}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; align-items: flex-start; gap: 14px">
<button onClick="{{toggleDoubt}}" aria-expanded="{{doubtOpen}}" style="display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 22px 0 14px; border: 3px solid #B45309; border-radius: 999px; background: #FEF3C7; color: #78350F; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 22px; font-weight: 800; cursor: pointer">
<dc-import name="Icon" kind="help" size="30" color="#B45309" hint-size="30px,30px"></dc-import>
<span>¿Tienes dudas?</span>
</button>
<sc-if value="{{doubtOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; width: 100%; margin-top: 8px">
<div role="note" style="display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; padding: 20px 22px; border: 3px solid #B45309; border-radius: 28px; background: #FFFBEB; color: #3B2A12">
<div style="width: 64px; height: 64px; flex: none; border-radius: 20px; background: #B45309; display: flex; align-items: center; justify-content: center">
<dc-import name="Icon" kind="{{doubtIcon}}" size="38" color="#FFFFFF" hint-size="38px,38px"></dc-import>
</div>
<div style="flex: 1 1 220px; display: flex; flex-direction: column; gap: 8px">
<div style="font-family: 'Baloo 2', system-ui, sans-serif; font-size: 24px; font-weight: 800; line-height: 1.15; color: #78350F">{{doubtTitle}}</div>
<div style="font-size: 19px; line-height: 1.5; font-weight: 700">{{doubtText}}</div>
<button onClick="{{closeDoubt}}" style="align-self: flex-start; margin-top: 4px; min-height: 44px; padding: 0 18px; border: none; border-radius: 999px; background: #B45309; color: #FFFFFF; font-size: 17px; font-weight: 800; cursor: pointer">¡Entendido!</button>
</div>
</div>
<div aria-hidden="true" style="position: absolute; left: 44px; top: -11px; width: 20px; height: 20px; background: #FFFBEB; border-left: 3px solid #B45309; border-top: 3px solid #B45309; transform: rotate(45deg)"></div>
</div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<button onClick="{{next}}" style="align-self: flex-start; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 28px; border: none; border-radius: 999px; background: {{color}}; color: #FFFFFF; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 24px; font-weight: 800; cursor: pointer">
<span>{{nextLabel}}</span>
<dc-import name="Icon" kind="arrow" size="26" color="#FFFFFF" hint-size="26px,26px"></dc-import>
</button>
</sc-if>
</section>

<section aria-label="Cuerpo humano" style="flex: 0 1 364px; min-width: 0; background: #FFFFFF; border-radius: 28px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="font-size: 15px; font-weight: 800; color: #43536F; padding-top: 8px">Colocadas: {{placedCount}} de {{partsTotal}}</div>
<div style="position: relative; width: 340px; height: 572px; flex: none">
<svg viewBox="0 0 260 560" aria-hidden="true" style="position: absolute; left: 40px; top: 0; width: 260px; height: 560px; overflow: visible">
<ellipse cx="130" cy="52" rx="38" ry="46" fill="{{skin}}"></ellipse>
<ellipse cx="92" cy="56" rx="6" ry="10" fill="{{skin}}"></ellipse>
<ellipse cx="168" cy="56" rx="6" ry="10" fill="{{skin}}"></ellipse>
<path d="M116 88 L144 88 L146 126 L114 126 Z" fill="{{skin}}"></path>
<path d="M114 118 C96 122 74 124 66 140 C60 152 66 170 72 182 L78 250 C80 262 74 290 72 312 C90 330 110 336 130 338 C150 336 170 330 188 312 C186 290 180 262 182 250 L188 182 C194 170 200 152 194 140 C186 124 164 122 146 118 Z" fill="{{skin}}"></path>
<path d="M54 146 L48 236 L46 318 M206 146 L212 236 L214 318" style="fill: none; stroke: {{skin}}; stroke-width: 28; stroke-linecap: round; stroke-linejoin: round"></path>
<ellipse cx="46" cy="344" rx="14" ry="22" fill="{{skin}}"></ellipse>
<ellipse cx="214" cy="344" rx="14" ry="22" fill="{{skin}}"></ellipse>
<path d="M100 312 L100 418 M160 312 L160 418" style="fill: none; stroke: {{skin}}; stroke-width: 50; stroke-linecap: round"></path>
<path d="M100 418 L100 506 M160 418 L160 506" style="fill: none; stroke: {{skin}}; stroke-width: 36; stroke-linecap: round"></path>
<ellipse cx="98" cy="530" rx="20" ry="13" fill="{{skin}}"></ellipse>
<ellipse cx="162" cy="530" rx="20" ry="13" fill="{{skin}}"></ellipse>
</svg>
<sc-if value="{{showBones}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 260 560" aria-hidden="true" style="position: absolute; left: 40px; top: 0; width: 260px; height: 560px; overflow: visible; opacity: {{boneOpacity}}">
<ellipse class="bn" cx="130" cy="44" rx="33" ry="37"></ellipse>
<ellipse class="bnd" cx="117" cy="50" rx="8" ry="7"></ellipse>
<ellipse class="bnd" cx="143" cy="50" rx="8" ry="7"></ellipse>
<path class="bnd" d="M130 58 L125 69 L135 69 Z"></path>
<path class="bnl" d="M117 76 L143 76 M121 72 L121 80 M126 72 L126 80 M130 72 L130 80 M134 72 L134 80 M139 72 L139 80"></path>
<path class="bn" d="M104 64 C104 84 116 96 130 96 C144 96 156 84 156 64 L148 66 C146 79 140 85 130 85 C120 85 114 79 112 66 Z"></path>
<rect class="bn" x="124" y="98" width="12" height="6" rx="2"></rect>
<rect class="bn" x="124" y="106" width="12" height="6" rx="2"></rect>

</div>
<div style="height: 14px; border-radius: 999px; background: #FFFFFF; overflow: hidden">

</div>
</div>
<div style="background: #FFFFFF; border-radius: 28px; padding: 28px; display: flex; gap: 22px; align-items: center; flex-wrap: wrap">

</div>
</div>
<h2 style="margin: 0; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 28px; font-weight: 800">{{question}}</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{quizOptions}}" as="o" hint-placeholder-count="4">
<button onClick="{{o.pick}}" disabled="{{o.disabled}}" style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 12px; border-radius: 24px; border: 3px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Baloo 2', system-ui, sans-serif; font-size: 24px; font-weight: 800; cursor: {{o.cursor}}">
<div style="width: 72px; height: 72px; border-radius: 22px; background: {{o.iconBg}}; display: flex; align-items: center; justify-content: center">
<dc-import name="Icon" kind="{{o.icon}}" size="44" color="{{o.iconFg}}" hint-size="44px,44px"></dc-import>
</div>
<span>{{o.label}}</span>
</button>
</sc-for>
</div>
<sc-if value="{{hasFb}}" hint-placeholder-val="{{ false }}">

</button>

</div>
</sc-if>
</div>

function lookup(scope, path){

class DCLogic {

var PARTS = {
  pulmones: { name: 'Pulmones', icon: 'lungs' },
  corazon: { name: 'Corazón', icon: 'heart' },
  cerebro: { name: 'Cerebro', icon: 'brain' },
  estomago: { name: 'Estómago', icon: 'stomach' },

  musculos: { name: 'Músculos', icon: 'dumbbell' },
  articulaciones: { name: 'Articulaciones', icon: 'hinge' },

  ojos: { name: 'Ojos', icon: 'eye' },
  rinones: { name: 'Riñones', icon: 'kidney' },

};

function shuffle(list) {
  var r = list.slice();
  for (var i = r.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = r[i]; r[i] = r[j]; r[j] = t;
  }
  return r;
}

function cap(t) { return t.charAt(0).toUpperCase() + t.slice(1); }

class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { screen: 'home', modeId: 'musculos', order: [], idx: 0, phase: 'guess', options: [], wrong: [], wrongSpots: [], placed: [], stars: 0, mistakes: 0, fb: null, doubt: null, doubtOpen: false };
  }

  getMode() {
    var id = this.state.modeId;
    return MODES.find(function (m) { return m.id === id; }) || MODES[0];
  }

  getStep() {
    return this.state.order[this.state.idx] || { id: this.getMode().items[0].id, kind: 'find' };
  }

  getItem() {
    var m = this.getMode();
    var id = this.getStep().id;
    return m.items.find(function (i) { return i.id === id; }) || m.items[0];
  }

  roundFor(m, order, idx) {
    var step = order[idx];
    var id = step.id;
    var it = m.items.find(function (i) { return i.id === id; });
    var opts;
    if (m.kind === 'body' || step.kind === 'what') {
      var n = m.kind === 'body' ? 2 : 3;
      var others = shuffle(m.items.filter(function (i) { return i.id !== id; }).map(function (i) { return i.id; })).slice(0, n);
      opts = shuffle([id].concat(others));
    } else {
      var rest = shuffle(Object.keys(PARTS).filter(function (k) { return k !== it.answer; })).slice(0, 3);
      opts = shuffle([it.answer].concat(rest));
    }
    return { order: order, idx: idx, options: opts, phase: 'guess', wrong: [], wrongSpots: [], mistakes: 0, fb: null, doubt: null, doubtOpen: false };
  }

  start(modeId) {
    var m = MODES.find(function (x) { return x.id === modeId; });
    var ids = m.items.map(function (i) { return i.id; });
    var order = shuffle(ids).map(function (id) { return { id: id, kind: 'find' }; })
      .concat(shuffle(ids).map(function (id) { return { id: id, kind: 'what' }; }));
    this.setState(Object.assign({ screen: 'play', modeId: modeId, placed: [], stars: 0 }, this.roundFor(m, order, 0)));
  }

  pick(optId) {
    var s = this.state;
    if (s.phase !== 'guess' || s.wrong.indexOf(optId) >= 0) return;
    var m = this.getMode();
    var it = this.getItem();
    var kind = this.getStep().kind;
    var isBody = m.kind === 'body';
    var correct = (isBody || kind === 'what') ? it.id : it.answer;
    var star = s.mistakes === 0 ? 1 : 0;
    if (optId === correct) {
      if (isBody && kind === 'find') {
        this.setState({ phase: 'place', fb: { ok: true, text: '¡Correcto! Es ' + it.art + ' ' + it.name.toLowerCase() + '.' } });
      } else if (isBody) {
        this.setState({ phase: 'done', stars: s.stars + star, fb: { ok: true, text: '¡Muy bien! ' + cap(it.art) + ' ' + it.name.toLowerCase() + ' sirve para: ' + it.fn.toLowerCase() + '.' } });
      } else {
        this.setState({ phase: 'done', stars: s.stars + star, fb: { ok: true, text: '¡Muy bien! ' + it.why } });
      }
      return;
    }
    var doubt;
    var q;
    if (isBody) {
      q = m.items.find(function (i) { return i.id === optId; });
      doubt = kind === 'find'
        ? { icon: q.icon, title: 'Has elegido ' + q.art + ' ' + q.name.toLowerCase(), text: q.clue + ' Sirve para: ' + q.fn.toLowerCase() + '.' }
        : { icon: q.icon, title: 'Eso lo hace ' + q.art + ' ' + q.name.toLowerCase(), text: q.clue };
    } else if (kind === 'find') {
      q = m.items.find(function (i) { return i.answer === optId; });
      doubt = { icon: PARTS[optId].icon, title: 'Has elegido: ' + PARTS[optId].name.toLowerCase(), text: q.why + ' Su trabajo es: ' + q.fn.toLowerCase() + '.' };
    } else {
      q = m.items.find(function (i) { return i.id === optId; });
      doubt = { icon: PARTS[q.answer].icon, title: '«' + q.fn + '» es el trabajo de: ' + PARTS[q.answer].name.toLowerCase(), text: q.clue + ' ' + q.why };
    }
    this.setState({ wrong: s.wrong.concat([optId]), mistakes: s.mistakes + 1, doubt: doubt, doubtOpen: false,
      fb: { ok: false, text: '¡Uy! Esa no es. Prueba otra vez.' } });
  }

  tapSpot(spotId) {
    var s = this.state;
    if (s.phase !== 'place' || s.placed.indexOf(spotId) >= 0) return;
    var m = this.getMode();
    var it = this.getItem();
    if (spotId === it.id) {
      this.setState({ placed: s.placed.concat([spotId]), phase: 'done', stars: s.stars + (s.mistakes === 0 ? 1 : 0), fb: { ok: true, text: '¡Encaja perfecto! Ahí está ' + it.art + ' ' + it.name.toLowerCase() + '.' } });
    } else {
      var q = m.items.find(function (i) { return i.id === spotId; });
      this.setState({ wrongSpots: s.wrongSpots.concat([spotId]), mistakes: s.mistakes + 1, doubtOpen: false,
        doubt: { icon: q.icon, title: 'Ese sitio es para ' + q.art + ' ' + q.name.toLowerCase(), text: q.clue },
        fb: { ok: false, text: 'Ahí no va. ¡Busca otro círculo!' } });
    }
  }

  next() {
    var s = this.state;
    var m = this.getMode();
    if (s.idx + 1 >= s.order.length) {
      this.setState({ screen: 'result', fb: null, doubt: null, doubtOpen: false });
    } else {
      this.setState(this.roundFor(m, s.order, s.idx + 1));
    }
  }

  renderVals() {
    var self = this;
    var s = this.state;
    var m = this.getMode();
    var it = this.getItem();
    var kind = this.getStep().kind;
    var isWhat = kind === 'what';
    var isBody = m.kind === 'body';
    var total = m.items.length * 2;
    var playing = s.screen === 'play';
    var ok = s.fb && s.fb.ok;
    var guess = s.phase === 'guess';

    var modes = MODES.map(function (x) {
      return { id: x.id, name: x.name, icon: x.icon, color: x.color, tint: x.tint, desc: x.desc, count: x.items.length * 2,
        hint: x.kind === 'body' ? 'Adivina, coloca y repasa' : 'Elige y repasa',
        start: function () { self.start(x.id); } };
    });

    var options = isBody ? s.options.map(function (id) {
      var p = m.items.find(function (i) { return i.id === id; }) || { name: '', fn: '', icon: 'star' };
      var w = s.wrong.indexOf(id) >= 0;
      return { label: isWhat ? p.fn : p.name, icon: p.icon, showIcon: isWhat, isWrong: w, disabled: w,
        bg: w ? '#FEE4E2' : '#FFFFFF', border: w ? '#B42318' : '#C9D6EA', fg: w ? '#B42318' : '#1B2A4A', cursor: w ? 'default' : 'pointer',
        iconBg: w ? '#FFFFFF' : m.tint, iconFg: w ? '#B42318' : m.color,
        pick: function () { self.pick(id); } };
    }) : [];

    var quizOptions = !isBody ? s.options.map(function (id) {
      var label, icon, right;
      if (isWhat) {
        var q = m.items.find(function (i) { return i.id === id; });
        label = q.fn; icon = q.icon; right = id === it.id;
      } else {
        label = PARTS[id].name; icon = PARTS[id].icon; right = id === it.answer;
      }
      right = right && s.phase === 'done';
      var w = s.wrong.indexOf(id) >= 0;
      var off = w || s.phase === 'done';
      return { label: label, icon: icon, disabled: off,
        bg: right ? '#DCFCE7' : (w ? '#FEE4E2' : '#FFFFFF'),
        border: right ? '#15803D' : (w ? '#B42318' : '#C9D6EA'),
        fg: right ? '#14532D' : (w ? '#B42318' : '#1B2A4A'),
        iconBg: right ? '#15803D' : (w ? '#FFFFFF' : m.tint),
        iconFg: right ? '#FFFFFF' : (w ? '#B42318' : m.color),
        cursor: off ? 'default' : 'pointer',
        pick: function () { self.pick(id); } };
    }) : [];

    var spots = isBody ? m.items.map(function (p) {
      var placed = s.placed.indexOf(p.id) >= 0;
      var missed = !placed && s.phase === 'place' && s.wrongSpots.indexOf(p.id) >= 0;
      var live = !placed && !missed && s.phase === 'place';
      var focus = isWhat && p.id === it.id;
      var leftSide = p.x < 130;
      return {
        left: p.x + 40 - 19, top: p.y - 19,
        placed: placed, missed: missed,
        disabled: !live,
        cls: (live || focus) ? 'spot-live' : '',
        line: placed ? 'solid' : 'dashed',
        border: focus ? '#1B2A4A' : (placed ? m.color : (missed ? '#B42318' : (live ? '#1B2A4A' : '#8FA3C0'))),
        bg: placed ? m.color : (missed ? '#FEE4E2' : (live ? '#FFFFFF' : 'rgba(255,255,255,0.65)')),
        cursor: live ? 'pointer' : 'default',
        aria: placed ? p.name + ', colocado' : 'Sitio del cuerpo',
        short: p.short || p.name,
        tagLeft: leftSide ? p.x + 40 - 22 : p.x + 40 + 22,
        tagTop: p.y - 11,
        tagTf: leftSide ? 'translateX(-100%)' : 'none',
        tap: function () { self.tapSpot(p.id); }
      };
    }) : [];

    var starRow = [];
    for (var i = 0; i < total; i++) starRow.push({ color: i < s.stars ? '#D97706' : '#DCE3EE' });

    var ratio = s.stars / total;
    var resultMsg = ratio === 1 ? '¡Perfecto! Eres un experto del cuerpo humano.'
      : (ratio >= 0.6 ? '¡Muy bien! Casi lo tienes todo. ¿Juegas otra vez para conseguir todas las estrellas?'
      : '¡Buen intento! Cada vez que juegas aprendes más. ¡Prueba otra vez!');

    var target = isBody ? it.art + ' ' + it.name.toLowerCase() : '';
    var cardLabel, clue, clueIcon, fnName, question;
    if (isBody) {
      cardLabel = isWhat ? 'Repaso · Mira el círculo que brilla' : 'Pista · ¿Para qué sirve?';
      clue = isWhat ? '¿Para qué sirve ' + target + '?' : it.clue;
      clueIcon = isWhat ? m.icon : it.icon;
      question = isWhat ? 'Elige para qué sirve' : '¿Qué parte del cuerpo es?';
      fnName = '';
    } else {
      cardLabel = isWhat ? 'Repaso · La parte del cuerpo' : 'La función';
      fnName = isWhat ? PARTS[it.answer].name : it.fn;
      clue = isWhat ? '¿Qué trabajo hace esta parte del cuerpo?' : it.clue;
      clueIcon = isWhat ? PARTS[it.answer].icon : it.icon;
      question = isWhat ? 'Elige su trabajo' : '¿Qué parte del cuerpo hace este trabajo?';
    }

    return {
      modes: modes,
      isHome: s.screen === 'home',
      notHome: s.screen !== 'home',
      isResult: s.screen === 'result',
      playBody: playing && isBody,
      playQuiz: playing && !isBody,
      stars: s.stars,
      color: m.color,
      tint: m.tint,
      skin: '#F2DCC9',
      showBones: m.id === 'huesos' || m.id === 'articulaciones',
      boneOpacity: m.id === 'articulaciones' ? '0.45' : '1',
      isMuscles: m.id === 'musculos',
      isJoints: m.id === 'articulaciones',
      isOrgans: m.id === 'organos',
      modeName: m.name,
      qNum: s.idx + 1,
      qTotal: total,
      partsTotal: m.items.length,
      progress: Math.round(((s.idx + (s.phase === 'done' ? 1 : 0)) / total) * 100) + '%',
      isFind: !isWhat,
      isWhat: isWhat,
      step1Bg: guess ? m.color : '#FFFFFF',
      step1Fg: guess ? '#FFFFFF' : '#43536F',
      step2Bg: guess ? '#FFFFFF' : m.color,
      step2Fg: guess ? '#43536F' : '#FFFFFF',
      cardLabel: cardLabel,
      clueIcon: clueIcon,
      clue: clue,
      fnName: fnName,
      question: question,
      target: target,
      isGuess: guess,
      isPlace: s.phase === 'place',
      isDone: s.phase === 'done',
      options: options,
      quizOptions: quizOptions,
      spots: spots,
      placedCount: s.placed.length,
      hasFb: !!s.fb,
      fbText: s.fb ? s.fb.text : '',
      fbBg: ok ? '#DCFCE7' : '#FEE4E2',
      fbFg: ok ? '#14532D' : '#B42318',
      fbIcon: ok ? 'check' : 'x',
      hasDoubt: !!s.doubt,
      doubtOpen: !!s.doubtOpen,
      doubtIcon: s.doubt ? s.doubt.icon : 'help',
      doubtTitle: s.doubt ? s.doubt.title : '',
      doubtText: s.doubt ? s.doubt.text : '',
      toggleDoubt: function () { self.setState({ doubtOpen: !self.state.doubtOpen }); },
      closeDoubt: function () { self.setState({ doubtOpen: false }); },
      nextLabel: s.idx + 1 >= s.order.length ? 'Ver resultado' : 'Siguiente',
      next: function () { self.next(); },
      restart: function () { self.start(m.id); },
      goHome: function () { self.setState({ screen: 'home', fb: null, doubt: null, doubtOpen: false }); },
      starRow: starRow,
      resultMsg: resultMsg
    };
  }
}

app = new Component();
paint();
</script>
</body>
