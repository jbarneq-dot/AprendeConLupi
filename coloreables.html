<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coloreables</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{color-scheme:light; --ink:#2B2250; --soft:#5B5480; --bg:#FFF6E4; --card:#FFFFFF; --line:#E6DCC8; --accent:#7F5AF0; --sun:#FFC83D; --coral:#FF6B4A; --ok:#2E9B6A;
  --display:'Baloo 2','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;}
*{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font:700 17px/1.4 var(--body);}
button{font:inherit; color:inherit;}
[hidden]{display:none!important}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 16px; background:var(--accent); color:#FFFFFF; box-shadow:0 4px 0 rgba(43,34,80,.18);}
.top h1{flex:1 1 auto; min-width:0; margin:0; font:800 clamp(22px,6vw,32px)/1 var(--display);}
.exit{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 16px; border-radius:999px; background:var(--coral); color:#FFFFFF; border:3px solid #FFFFFF; font:800 19px/1 var(--display); text-decoration:none;}
.stars{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 14px; border-radius:999px; background:#FFFFFF; color:var(--ink); font:800 21px/1 var(--display);}
.stars svg{width:24px; height:24px; fill:var(--sun); stroke:#B07A00; stroke-width:1.2;}
.exit:focus-visible,.btn:focus-visible,.tcard:focus-visible,.dcard:focus-visible,.sw:focus-visible,.tool:focus-visible,.opt:focus-visible{outline:3px solid var(--ink); outline-offset:3px;}
main{max-width:980px; margin:0 auto; padding:14px 16px 40px; display:flex; flex-direction:column; gap:14px;}
h2{margin:0; font:800 clamp(22px,5vw,30px)/1.1 var(--display); text-wrap:balance;}
h3{margin:6px 0 0; font:800 20px/1.1 var(--display);}
.lead{margin:0; max-width:62ch;}
.note{margin:0; color:var(--soft); font-size:15px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}
.tcard,.dcard{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 10px; border-radius:22px; border:3px solid var(--ink); background:var(--card); cursor:pointer; text-align:center; box-shadow:0 6px 0 rgba(43,34,80,.16); min-width:0;}
.tcard:active,.dcard:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(43,34,80,.16);}
.tcard .ic{font-size:54px; line-height:1.1;}
.tcard b,.dcard b{font:800 20px/1.1 var(--display);}
.tcard span,.dcard span{font-size:14px; color:var(--soft);}
.tcard.make{background:linear-gradient(135deg,#FFD23F,#FF9FCB); grid-column:1/-1; flex-direction:row; justify-content:center; gap:14px; text-align:left;}
.tcard.make span{color:#2B2250;}
.dcard{padding:10px;}
.dcard svg,.dcard img{display:block; width:100%; height:auto; aspect-ratio:1; border-radius:14px; border:2px solid var(--line); background:#FFFFFF;}
.tag{display:inline-flex; align-items:center; gap:4px; padding:3px 12px; border-radius:999px; font:800 16px/1.3 var(--display); background:var(--sun); color:#3A2A00;}
.dcard .tag{color:#3A2A00;}
.tag.mine{background:#D8F5E4; color:#0F5132;}
.row{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
.btn{min-height:48px; padding:6px 16px; border-radius:16px; border:3px solid var(--ink); background:#FFFFFF; font:800 18px/1.1 var(--display); cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink);}
.btn.main{background:var(--sun);}
.btn[aria-pressed="true"]{background:#D8F5E4;}
.btn:disabled{opacity:.5; cursor:default;}
.f{fill:#FFFFFF; stroke:#1B1B2B; stroke-width:5; stroke-linejoin:round; stroke-linecap:round;}
.bg{stroke:none;}
.l{fill:none; stroke:#1B1B2B; stroke-width:5; stroke-linecap:round; stroke-linejoin:round;}
.k{fill:#1B1B2B;}
/* pintar: el dibujo arriba y las herramientas justo debajo, todo a la vista */
.paint{display:grid; grid-template-columns:minmax(0,1fr); gap:10px; align-items:start;}
.stage{position:relative; width:100%; max-width:min(640px,calc(100vh - 340px)); max-width:min(640px,calc(100svh - 340px)); min-width:min(100%,240px); aspect-ratio:1; margin:0 auto; border:4px solid var(--ink); border-radius:22px; overflow:hidden; background:#FFFFFF; box-shadow:0 6px 0 rgba(43,34,80,.16); touch-action:none; cursor:crosshair; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
.stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block;}
.stage .ink{pointer-events:none;}
.side{display:flex; flex-direction:column; gap:8px; min-width:0; width:100%; max-width:640px; margin:0 auto;}
.bar{display:flex; flex-direction:column; gap:8px; padding:8px; border-radius:20px; background:var(--card); border:3px solid var(--ink); min-width:0;}
.tools{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px;}
.tool{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; min-height:50px; min-width:0; padding:3px 1px; border-radius:12px; border:3px solid var(--ink); background:#FFFFFF; cursor:pointer; font:800 11px/1.1 var(--display); overflow:hidden; white-space:nowrap; text-overflow:ellipsis;}
.tool i{font-style:normal; font-size:21px; line-height:1.15;}
.tool[aria-pressed="true"]{background:var(--sun); box-shadow:0 0 0 3px var(--accent);}
.pal{display:flex; gap:7px; overflow-x:auto; padding:5px 4px 7px; -webkit-overflow-scrolling:touch; scrollbar-width:thin; touch-action:pan-x;}
.sw{flex:none; width:38px; height:38px; border-radius:50%; border:3px solid var(--ink); cursor:pointer; padding:0;}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px #FFFFFF, 0 0 0 5px var(--accent); transform:scale(.88);}
.popts{display:grid; grid-template-columns:auto minmax(0,1fr) minmax(0,1fr); gap:6px; align-items:stretch;}
.popts .btn{min-height:46px; min-width:0; padding:2px 4px; font-size:13px; border-radius:12px; gap:0; flex-direction:column; justify-content:center; line-height:1.1; white-space:nowrap;}
.popts .btn i{font-style:normal; font-size:18px;}
.sizes{display:flex; gap:4px;}
.sizes .btn{flex:none; width:42px; padding:2px; align-items:center;}
.sizes .dot{display:block; border-radius:50%; background:var(--ink);}
.msg{margin:0; min-height:1.4em; font-size:15px;}
.msg a{color:var(--accent);}
/* pantallas apaisadas (ordenador, tableta tumbada o móvil tumbado): herramientas al lado */
@media (min-aspect-ratio:5/4) and (min-width:700px){
  .paint{grid-template-columns:auto minmax(280px,360px); justify-content:center;}
  .stage{margin:0; width:min(640px,calc(100vh - 150px)); width:min(640px,calc(100svh - 150px)); max-width:none; min-width:200px;}
  .side{max-width:none;}
}
/* creador */
.maker{display:grid; grid-template-columns:minmax(0,1fr); gap:14px; align-items:start;}
.prev{position:sticky; top:calc(env(safe-area-inset-top,0px) + 66px); z-index:3; display:flex; gap:10px; align-items:center; padding:8px; border-radius:20px; background:var(--card); border:3px solid var(--ink);}
.prev svg{flex:none; width:min(42vw,220px); height:auto; border-radius:12px; border:2px solid var(--line);}
.prev div{display:flex; flex-direction:column; gap:8px; min-width:0;}
.prev b{font:800 19px/1.15 var(--display);}
.prev .btn{white-space:nowrap; padding:6px 12px; font-size:17px;}
.opts{display:grid; grid-template-columns:repeat(auto-fill,minmax(84px,1fr)); gap:8px;}
.opt{display:flex; flex-direction:column; align-items:center; gap:2px; padding:5px; border-radius:14px; border:3px solid var(--line); background:#FFFFFF; cursor:pointer; font:800 13px/1.1 var(--display); min-width:0;}
.opt svg{width:100%; height:auto;}
.opt[aria-pressed="true"]{border-color:var(--accent); background:#EFE8FF; box-shadow:0 0 0 2px var(--accent);}
.ask{display:flex; flex-direction:column; gap:8px; padding:12px; border-radius:20px; background:var(--card); border:3px solid var(--ink);}
.ask label{font:800 20px/1.1 var(--display);}
.askrow{display:flex; gap:8px; flex-wrap:wrap;}
.askrow input{flex:1 1 220px; min-width:0; min-height:48px; padding:6px 12px; border-radius:14px; border:3px solid var(--ink); font:700 17px/1.2 var(--body, inherit); background:#FFFFFF; color:var(--ink);}
.chips{display:flex; gap:6px; flex-wrap:wrap;}
.chip{min-height:38px; padding:4px 12px; border-radius:999px; border:2px solid var(--ink); background:#FFFFFF; font:800 14px/1.1 var(--display); cursor:pointer; color:var(--ink);}
.chip[aria-pressed="true"]{background:var(--sun);}
.tabs{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px;}
.tab{min-height:48px; padding:4px; border-radius:14px; border:3px solid var(--ink); background:#FFFFFF; font:800 14px/1.1 var(--display); cursor:pointer; color:var(--ink);}
.tab[aria-pressed="true"]{background:var(--sun); box-shadow:0 0 0 3px var(--accent);}
.chip:focus-visible,.tab:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
@media (min-width:860px){ .maker{grid-template-columns:300px minmax(0,1fr);} .prev{flex-direction:column; align-items:stretch;} .prev svg{width:100%;} }
.dlg{position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(43,34,80,.6);}
.dlg-box{width:100%; max-width:380px; max-height:100%; overflow:auto; padding:18px; border-radius:24px; background:#FFFFFF; border:4px solid var(--ink); display:flex; flex-direction:column; gap:12px; text-align:center;}
.dlg-box svg{width:70%; max-width:220px; height:auto; margin:0 auto; border-radius:14px; border:2px solid var(--line);}
.dlg-box p{margin:0;}
.dlg-box .row{justify-content:center;}
@media (prefers-reduced-motion:reduce){ .tcard:active,.dcard:active{transform:none;} }
</style>
</head>
<body>
<header class="top">
  <a class="exit" href="./" aria-label="Salir a la portada">🏠 Salir</a>
  <h1>Coloreables</h1>
  <span class="stars" aria-label="Tus estrellas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg><span id="cStars">0</span></span>
</header>
<main id="app"></main>
<div class="dlg" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlgT"><div class="dlg-box" id="dlgBox"></div></div>
<script>
(function(){
  var KEY = 'lupi-progreso-v1';
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function load(){
    var o;
    try { o = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { o = {}; }
    if (!o || typeof o !== 'object') o = {};
    if (!o.days || typeof o.days !== 'object') o.days = {};
    if (!o.total || typeof o.total !== 'object') o.total = {};
    return o;
  }
  function add(game, n){
    n = Number(n) || 0;
    if (n <= 0) return;
    var o = load();
    var k = dateKey(new Date());
    if (!o.days[k]) o.days[k] = {};
    o.days[k][game] = (o.days[k][game] || 0) + n;
    o.total[game] = (o.total[game] || 0) + n;
    var cut = new Date(); cut.setDate(cut.getDate() - 400);
    var cutKey = dateKey(cut);
    Object.keys(o.days).forEach(function(d){ if (d < cutKey) delete o.days[d]; });
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }
  /* Estrellas del mes en curso: el marcador vuelve a cero el día 1 de cada mes. */
  function month(){
    var o = load(), pre = dateKey(new Date()).slice(0, 7), per = {}, sum = 0;
    Object.keys(o.days).forEach(function(d){
      if (d.slice(0, 7) !== pre) return;
      Object.keys(o.days[d]).forEach(function(g){ var n = Number(o.days[d][g]) || 0; per[g] = (per[g] || 0) + n; sum += n; });
    });
    return { key: pre, sum: sum, per: per };
  }
  /* ----- tiempo dedicado: segundos por día y por juego, solo mientras se juega de verdad ----- */
  var TKEY = 'lupi-tiempo-v1';
  function loadTime(){ var o; try { o = JSON.parse(localStorage.getItem(TKEY) || '{}'); } catch (e) { o = {}; } return (o && typeof o === 'object') ? o : {}; }
  function addTime(game, secs){
    var o = loadTime(), k = dateKey(new Date());
    if (!o[k] || typeof o[k] !== 'object') o[k] = {};
    o[k][game] = (Number(o[k][game]) || 0) + secs;
    var cut = new Date(); cut.setDate(cut.getDate() - 400); var ck = dateKey(cut);
    Object.keys(o).forEach(function(d){ if (d < ck) delete o[d]; });
    try { localStorage.setItem(TKEY, JSON.stringify(o)); } catch (e) {}
  }
  function timeOf(key){ var r = loadTime()[key] || {}, per = {}, sum = 0; Object.keys(r).forEach(function(g){ var n = Number(r[g]) || 0; per[g] = n; sum += n; }); return { sum: sum, per: per }; }
  function fmtTime(s){ var m = Math.floor((Number(s) || 0) / 60); if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : ''); }
  /* cuenta de 5 en 5 segundos si la página está a la vista y ha habido actividad en los últimos 3 minutos */
  function startTimer(game, isActive){
    var last = Date.now(), STEP = 5000, IDLE = 180000;
    ['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll'].forEach(function(ev){ window.addEventListener(ev, function(){ last = Date.now(); }, { passive: true, capture: true }); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) last = Date.now(); });
    setInterval(function(){
      if (document.hidden || Date.now() - last > IDLE) return;
      if (isActive && !isActive()) return;
      addTime(game, STEP / 1000);
    }, STEP);
  }
  window.LupiScore = { add: add, load: load, dateKey: dateKey, month: month, timeOf: timeOf, fmtTime: fmtTime, startTimer: startTimer };
})();
</script>
<script>
(function(){
  'use strict';
  /* ================= Dibujos para colorear =================
     Lienzo 400 × 400. Cada pieza con class="f" se puede pintar por separado.
     class="l" = línea de detalle (no se pinta) · class="k" = detalle negro (no se pinta). */
  function A(o){ var s = ''; for (var k in o) s += ' ' + k + '="' + o[k] + '"'; return s; }
  function C(cx, cy, r){ return '<circle class="f" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>'; }
  function E(cx, cy, rx, ry, rot){ return '<ellipse class="f" cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '"' + (rot ? ' transform="rotate(' + rot + ' ' + cx + ' ' + cy + ')"' : '') + '/>'; }
  function P(d){ return '<path class="f" d="' + d + '"/>'; }
  function R(x, y, w, h, r){ return '<rect class="f" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (r || 0) + '"/>'; }
  function L(d){ return '<path class="l" d="' + d + '"/>'; }
  function K(cx, cy, r){ return '<circle class="k" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>'; }
  function BG(){ return '<rect class="f bg" x="0" y="0" width="400" height="400"/>'; }
  function G(t, inner){ return '<g transform="' + t + '">' + inner + '</g>'; }
  function mirror(inner){ return G('translate(400 0) scale(-1 1)', inner); }
  function cloud(x, y, s){ return '<path class="f" transform="translate(' + x + ' ' + y + ') scale(' + (s || 1) + ')" d="M20 50 Q0 50 2 34 Q4 20 20 22 Q24 4 44 6 Q60 6 66 20 Q84 14 92 28 Q100 46 82 50 Z"/>'; }
  function star(cx, cy, r){
    var p = '', i, a, rr;
    for (i = 0; i < 10; i++){ a = -Math.PI / 2 + i * Math.PI / 5; rr = i % 2 ? r * .45 : r; p += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1) + ' '; }
    return P(p + 'Z');
  }
  function sun(cx, cy, r){
    var s = '', i, a, a1, a2;
    for (i = 0; i < 8; i++){
      a = i * Math.PI / 4; a1 = a - .2; a2 = a + .2;
      s += P('M' + (cx + (r + 6) * Math.cos(a1)).toFixed(1) + ' ' + (cy + (r + 6) * Math.sin(a1)).toFixed(1) + ' L' + (cx + (r + 26) * Math.cos(a)).toFixed(1) + ' ' + (cy + (r + 26) * Math.sin(a)).toFixed(1) + ' L' + (cx + (r + 6) * Math.cos(a2)).toFixed(1) + ' ' + (cy + (r + 6) * Math.sin(a2)).toFixed(1) + ' Z');
    }
    return s + C(cx, cy, r);
  }
  function flower(cx, cy, r, stemTo){
    var s = stemTo ? L('M' + cx + ' ' + cy + ' V' + stemTo) : '', i, a;
    for (i = 0; i < 5; i++){ a = -Math.PI / 2 + i * 2 * Math.PI / 5; s += C((cx + r * Math.cos(a)).toFixed(1), (cy + r * Math.sin(a)).toFixed(1), (r * .62).toFixed(1)); }
    return s + C(cx, cy, (r * .55).toFixed(1));
  }
  function ground(y, d){ return P('M0 ' + y + ' Q100 ' + (y - (d || 14)) + ' 200 ' + (y - 4) + ' T400 ' + (y - 8) + ' V400 H0 Z'); }
  function birds(x, y){ return L('M' + x + ' ' + y + ' q10 -12 20 0 q10 -12 20 0 M' + (x + 50) + ' ' + (y + 24) + ' q8 -10 16 0 q8 -10 16 0'); }
  function eye(cx, cy, r){ return C(cx, cy, r) + K(cx, cy + 1, (r * .5).toFixed(1)); }

  var COL_THEMES = [
    { id: 'animales', name: 'Animales', icon: '🐾', color: '#FFB86B' },
    { id: 'bichitos', name: 'Bichitos del jardín', icon: '🐞', color: '#A5E08A' },
    { id: 'mar', name: 'El mar', icon: '🌊', color: '#7FC4FF' },
    { id: 'espacio', name: 'El espacio', icon: '🚀', color: '#B9A4FF' },
    { id: 'naturaleza', name: 'Naturaleza', icon: '🌳', color: '#8FDDB0' },
    { id: 'vehiculos', name: 'Vehículos', icon: '🚗', color: '#FF9FB5' }
  ];
  var COL_DESIGNS = [
    /* ---------------- Animales ---------------- */
    { id: 'gato', t: 'animales', name: 'El gato', draw: function(){
      return BG() + sun(336, 62, 24) + cloud(30, 40, 1) + ground(338) +
        C(326, 342, 24) + L('M308 338 Q326 322 344 338 M310 350 Q326 336 342 350') +
        P('M262 310 Q340 306 330 232 Q326 204 304 210 Q288 220 300 244 Q312 280 258 284 Z') +
        E(200, 286, 72, 78) + E(200, 300, 40, 52) +
        E(164, 356, 26, 14) + E(236, 356, 26, 14) +
        P('M130 124 L136 50 L198 96 Z') + P('M270 124 L264 50 L202 96 Z') +
        P('M146 106 L150 76 L176 96 Z') + P('M254 106 L250 76 L224 96 Z') +
        E(200, 152, 86, 72) +
        P('M186 84 L200 108 L214 84 Z') +
        E(166, 146, 15, 19) + K(166, 149, 8) + E(234, 146, 15, 19) + K(234, 149, 8) +
        P('M189 170 L211 170 L200 183 Z') +
        L('M200 183 Q200 198 184 197 M200 183 Q200 198 216 197') +
        L('M150 172 L106 162 M150 182 L106 190 M250 172 L294 162 M250 182 L294 190');
    } },
    { id: 'perro', t: 'animales', name: 'El perro', draw: function(){
      return BG() + sun(60, 62, 24) + cloud(280, 44, 1) + ground(340) +
        P('M300 332 a11 11 0 1 1 12 -12 h44 a11 11 0 1 1 12 12 a11 11 0 1 1 -12 12 h-44 a11 11 0 1 1 -12 -12 Z') +
        P('M262 304 Q332 286 324 232 Q308 246 298 264 Q286 282 258 284 Z') +
        P('M136 364 Q126 252 200 242 Q274 252 264 364 Z') +
        E(200, 306, 34, 46) +
        E(168, 360, 26, 14) + E(232, 360, 26, 14) +
        P('M150 228 Q200 256 250 228 L253 246 Q200 274 147 246 Z') + C(200, 268, 11) +
        E(200, 160, 82, 74) +
        P('M128 116 Q88 124 92 192 Q98 226 124 216 Q144 200 140 148 Z') +
        P('M272 116 Q312 124 308 192 Q302 226 276 216 Q256 200 260 148 Z') +
        E(234, 146, 26, 28) +
        E(200, 192, 44, 32) +
        E(200, 176, 15, 11) +
        K(168, 148, 8) + K(234, 148, 8) +
        L('M200 187 V200 M200 200 Q188 213 174 204 M200 200 Q212 213 226 204') +
        P('M190 208 H210 V218 Q200 232 190 218 Z');
    } },
    { id: 'conejo', t: 'animales', name: 'El conejo', draw: function(){
      return BG() + cloud(20, 30, .9) + cloud(290, 60, .9) + ground(350) +
        flower(52, 318, 13, 352) + flower(96, 330, 10, 352) +
        P('M322 300 H352 L337 374 Z') + L('M330 318 H344 M333 338 H341') +
        P('M337 300 Q318 270 328 258 Q340 274 337 300 Z') + P('M337 300 Q356 272 348 258 Q334 274 337 300 Z') +
        E(170, 92, 23, 72, -8) + E(230, 92, 23, 72, 8) + E(170, 98, 10, 50, -8) + E(230, 98, 10, 50, 8) +
        E(200, 304, 74, 70) + E(200, 316, 42, 46) +
        E(158, 366, 32, 15) + E(242, 366, 32, 15) +
        E(138, 292, 16, 30, 20) + E(262, 292, 16, 30, -20) +
        E(200, 192, 76, 64) +
        C(156, 208, 12) + C(244, 208, 12) +
        K(174, 182, 8) + K(226, 182, 8) +

        grid.appendChild(b);
      });
    }
    refresh(); draw(); wrapEl.appendChild(prev); wrapEl.appendChild(lists); app.appendChild(wrapEl);
  }

  /* ---------- PDF hecho en el navegador: una hoja A4 con el dibujo ---------- */
  var IN_CLAUDE = !!window.claude || /(^|\.)claudeusercontent\.com$|(^|\.)claude\.ai$/.test(location.hostname);
  function pdfBytes(jpg, w, h){
    var enc = function(s){ var a = new Uint8Array(s.length), i; for (i = 0; i < s.length; i++) a[i] = s.charCodeAt(i) & 255; return a; };

    var out = new Uint8Array(pos), p = 0; parts.forEach(function(a){ out.set(a, p); p += a.length; }); return out;
  }
  /* hoja de 1240 × 1754 puntos (A4 a 150 ppp); paintCv = lo pintado, o nada para la hoja en blanco */
  function sheetPdf(d, paintCv){
    var W = 1240, H = 1754, SZ = 1040, X = (W - SZ) / 2, Y = 300;
    return raster(d.draw(), SZ).then(function(art){
      var c = document.createElement('canvas'); c.width = W; c.height = H; var x = c.getContext('2d');
      x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, W, H); x.fillStyle = '#000000'; x.textAlign = 'center';
      x.font = '800 26px Nunito, Arial, sans-serif'; x.fillText('APRENDE CON LUPI · COLOREABLES', W / 2, 130);
      x.font = '800 78px "Baloo 2", Nunito, Arial, sans-serif'; x.fillText(d.name, W / 2, 230, W - 200);
      if (paintCv){ toInk(art); x.drawImage(paintCv, X, Y, SZ, SZ); }
      x.drawImage(art, X, Y, SZ, SZ);
      x.lineWidth = 8; x.strokeStyle = '#000000'; x.strokeRect(X, Y, SZ, SZ);
      x.textAlign = 'left'; x.font = '700 34px Nunito, Arial, sans-serif'; x.fillText('Nombre: ______________________________     Fecha: ______________', X, Y + SZ + 110, SZ);
      var b = atob(c.toDataURL('image/jpeg', .92).split(',')[1]), a = new Uint8Array(b.length), i; for (i = 0; i < b.length; i++) a[i] = b.charCodeAt(i);

    });
  }
  var lastUrl = null;
  function pdfGet(d, paintCv, msg, btn){
    var name = 'Colorear - ' + d.name + (paintCv ? ' (pintado)' : '') + '.pdf';
    var NO = 'Aquí no se puede descargar. Abre esta página desde la app de Claude con tu cuenta, o hazlo desde un ordenador.';
    btn.disabled = true; msg.textContent = 'Preparando el PDF…';
    sheetPdf(d, paintCv).then(function(bytes){
      if (!IN_CLAUDE){
        if (lastUrl) URL.revokeObjectURL(lastUrl);
        lastUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
        var a = document.createElement('a'); a.href = lastUrl; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
        msg.textContent = '✓ Descarga iniciada. Imprímelo en tamaño A4. ';
        var o = el('a', '', 'Abrir el PDF'); o.href = lastUrl; o.target = '_blank'; o.rel = 'noopener'; msg.appendChild(o); return;
      }
      var use = window.claude && typeof window.claude.use === 'function' ? Promise.resolve(window.claude.use('downloads')).catch(function(){ return null; }) : Promise.resolve(null);
      return use.then(function(dl){
        if (!dl){ msg.textContent = NO; return; }
        return dl.save({ filename: name, data: bytes.buffer }).then(function(){ msg.textContent = '✓ Listo. Imprímelo en tamaño A4.'; },
          function(e){ var c = e && e.code; msg.textContent = c === 'declined' ? 'Descarga cancelada.' : c === 'rate_limited' ? 'Espera un momento y vuelve a intentarlo.' : NO; });
      });
    }, function(){ msg.textContent = 'No se ha podido preparar el PDF. Vuelve a intentarlo.'; }).then(function(){ btn.disabled = false; });
  }

  /* ---------- pintar con pinceles ---------- */
  var N = 800;
  var BRUSH = [
    { id: 'lapiz', n: 'Lápiz', ic: '✏️', w: [4, 7, 12], a: .92, tex: .14 },
    { id: 'rotu', n: 'Rotulador', s: 'Rotu', ic: '🖊️', w: [14, 24, 40], a: 1 },
    { id: 'pincel', n: 'Pincel', ic: '🖌️', w: [22, 38, 62], a: .78, soft: 1 },
    { id: 'cera', n: 'Cera', ic: '🖍️', w: [16, 28, 46], a: .95, tex: .4 },
    { id: 'spray', n: 'Espray', ic: '💨', w: [20, 34, 54], a: 1, spray: 1 },
    { id: 'cubo', n: 'Cubo', ic: '🪣', fill: 1 },
    { id: 'goma', n: 'Goma', ic: '🧽', w: [20, 38, 64], a: 1, erase: 1 }
  ];
  var PREF = { b: 'rotu', s: 1, c: PALETTE[0][1], in: false };
  var PATS = {};
  function pattern(ctx, color, hole){
    var k = color + hole; if (PATS[k]) return PATS[k];
    var c = document.createElement('canvas'); c.width = c.height = 96; var x = c.getContext('2d'), im = x.createImageData(96, 96), p = im.data, i;
    var r = parseInt(color.slice(1, 3), 16), g = parseInt(color.slice(3, 5), 16), b = parseInt(color.slice(5, 7), 16);
    for (i = 0; i < p.length; i += 4){ p[i] = r; p[i + 1] = g; p[i + 2] = b; p[i + 3] = Math.random() < hole ? 0 : 150 + Math.random() * 105; }
    x.putImageData(im, 0, 0); return (PATS[k] = ctx.createPattern(c, 'repeat'));
  }
  function paint(d){
    clear(); view = 'dibujo';
    var top = el('div', 'row'); top.appendChild(button('← Dibujos', 'btn', function(){ go(d.custom ? '#' : '#tema-' + d.t); })); top.appendChild(el('h2', '', d.name)); app.appendChild(top);
    var wrapEl = el('div', 'paint'), stage = el('div', 'stage'), side = el('div', 'side');
    var pc = el('canvas'), lc = el('canvas'), ic = el('canvas', 'ink');
    [pc, lc, ic].forEach(function(c){ c.width = c.height = N; stage.appendChild(c); });
    stage.setAttribute('role', 'img'); stage.setAttribute('aria-label', d.name + ', dibujo para pintar');
    var px = pc.getContext('2d', { willReadFrequently: true }), lx = lc.getContext('2d'), ix = ic.getContext('2d');
    var wall = null, ready = false, undo = [], dirty = false, timer = 0, alive = true;
    var maskCv = document.createElement('canvas'); maskCv.width = maskCv.height = N; var mx = maskCv.getContext('2d'), mask = false;
    var msg = el('p', 'msg'); msg.setAttribute('aria-live', 'polite'); msg.textContent = 'Preparando el dibujo…';

    function flush(){
      if (!dirty) return; dirty = false; clearTimeout(timer);
      var t = document.createElement('canvas'); t.width = t.height = 220; var tx = t.getContext('2d');
      tx.fillStyle = '#FFFFFF'; tx.fillRect(0, 0, 220, 220); tx.drawImage(pc, 0, 0, 220, 220); tx.drawImage(ic, 0, 0, 220, 220);
      var rec = { png: pc.toDataURL('image/png'), thumb: t.toDataURL('image/jpeg', .72) }; THUMBS[d.id] = rec.thumb;
      dbPut(d.id, rec).then(function(ok){ if (!ok && alive) msg.textContent = 'No se ha podido guardar lo pintado en este dispositivo.'; else if (ok && hasOld(d)){ delete S.fills[d.id]; save(); } });
    }
    function changed(){ dirty = true; clearTimeout(timer); timer = setTimeout(flush, 900); un.disabled = !undo.length; }
    function snap(){ try { undo.push(px.getImageData(0, 0, N, N)); if (undo.length > 8) undo.shift(); } catch (e) {} }
    leave = function(){ alive = false; flush(); };

    /* la zona cerrada por las líneas que contiene el punto (para el cubo y para no salirse) */
    function region(sx, sy){
      var s = sy * N + sx, dx, dy, r, found = -1;
      if (wall[s]){ for (r = 1; r <= 12 && found < 0; r++) for (dy = -r; dy <= r && found < 0; dy += r) for (dx = -r; dx <= r; dx += r){ var q = (sy + dy) * N + sx + dx; if (sx + dx >= 0 && sx + dx < N && sy + dy >= 0 && sy + dy < N && !wall[q]){ found = q; break; } } if (found < 0) return false; s = found; }
      var m = new Uint8Array(N * N), st = new Int32Array(N * N), n = 0, i, x, k, pass;
      m[s] = 1; st[n++] = s;
      while (n){ i = st[--n]; x = i % N;
        if (x > 0 && !m[i - 1] && !wall[i - 1]){ m[i - 1] = 1; st[n++] = i - 1; }
        if (x < N - 1 && !m[i + 1] && !wall[i + 1]){ m[i + 1] = 1; st[n++] = i + 1; }
        if (i >= N && !m[i - N] && !wall[i - N]){ m[i - N] = 1; st[n++] = i - N; }
        if (i < N * N - N && !m[i + N] && !wall[i + N]){ m[i + N] = 1; st[n++] = i + N; } }

      for (pass = 0; pass < 3; pass++){ var add = []; for (i = N; i < N * N - N; i++) if (!m[i] && (m[i - 1] || m[i + 1] || m[i - N] || m[i + N])) add.push(i); for (k = 0; k < add.length; k++) m[add[k]] = 1; }
      var im = mx.createImageData(N, N), p = im.data; for (i = 0; i < N * N; i++) if (m[i]) p[i * 4 + 3] = 255;
      mx.putImageData(im, 0, 0); return true;
    }
    function pos(e){ var r = stage.getBoundingClientRect(), b = stage.clientLeft || 0; return [(e.clientX - r.left - b) * N / (r.width - 2 * b), (e.clientY - r.top - b) * N / (r.height - 2 * b)]; }
    var cur = null, last = null, br = null;
    function seg(a, b){
      if (br.spray){
        var rad = br.w[PREF.s], dist = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.round(14 + dist * .9), i, t, ang, rr;
        lx.fillStyle = cur;
        for (i = 0; i < n; i++){ t = Math.random(); ang = Math.random() * 6.283; rr = rad * Math.sqrt(Math.random()); lx.fillRect(a[0] + (b[0] - a[0]) * t + rr * Math.cos(ang), a[1] + (b[1] - a[1]) * t + rr * Math.sin(ang), 2.2, 2.2); }
      } else { lx.beginPath(); lx.moveTo(a[0], a[1]); lx.lineTo(b[0] + .01, b[1] + .01); lx.stroke(); }

    }
    function down(e){
      if (!ready || (e.pointerType === 'mouse' && e.button !== 0) || last) return;
      e.preventDefault(); br = BRUSH.filter(function(b){ return b.id === PREF.b; })[0]; var p = pos(e), sx = Math.max(0, Math.min(N - 1, Math.round(p[0]))), sy = Math.max(0, Math.min(N - 1, Math.round(p[1])));
      msg.textContent = '';
      if (br.fill){
        if (!region(sx, sy)) return;
        snap(); mx.globalCompositeOperation = 'source-in'; mx.fillStyle = PREF.c; mx.fillRect(0, 0, N, N); mx.globalCompositeOperation = 'source-over';
        px.drawImage(maskCv, 0, 0); changed(); return;
      }
      try { stage.setPointerCapture(e.pointerId); } catch (x) {}
      snap(); mask = PREF.in && region(sx, sy);
      cur = br.erase ? '#FFFFFF' : PREF.c; lx.clearRect(0, 0, N, N); lc.style.opacity = br.a;
      lx.lineCap = lx.lineJoin = 'round'; lx.shadowBlur = 0; lx.shadowColor = 'transparent';
      lx.lineWidth = br.soft ? br.w[PREF.s] * .62 : br.w[PREF.s];
      lx.strokeStyle = br.tex ? pattern(lx, cur, br.tex) : cur;
      if (br.soft){ lx.shadowColor = cur; lx.shadowBlur = br.w[PREF.s] * .3; }
      last = p; seg(p, p);
    }
    function move(e){
      if (!last) return; e.preventDefault();
      var ev = e.getCoalescedEvents ? e.getCoalescedEvents() : null; if (!ev || !ev.length) ev = [e];
      ev.forEach(function(q){ var p = pos(q); seg(last, p); last = p; });
    }
    function up(){
      if (!last) return; last = null; mask = false;
      px.globalAlpha = br.a; px.drawImage(lc, 0, 0); px.globalAlpha = 1; lx.shadowBlur = 0; lx.clearRect(0, 0, N, N); changed();
    }
    stage.addEventListener('pointerdown', down); stage.addEventListener('pointermove', move);
    stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up); stage.addEventListener('lostpointercapture', up);
    stage.addEventListener('contextmenu', function(e){ e.preventDefault(); });

    /* herramientas */
    function group(cls, label){ var g = el('div', cls); g.setAttribute('role', 'group'); g.setAttribute('aria-label', label); return g; }
    function choose(g, b){ Array.prototype.forEach.call(g.children, function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); }
    var tools = group('tools', 'Pinceles');
    BRUSH.forEach(function(b){
      var t = el('button', 'tool'); t.type = 'button'; var i = el('i', '', b.ic); i.setAttribute('aria-hidden', 'true'); t.appendChild(i); t.appendChild(document.createTextNode(b.s || b.n)); t.title = b.n; if (b.s) t.setAttribute('aria-label', b.n);
      t.setAttribute('aria-pressed', PREF.b === b.id ? 'true' : 'false');
      t.addEventListener('click', function(){ PREF.b = b.id; choose(tools, t); }); tools.appendChild(t);
    });
    var sizes = group('sizes', 'Grosor');
    [['Fino', 8], ['Medio', 15], ['Gordo', 24]].forEach(function(z, k){
      var b = el('button', 'btn'); b.type = 'button'; b.setAttribute('aria-label', 'Grosor ' + z[0].toLowerCase()); b.title = z[0];
      var dt = el('span', 'dot'); dt.style.width = dt.style.height = z[1] + 'px'; b.appendChild(dt);
      b.setAttribute('aria-pressed', PREF.s === k ? 'true' : 'false');
      b.addEventListener('click', function(){ PREF.s = k; choose(sizes, b); }); sizes.appendChild(b);
    });
    var inb = button('', 'btn', function(){ PREF.in = !PREF.in; inb.setAttribute('aria-pressed', PREF.in ? 'true' : 'false'); });
    inb.setAttribute('aria-pressed', PREF.in ? 'true' : 'false'); inb.title = 'El color no se sale de la zona donde empiezas a pintar';

    var pal = group('pal', 'Colores');
    PALETTE.forEach(function(c){
      var b = el('button', 'sw'); b.type = 'button'; b.style.background = c[1]; b.setAttribute('aria-label', c[0]); b.title = c[0]; b.setAttribute('aria-pressed', PREF.c === c[1] ? 'true' : 'false');
      b.addEventListener('click', function(){ PREF.c = c[1]; choose(pal, b); if (PREF.b === 'goma'){ PREF.b = 'rotu'; choose(tools, tools.children[1]); } });
      pal.appendChild(b);
    });
    var sure = false, row3 = el('div', 'row');
    var un = button('', 'btn', function(){ var u = undo.pop(); if (!u) return; px.putImageData(u, 0, 0); changed(); }); un.disabled = true;
    var wipe = button('🗑️ Borrar todo', 'btn', function(){
      if (!sure){ sure = true; wipe.textContent = '¿Seguro? Toca otra vez'; setTimeout(function(){ sure = false; wipe.textContent = '🗑️ Borrar todo'; }, 4000); return; }
      sure = false; wipe.textContent = '🗑️ Borrar todo'; snap(); px.clearRect(0, 0, N, N); changed();
    });
    row3.appendChild(wipe);
    var row4 = el('div', 'row');
    var p1 = button('🖨️ PDF en blanco', 'btn', function(){ pdfGet(d, null, msg, p1); });
    var p2 = button('🎨 PDF con mis colores', 'btn main', function(){ pdfGet(d, pc, msg, p2); });
    row4.appendChild(p1); row4.appendChild(p2);
    [[inb, '🚧', 'Sin salirme'], [un, '↩️', 'Deshacer']].forEach(function(q){ var i = el('i', '', q[1]); i.setAttribute('aria-hidden', 'true'); q[0].appendChild(i); q[0].appendChild(document.createTextNode(q[2])); });
    var bar = el('div', 'bar'), opts = el('div', 'popts');
    opts.appendChild(sizes); opts.appendChild(inb); opts.appendChild(un);
    bar.appendChild(tools); bar.appendChild(pal); bar.appendChild(opts);
    side.appendChild(bar); side.appendChild(msg); side.appendChild(row3); side.appendChild(row4);
    side.appendChild(el('p', 'note', 'Elige pincel y color y pinta con el dedo o con el ratón. Se guarda solo.'));
    wrapEl.appendChild(stage); wrapEl.appendChild(side); app.appendChild(wrapEl);

    /* líneas del dibujo y lo que ya estuviera pintado */
    raster(d.draw(), N).then(function(art){
      if (!alive) return;
      wall = toInk(art); ix.drawImage(art, 0, 0);
      return dbGet(d.id).then(function(rec){
        if (rec && rec.png) return new Promise(function(res){ var im = new Image(); im.onload = function(){ if (alive) px.drawImage(im, 0, 0, N, N); res(); }; im.onerror = function(){ res(); }; im.src = rec.png; });
        if (hasOld(d)) return raster(oldFilled(d), N).then(function(c){ if (alive){ px.drawImage(c, 0, 0); dirty = true; timer = setTimeout(flush, 900); } });
      }).then(function(){ if (alive){ ready = true; msg.textContent = ''; } });
    }).catch(function(){ if (alive) msg.textContent = 'No se ha podido preparar el dibujo en este navegador.'; });
  }

  function route(){
    var h = location.hash.replace(/^#/, ''), m;
    if (!dlg.hidden) closeDlg();
    paintStars();
    if ((m = /^dibujo-([a-z0-9]+)$/.exec(h)) && BY[m[1]]){
      if (owned(BY[m[1]])) return paint(BY[m[1]]);
      theme(TBY[BY[m[1]].t]); return buy(BY[m[1]]);
    }
    if ((m = /^tema-([a-z]+)$/.exec(h)) && TBY[m[1]]) return theme(TBY[m[1]]);
    if (h === 'crear') return maker();
    home();
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('pageshow', paintStars);
  window.addEventListener('pagehide', function(){ if (leave) leave(); });
  route();
  dbThumbs().then(function(){ if (view === 'home' || view === 'tema') route(); });
  if (window.LupiScore) window.LupiScore.startTimer('coloreables', function(){ return view === 'dibujo' || view === 'crear'; });
})();
