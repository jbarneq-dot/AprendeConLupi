<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coloreables</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{color-scheme:light; --ink:#2B2250; --soft:#5B5480; --bg:#FFF6E4; --card:#FFFFFF; --line:#E6DCC8; --accent:#7F5AF0; --sun:#FFC83D; --coral:#FF6B4A; --ok:#2E9B6A;
  --display:'Baloo 2','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;}
*{box-sizing:border-box}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0; background:var(--bg); color:var(--ink); font:700 17px/1.4 var(--body);}
button{font:inherit; color:inherit;}
[hidden]{display:none!important}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 16px; background:var(--accent); color:#FFFFFF; box-shadow:0 4px 0 rgba(43,34,80,.18);}
.top h1{flex:1 1 auto; min-width:0; margin:0; font:800 clamp(24px,6vw,34px)/1 var(--display);}
.exit{display:inline-flex; align-items:center; gap:6px; min-height:46px; padding:0 16px; border-radius:999px; background:var(--coral); color:#FFFFFF; border:3px solid #FFFFFF; font:800 19px/1 var(--display); text-decoration:none;}
.stars{display:inline-flex; align-items:center; gap:6px; min-height:46px; padding:0 14px; border-radius:999px; background:#FFFFFF; color:var(--ink); font:800 21px/1 var(--display);}
.stars svg{width:24px; height:24px; fill:var(--sun); stroke:#B07A00; stroke-width:1.2;}
.exit:focus-visible,.btn:focus-visible,.tcard:focus-visible,.dcard:focus-visible,.sw:focus-visible{outline:3px solid var(--ink); outline-offset:3px;}
main{max-width:980px; margin:0 auto; padding:18px 16px 40px; display:flex; flex-direction:column; gap:16px;}
h2{margin:0; font:800 clamp(22px,5vw,30px)/1.1 var(--display); text-wrap:balance;}
.lead{margin:0; max-width:62ch;}
.note{margin:0; color:var(--soft); font-size:15px;}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}
.tcard,.dcard{display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 10px; border-radius:22px; border:3px solid var(--ink); background:var(--card); cursor:pointer; text-align:center; box-shadow:0 6px 0 rgba(43,34,80,.16); min-width:0;}
.tcard:active,.dcard:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(43,34,80,.16);}
.tcard .ic{font-size:54px; line-height:1.1;}
.tcard b,.dcard b{font:800 20px/1.1 var(--display);}
.tcard span,.dcard span{font-size:14px; color:var(--soft);}
.dcard{padding:10px;}
.dcard svg{width:100%; height:auto; border-radius:14px; border:2px solid var(--line); background:#FFFFFF;}
.tag{display:inline-flex; align-items:center; gap:4px; padding:3px 12px; border-radius:999px; font:800 15px/1.3 var(--display); background:var(--sun); color:#3A2A00;}
.dcard .tag{color:#3A2A00; font-size:16px;}
.tag.mine{background:#D8F5E4; color:#0F5132;}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
.btn{min-height:50px; padding:8px 18px; border-radius:16px; border:3px solid var(--ink); background:#FFFFFF; font:800 18px/1.1 var(--display); cursor:pointer; display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:var(--ink);}
.btn.main{background:var(--sun);}
.btn.go{background:var(--accent); color:#FFFFFF;}
.btn:disabled{opacity:.5; cursor:default;}
.f{fill:#FFFFFF; stroke:#1B1B2B; stroke-width:5; stroke-linejoin:round; stroke-linecap:round;}
.bg{stroke:none;}
.l{fill:none; stroke:#1B1B2B; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; pointer-events:none;}
.k{fill:#1B1B2B; pointer-events:none;}
.paint{display:grid; grid-template-columns:minmax(0,1fr); gap:14px; align-items:start;}
.canvas{width:100%; max-width:min(620px,74vh); margin:0 auto; border:4px solid var(--ink); border-radius:22px; overflow:hidden; background:#FFFFFF; box-shadow:0 6px 0 rgba(43,34,80,.16);}
.canvas svg{display:block; width:100%; height:auto; touch-action:manipulation; cursor:pointer; -webkit-tap-highlight-color:transparent;}
.side{display:flex; flex-direction:column; gap:12px; min-width:0;}
.pal{display:grid; grid-template-columns:repeat(auto-fill,minmax(46px,1fr)); gap:8px; padding:12px; border-radius:20px; background:var(--card); border:3px solid var(--ink);}
.sw{aspect-ratio:1; min-height:44px; border-radius:50%; border:3px solid var(--ink); cursor:pointer; padding:0;}
.sw[aria-pressed="true"]{box-shadow:0 0 0 4px #FFFFFF, 0 0 0 8px var(--accent); transform:scale(.92);}
.msg{margin:0; min-height:1.4em; font-size:15px;}
@media (min-width:860px){ .paint{grid-template-columns:minmax(0,1fr) 300px;} .canvas{margin:0;} }
.dlg{position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(43,34,80,.6);}
.dlg-box{width:100%; max-width:380px; max-height:100%; overflow:auto; padding:18px; border-radius:24px; background:#FFFFFF; border:4px solid var(--ink); display:flex; flex-direction:column; gap:12px; text-align:center;}
.dlg-box svg{width:70%; max-width:220px; height:auto; margin:0 auto; border-radius:14px; border:2px solid var(--line);}
.dlg-box p{margin:0;}
.dlg-box .row{justify-content:center;}
/* hoja A4 para el PDF */
.sheet{display:none;}
body.print{background:#FFFFFF;}
body.print .top, body.print main{display:none;}
body.print .sheet{display:block; width:186mm; margin:0 auto; text-align:center; color:#000000;}
.sheet .sh-top{font:800 11pt/1.2 var(--body); letter-spacing:.08em; text-transform:uppercase; margin:0 0 2mm;}
.sheet h1{font:800 30pt/1.1 var(--display); margin:0 0 5mm;}
.sheet svg{display:block; width:180mm; height:180mm; margin:0 auto; border:1mm solid #000000; border-radius:5mm;}
.sheet .f,.sheet .l{stroke:#000000;} .sheet .k{fill:#000000;}
.sheet .sh-name{margin:9mm 3mm 0; text-align:left; font:700 14pt/1.2 var(--body);}
@page{size:A4; margin:12mm;}
@media (prefers-reduced-motion:reduce){ .tcard:active,.dcard:active{transform:none;} }
</style>

<script>
(function(){
  var KEY = 'lupi-progreso-v1';
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function load(){
    var o;
    try { o = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { o = {}; }
    if (!o || typeof o !== 'object') o = {};
    if (!o.days || typeof o.days !== 'object') o.days = {};
    if (!o.total || typeof o.total !== 'object') o.total = {};
    return o;
  }
  function add(game, n){
    n = Number(n) || 0;
    if (n <= 0) return;
    var o = load();
    var k = dateKey(new Date());
    if (!o.days[k]) o.days[k] = {};
    o.days[k][game] = (o.days[k][game] || 0) + n;
    o.total[game] = (o.total[game] || 0) + n;
    var cut = new Date(); cut.setDate(cut.getDate() - 400);
    var cutKey = dateKey(cut);
    Object.keys(o.days).forEach(function(d){ if (d < cutKey) delete o.days[d]; });
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }
  /* Estrellas del mes en curso: el marcador vuelve a cero el día 1 de cada mes. */
  function month(){
    var o = load(), pre = dateKey(new Date()).slice(0, 7), per = {}, sum = 0;
    Object.keys(o.days).forEach(function(d){
      if (d.slice(0, 7) !== pre) return;
      Object.keys(o.days[d]).forEach(function(g){ var n = Number(o.days[d][g]) || 0; per[g] = (per[g] || 0) + n; sum += n; });
    });
    return { key: pre, sum: sum, per: per };
  }
  /* ----- tiempo dedicado: segundos por día y por juego, solo mientras se juega de verdad ----- */
  var TKEY = 'lupi-tiempo-v1';
  function loadTime(){ var o; try { o = JSON.parse(localStorage.getItem(TKEY) || '{}'); } catch (e) { o = {}; } return (o && typeof o === 'object') ? o : {}; }
  function addTime(game, secs){
    var o = loadTime(), k = dateKey(new Date());
    if (!o[k] || typeof o[k] !== 'object') o[k] = {};
    o[k][game] = (Number(o[k][game]) || 0) + secs;
    var cut = new Date(); cut.setDate(cut.getDate() - 400); var ck = dateKey(cut);
    Object.keys(o).forEach(function(d){ if (d < ck) delete o[d]; });
    try { localStorage.setItem(TKEY, JSON.stringify(o)); } catch (e) {}
  }
  function timeOf(key){ var r = loadTime()[key] || {}, per = {}, sum = 0; Object.keys(r).forEach(function(g){ var n = Number(r[g]) || 0; per[g] = n; sum += n; }); return { sum: sum, per: per }; }
  function fmtTime(s){ var m = Math.floor((Number(s) || 0) / 60); if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : ''); }
  /* cuenta de 5 en 5 segundos si la página está a la vista y ha habido actividad en los últimos 3 minutos */
  function startTimer(game, isActive){
    var last = Date.now(), STEP = 5000, IDLE = 180000;
    ['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll'].forEach(function(ev){ window.addEventListener(ev, function(){ last = Date.now(); }, { passive: true, capture: true }); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) last = Date.now(); });
    setInterval(function(){
      if (document.hidden || Date.now() - last > IDLE) return;
      if (isActive && !isActive()) return;
      addTime(game, STEP / 1000);
    }, STEP);
  }
  window.LupiScore = { add: add, load: load, dateKey: dateKey, month: month, timeOf: timeOf, fmtTime: fmtTime, startTimer: startTimer };
})();
</script>

  function R(x, y, w, h, r){ return '<rect class="f" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="' + (r || 0) + '"/>'; }
  function L(d){ return '<path class="l" d="' + d + '"/>'; }
  function K(cx, cy, r){ return '<circle class="k" cx="' + cx + '" cy="' + cy + '" r="' + r + '"/>'; }

  function star(cx, cy, r){
    var p = '', i, a, rr;
    for (i = 0; i < 10; i++){ a = -Math.PI / 2 + i * Math.PI / 5; rr = i % 2 ? r * .45 : r; p += (i ? 'L' : 'M') + (cx + rr * Math.cos(a)).toFixed(1) + ' ' + (cy + rr * Math.sin(a)).toFixed(1) + ' '; }
    return P(p + 'Z');
  }
  function sun(cx, cy, r){
    var s = '', i, a, a1, a2;

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){ var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function button(text, cls, fn){ var b = el('button', cls, text); b.type = 'button'; b.addEventListener('click', fn); return b; }

  /* ---------- guardado: dibujos comprados y colores puestos (solo en este dispositivo) ---------- */
  var KEY = 'lupi-coloreables-v1';
  function loadS(){
    var o; try { o = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { o = {}; }
    if (!o || typeof o !== 'object') o = {};
    if (!o.own || typeof o.own !== 'object') o.own = {};
    if (!o.fills || typeof o.fills !== 'object') o.fills = {};
    return o;
  }
  var S = loadS();
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
  /* ---------- estrellas compartidas con Aprende con Lupi (igual que la tienda y la Batalla) ---------- */
  var AKEY = 'lupi-avatar-v1';
  function avatar(){
    var o; try { o = JSON.parse(localStorage.getItem(AKEY) || '{}'); } catch (e) { o = {}; }
    if (!o || typeof o !== 'object') o = {};
    o.spent = Number(o.spent) || 0;
    var mk = window.LupiScore.dateKey(new Date()).slice(0, 7);
    if (!o.sm || o.sm.m !== mk) o.sm = { m: mk, n: o.sm ? 0 : o.spent };
    return o;
  }
  function stars(){ return Math.max(0, window.LupiScore.month().sum - avatar().sm.n); }
  function spend(n){
    var a = avatar(); if (window.LupiScore.month().sum - a.sm.n < n) return false;
    a.spent += n; a.sm.n += n;
    try { localStorage.setItem(AKEY, JSON.stringify(a)); } catch (e) { return false; }
    return true;
  }
  function paintStars(){ $('cStars').textContent = stars(); }

  /* ---------- dibujo: cada pieza lleva su número para guardar su color ---------- */
  function svgOf(d, fills, label){
    var i = 0, m = d.draw().replace(/class="f( bg)?"/g, function(all, bg){
      var c = fills && fills[i], s = 'class="f' + (bg || '') + '" data-i="' + i + '"' + (c ? ' style="fill:' + c + '"' : ''); i++; return s; });
    return '<svg viewBox="0 0 400 400" role="img" aria-label="' + (label || d.name) + '">' + m + '</svg>';
  }
  function owned(d){ return !!S.own[d.id]; }
  function ofTheme(t){ return COL_DESIGNS.filter(function(d){ return d.t === t.id; }); }

  var app = $('app'), view = '';
  function clear(){ app.textContent = ''; window.scrollTo(0, 0); }
  function go(h){ if (location.hash === h) route(); else location.hash = h; }

  function dCard(d){
    var c = el('button', 'dcard'); c.type = 'button';
    var pic = el('span'); pic.style.width = '100%'; pic.innerHTML = svgOf(d, S.fills[d.id]); c.appendChild(pic);
    c.appendChild(el('b', '', d.name));
    if (owned(d)) c.appendChild(el('span', 'tag mine', '✓ Es tuyo'));
    else c.appendChild(el('span', 'tag', '🔒 ' + PRICE + ' ⭐'));
    c.setAttribute('aria-label', d.name + (owned(d) ? ': es tuyo, abrir' : ': cuesta ' + PRICE + ' estrellas'));
    c.addEventListener('click', function(){ if (owned(d)) go('#dibujo-' + d.id); else buy(d); });
    return c;
  }
  function home(){
    view = 'home'; clear();
    app.appendChild(el('h2', '', '¿Qué te apetece colorear?'));
    app.appendChild(el('p', 'lead', 'Elige un tema y después un dibujo. Cada dibujo cuesta ' + PRICE + ' estrellas y es tuyo para siempre: puedes colorearlo aquí o descargarlo en PDF para imprimirlo.'));
    var g = el('div', 'grid');
    COL_THEMES.forEach(function(t){
      var list = ofTheme(t), mine = list.filter(owned).length;
      var c = el('button', 'tcard'); c.type = 'button'; c.style.background = t.color;
      var ic = el('span', 'ic', t.icon); ic.setAttribute('aria-hidden', 'true'); c.appendChild(ic);
      c.appendChild(el('b', '', t.name));
      var s = el('span', '', list.length + ' dibujos' + (mine ? ' · ' + mine + (mine === 1 ? ' tuyo' : ' tuyos') : '')); s.style.color = '#2B2250'; c.appendChild(s);
      c.addEventListener('click', function(){ go('#tema-' + t.id); });
      g.appendChild(c);
    });
    app.appendChild(g);
    var mineAll = COL_DESIGNS.filter(owned);
    if (mineAll.length){
      app.appendChild(el('h2', '', 'Mis dibujos'));
      var g2 = el('div', 'grid'); mineAll.forEach(function(d){ g2.appendChild(dCard(d)); }); app.appendChild(g2);
    }
  }
  function theme(t){
    view = 'tema'; clear();
    var r = el('div', 'row'); r.appendChild(button('← Temas', 'btn', function(){ go('#'); })); app.appendChild(r);
    app.appendChild(el('h2', '', t.icon + ' ' + t.name));
    app.appendChild(el('p', 'note', 'Toca un dibujo para verlo. Los que ya son tuyos se abren para colorear.'));
    var g = el('div', 'grid'); ofTheme(t).forEach(function(d){ g.appendChild(dCard(d)); }); app.appendChild(g);
  }

  /* ---------- comprar un dibujo ---------- */
  var dlg = $('dlg'), box = $('dlgBox'), dlgBack = null;
  function closeDlg(){ dlg.hidden = true; box.textContent = ''; if (dlgBack && dlgBack.focus) dlgBack.focus(); dlgBack = null; }
  dlg.addEventListener('click', function(e){ if (e.target === dlg) closeDlg(); });
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !dlg.hidden) closeDlg(); });
  function buy(d){
    dlgBack = document.activeElement; box.textContent = '';
    var h = el('h2', '', d.name); h.id = 'dlgT'; box.appendChild(h);
    var pic = el('div'); pic.innerHTML = svgOf(d); box.appendChild(pic);
    var have = stars(), r = el('div', 'row'), first;
    if (have >= PRICE){
      box.appendChild(el('p', '', 'Este dibujo cuesta ' + PRICE + ' estrellas. Tienes ' + have + '.'));
      box.appendChild(el('p', 'note', 'Será tuyo para siempre: para colorear aquí y para imprimir.'));
      first = button('Lo quiero · ' + PRICE + ' ⭐', 'btn main', function(){
        if (!spend(PRICE)){ closeDlg(); buy(d); return; }
        S.own[d.id] = 1; save(); paintStars(); dlgBack = null; closeDlg(); go('#dibujo-' + d.id);
      });
      r.appendChild(first); r.appendChild(button('Ahora no', 'btn', closeDlg));
    } else {
      box.appendChild(el('p', '', 'Este dibujo cuesta ' + PRICE + ' estrellas y tienes ' + have + '. Te faltan ' + (PRICE - have) + '.'));
      box.appendChild(el('p', 'note', 'Juega, lee cuentos o estudia en Aprende con Lupi para ganar más estrellas.'));
      first = button('Vale', 'btn main', closeDlg); r.appendChild(first);
    }
    box.appendChild(r); dlg.hidden = false; first.focus();
  }

  /* ---------- colorear ---------- */
  var IN_CLAUDE = !!window.claude || /(^|\.)claudeusercontent\.com$|(^|\.)claude\.ai$/.test(location.hostname);
  function pdfPath(d){ return 'imprimir/colorear-' + d.id + '.pdf'; }
  function pdfGet(d, msg, btn){
    var name = 'Colorear - ' + d.name + '.pdf';
    if (!IN_CLAUDE){
      var a = document.createElement('a'); a.href = pdfPath(d); a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
      msg.textContent = '✓ Descarga iniciada. Imprímelo en tamaño A4. Si no lo ves, toca «Abrir el PDF».'; return;
    }
    var NO = 'Aquí no se puede descargar. Abre esta página desde la app de Claude con tu cuenta, o hazlo desde un ordenador.';
    btn.disabled = true; msg.textContent = 'Preparando el PDF…';
    var use = window.claude && typeof window.claude.use === 'function' ? Promise.resolve(window.claude.use('downloads')).catch(function(){ return null; }) : Promise.resolve(null);
    use.then(function(dl){
      if (!dl){ msg.textContent = NO; return; }
      return fetch(pdfPath(d), { cache: 'no-cache' }).then(function(r){ if (!r.ok) throw new Error('error ' + r.status); return r.arrayBuffer(); }).then(function(buf){
        return dl.save({ filename: name, data: buf }).then(function(){ msg.textContent = '✓ Listo. Imprímelo en tamaño A4.'; },
          function(e){ var c = e && e.code; msg.textContent = c === 'declined' ? 'Descarga cancelada.' : c === 'rate_limited' ? 'Espera un momento y vuelve a intentarlo.' : NO; });
      }, function(){ msg.textContent = 'No se ha podido cargar el PDF. Comprueba la conexión y vuelve a intentarlo.'; });
    }).then(function(){ btn.disabled = false; });
  }
  function paint(d){
    view = 'dibujo'; clear();
    var fills = S.fills[d.id] || (S.fills[d.id] = {}), undo = [], color = PALETTE[0][1];
    var r = el('div', 'row'); r.appendChild(button('← Más dibujos', 'btn', function(){ go('#tema-' + d.t); })); app.appendChild(r);
    app.appendChild(el('h2', '', d.name));
    var wrap = el('div', 'paint'), cv = el('div', 'canvas'), side = el('div', 'side');
    cv.innerHTML = svgOf(d, fills, d.name + ', dibujo para colorear');
    var svg = cv.firstChild;
    var msg = el('p', 'msg'); msg.setAttribute('aria-live', 'polite');
    svg.addEventListener('click', function(e){
      var t = e.target; if (!t || !t.getAttribute || t.getAttribute('data-i') == null) return;
      var i = t.getAttribute('data-i'), prev = fills[i] || '';
      var next = color === '#FFFFFF' ? '' : color; if (prev === next) return;
      undo.push([i, prev]); if (undo.length > 200) undo.shift();
      if (next) fills[i] = next; else delete fills[i];
      t.style.fill = next || ''; save(); un.disabled = false; msg.textContent = '';
    });
    var pal = el('div', 'pal'); pal.setAttribute('role', 'group'); pal.setAttribute('aria-label', 'Colores');
    PALETTE.forEach(function(c, k){
      var b = el('button', 'sw'); b.type = 'button'; b.style.background = c[1]; b.setAttribute('aria-label', c[0]); b.title = c[0]; b.setAttribute('aria-pressed', k === 0 ? 'true' : 'false');
      if (c[1] === '#FFFFFF') b.textContent = '🧽';
      b.addEventListener('click', function(){ color = c[1]; Array.prototype.forEach.call(pal.children, function(x){ x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); }); });
      pal.appendChild(b);
    });
    var tools = el('div', 'row'), sure = false;
    var un = button('↩️ Deshacer', 'btn', function(){
      var u = undo.pop(); if (!u) return;
      if (u[1]) fills[u[0]] = u[1]; else delete fills[u[0]];
      var n = svg.querySelector('[data-i="' + u[0] + '"]'); if (n) n.style.fill = u[1] || '';
      save(); un.disabled = !undo.length;
    }); un.disabled = true;
    var wipe = button('🗑️ Borrar todo', 'btn', function(){
      if (!sure){ sure = true; wipe.textContent = '¿Seguro? Toca otra vez'; setTimeout(function(){ sure = false; wipe.textContent = '🗑️ Borrar todo'; }, 4000); return; }
      sure = false; wipe.textContent = '🗑️ Borrar todo';
      Object.keys(fills).forEach(function(i){ delete fills[i]; }); undo = []; un.disabled = true;
      Array.prototype.forEach.call(svg.querySelectorAll('[data-i]'), function(n){ n.style.fill = ''; }); save();
    });
    tools.appendChild(un); tools.appendChild(wipe);
    var pr = el('div', 'row');
    var pdf = button('🖨️ PDF para imprimir', 'btn main', function(){ pdfGet(d, msg, pdf); }); pr.appendChild(pdf);
    if (!IN_CLAUDE){ var open = el('a', 'btn', 'Abrir el PDF'); open.href = pdfPath(d); open.target = '_blank'; open.rel = 'noopener'; pr.appendChild(open); }
    side.appendChild(el('p', 'note', 'Elige un color y toca la parte del dibujo que quieras pintar. Se guarda solo.'));
    side.appendChild(pal); side.appendChild(tools); side.appendChild(pr);
    side.appendChild(el('p', 'note', 'El PDF sale sin colorear, para pintarlo en papel.')); side.appendChild(msg);
    wrap.appendChild(cv); wrap.appendChild(side); app.appendChild(wrap);
  }

  /* ---------- hoja para el PDF: coloreables.html#imprimir-gato ---------- */
  function sheet(d){
    view = 'print'; document.body.classList.add('print');
    $('sheet').innerHTML = '<p class="sh-top">Aprende con Lupi · Coloreables · ' + TBY[d.t].name + '</p><h1>' + d.name + '</h1>' + svgOf(d) + '<p class="sh-name">Nombre: ______________________________ &nbsp; Fecha: ______________</p>';
  }
  function route(){
    var h = location.hash.replace(/^#/, ''), m;
    document.body.classList.remove('print'); if (!dlg.hidden) closeDlg();
    if ((m = /^imprimir-([a-z]+)$/.exec(h)) && BY[m[1]]) return sheet(BY[m[1]]);
    paintStars();
    if ((m = /^dibujo-([a-z]+)$/.exec(h)) && BY[m[1]]){
      if (owned(BY[m[1]])) return paint(BY[m[1]]);
      theme(TBY[BY[m[1]].t]); return buy(BY[m[1]]);
    }
    if ((m = /^tema-([a-z]+)$/.exec(h)) && TBY[m[1]]) return theme(TBY[m[1]]);
    home();
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('pageshow', paintStars);
  route();
  if (window.LupiScore) window.LupiScore.startTimer('coloreables', function(){ return view === 'dibujo'; });
})();
</script>
</body>
</html>
