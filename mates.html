<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Primaria 3º</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  :root{
    color-scheme:light;
    --bg:#FFF6DF; --card:#FFFFFF; --ink:#23304A; --soft:#55627A; --line:#D8DEEA; --track:#EEF1F6;
    --accent:#0E8A6E; --on-accent:#FFFFFF; --sun:#FFC83D; --on-sun:#3A2A00;
    --good:#14713C; --good-bg:#DFF5E6; --bad:#B42318; --bad-bg:#FDE7E4;
    --prof-bg:#FFF8E1; --prof-line:#F2C230; --prof-ink:#3A2A00;
    --display:'Baloo 2', ui-rounded, system-ui, sans-serif; --body:'Nunito', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --bg:#14202E; --card:#1F2D40; --ink:#EEF3FB; --soft:#B5C0D3; --line:#3A4A62; --track:#2A3A50;
      --accent:#35C49F; --on-accent:#08261E; --sun:#FFC83D; --on-sun:#3A2A00;
      --good:#9BE3B6; --good-bg:#183F2A; --bad:#FFB4AB; --bad-bg:#4A1F1B;
    --prof-bg:#352D17; --prof-line:#9C8228; --prof-ink:#FFE8A3;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#14202E; --card:#1F2D40; --ink:#EEF3FB; --soft:#B5C0D3; --line:#3A4A62; --track:#2A3A50;
    --accent:#35C49F; --on-accent:#08261E; --sun:#FFC83D; --on-sun:#3A2A00;
    --good:#9BE3B6; --good-bg:#183F2A; --bad:#FFB4AB; --bad-bg:#4A1F1B;
    --prof-bg:#352D17; --prof-line:#9C8228; --prof-ink:#FFE8A3;
  }
  *{box-sizing:border-box}
  html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px);}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-size:18px; line-height:1.4;}
  [hidden]{display:none!important}
  .wrap{max-width:820px; margin:0 auto; padding-block:20px 40px; padding-inline:16px; display:flex; flex-direction:column; gap:16px;}
  header.top{display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .logo{width:52px; height:52px; border-radius:16px; background:var(--sun); color:var(--on-sun); display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:24px; flex:none;}
  h1{margin:0; font-family:var(--display); font-weight:800; font-size:clamp(26px,6vw,38px); line-height:1; color:var(--ink);}
  .sub{margin:2px 0 0; font-weight:700; font-size:15px; color:var(--soft);}
  h2{margin:0; font-family:var(--display); font-weight:800; font-size:clamp(22px,4.6vw,28px); line-height:1.1; color:var(--ink); text-wrap:balance;}
  .card{background:var(--card); border-radius:22px; padding:18px; display:flex; flex-direction:column; gap:12px;}
  .btn{
    min-height:52px; padding:8px 20px; border-radius:16px; border:2px solid var(--accent); background:var(--accent); color:var(--on-accent);
    font-family:var(--display); font-weight:800; font-size:20px; line-height:1.1; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn.ghost{background:transparent; color:var(--ink); border-color:var(--line);}
  a.btn{text-decoration:none;}
  .btn.sun{background:var(--sun); border-color:var(--sun); color:var(--on-sun);}
  .btn:focus-visible,.opt:focus-visible,.sec:focus-visible,.key:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .secs{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px;}
  .sec{
    text-align:left; min-height:76px; padding:12px 14px; border-radius:18px; border:2px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
    display:flex; flex-direction:column; gap:4px; font-family:var(--body);
  }
  .sec b{font-family:var(--display); font-weight:800; font-size:19px; line-height:1.1;}
  .sec span{font-weight:700; font-size:14px; color:var(--soft);}
  .sec .best{color:var(--accent); font-variant-numeric:tabular-nums;}
  .bar{height:12px; border-radius:999px; background:var(--track); overflow:hidden;}
  .bar i{display:block; height:100%; background:var(--accent); border-radius:999px;}
  .step{margin:0; font-weight:800; font-size:15px; color:var(--soft); display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-variant-numeric:tabular-nums;}
  .q{margin:0; font-family:var(--display); font-weight:700; font-size:clamp(22px,5vw,30px); line-height:1.2; color:var(--ink); text-wrap:balance;}
  .q .big{display:block; margin-top:6px; font-weight:800; font-size:clamp(38px,11vw,60px); line-height:1; letter-spacing:.04em; font-variant-numeric:tabular-nums;}
  .q .say{display:block; margin-top:6px; font-weight:800; color:var(--accent); white-space:pre-line;}
  .opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px;}
  .opt{
    min-height:60px; padding:10px 14px; border-radius:16px; border:2px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
    font-family:var(--display); font-weight:800; font-size:clamp(19px,4.4vw,24px); line-height:1.15; text-align:center;
  }
  .opt.long{font-family:var(--body); font-size:17px; text-align:left;}
  .opt[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent);}
  .opt.right{background:var(--good-bg); border-color:var(--good); color:var(--good);}
  .opt.wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--bad);}
  .opt:disabled{cursor:default;}
  .numbox{display:flex; flex-direction:column; gap:10px; align-items:center;}
  .screen{
    min-width:200px; min-height:68px; padding:6px 18px; border-radius:16px; border:3px solid var(--line); background:var(--track); color:var(--ink);
    font-family:var(--display); font-weight:800; font-size:44px; line-height:1; display:flex; align-items:center; justify-content:center; letter-spacing:.06em; font-variant-numeric:tabular-nums;
  }
  .screen.right{background:var(--good-bg); border-color:var(--good); color:var(--good);}
  .screen.wrong{background:var(--bad-bg); border-color:var(--bad); color:var(--bad);}
  .keys{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; width:100%; max-width:320px;}
  .key{min-height:56px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); font-family:var(--display); font-weight:800; font-size:26px; cursor:pointer;}
  .key.wide{font-size:15px; padding:0 2px;}
  .ttl{flex:1 1 180px; min-width:0;}
  #lupiExitBtn{position:static!important; box-shadow:none!important; min-height:48px!important; flex:none;}
  .key.go{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
  .key:disabled{opacity:.5; cursor:default;}
  .fb{margin:0; padding:12px 14px; border-radius:16px; font-weight:800; font-size:18px;}
  .fb.good{background:var(--good-bg); color:var(--good);}
  .fb.bad{background:var(--bad-bg); color:var(--bad);}
  .fb small{display:block; margin-top:4px; font-weight:700; font-size:16px;}
  .chart{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:10px;}
  .chart svg{display:block; width:100%; height:auto; max-width:520px; margin:0 auto;}
  .chart.sig{display:flex; justify-content:center; background:#EEF4EA; border-color:var(--line);}
  .chart.sig svg{width:auto; max-width:130px;}
  .q .say{overflow-wrap:anywhere;}
  .q .big.long{font-size:clamp(28px,8vw,46px); letter-spacing:.02em; overflow-wrap:anywhere;}
  .nota{margin:0; font-family:var(--display); font-weight:800; font-size:clamp(64px,18vw,96px); line-height:1; color:var(--accent); font-variant-numeric:tabular-nums;}
  .review{display:flex; flex-direction:column; gap:10px; margin:0; padding:0; list-style:none;}
  .review li{border:2px solid var(--line); border-radius:16px; padding:12px 14px; display:flex; flex-direction:column; gap:4px;}
  .review .rq{font-weight:800; color:var(--ink);}
  .review .ra{font-weight:700; color:var(--soft);}
  .review .ok{color:var(--good); font-weight:800;}
  .review .ko{color:var(--bad); font-weight:800;}
  .note{margin:0; font-weight:700; font-size:16px; color:var(--soft);}
  .subjects{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px;}
  .subject{
    min-height:150px; border-radius:22px; border:2px solid var(--line); padding:16px; cursor:pointer; text-align:left;
    display:flex; flex-direction:column; justify-content:space-between; gap:10px; font-family:var(--body); color:var(--ink); background:var(--card);
  }
  .subject:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .subject .ic{width:58px; height:58px; border-radius:18px; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:26px;}
  .subject b{font-family:var(--display); font-weight:800; font-size:26px; line-height:1;}
  .subject span{font-weight:700; font-size:15px; color:var(--soft);}
  .crumbs{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .crumbs .btn{min-height:44px; font-size:17px; padding:4px 14px;}
  .temas{display:flex; flex-direction:column; gap:10px;}
  .st-go{font-size:21px;}
  .st-ask{text-decoration:none; font-size:17px; align-self:flex-start;}
  .st-idx{display:flex; flex-wrap:wrap; gap:8px;}
  .st-chip{min-height:40px; padding:4px 12px; border-radius:999px; border:2px solid var(--line); background:var(--card); color:var(--ink); font-family:var(--body); font-weight:800; font-size:14px; cursor:pointer;}
  .st-chip:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .st-part{scroll-margin-top:12px;}
  .st-h{margin:0; font-family:var(--display); font-weight:800; font-size:clamp(21px,4.6vw,26px); line-height:1.1; color:var(--accent);}
  .st-p{margin:0; font-size:18px; line-height:1.5; max-width:62ch;}
  .st-list{margin:0; padding-left:22px; display:flex; flex-direction:column; gap:6px; font-size:18px; line-height:1.45;}
  .st-ex span:last-child,.st-tip span:last-child{white-space:pre-line;}
  .st-ex,.st-tip{border-radius:16px; padding:12px 14px; font-size:18px; line-height:1.5; display:flex; flex-direction:column; gap:4px;}
  .st-ex{background:var(--track); border-left:6px solid var(--accent);}
  .st-tip{background:var(--good-bg); color:var(--ink); border-left:6px solid var(--sun);}
  .st-tag{font-family:var(--display); font-weight:800; font-size:14px; letter-spacing:.06em; text-transform:uppercase; color:var(--soft);}
  .st-calc{margin:0; padding:12px 16px; border-radius:14px; background:var(--track); font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:clamp(16px,4.4vw,20px); line-height:1.45; overflow-x:auto; color:var(--ink); font-variant-numeric:tabular-nums;}
  .chart.sig.wide svg{max-width:260px;}
  .chart.sig svg.cfig{width:auto; height:310px; max-width:100%;}
  .chart.sig svg.cface{width:130px; height:auto;}
  .chart.sig.wide.fig svg{width:100%; height:auto; max-width:520px; max-height:none;}
  .chart.sig.wide.fig svg.cfig-faces{max-width:440px;}
  .st-part .chart.fig{margin-block:4px; padding:4px;}
  .fl-menu{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:10px;}
  .fl-item{display:flex; align-items:center; gap:12px; text-align:left; padding:14px; border-radius:18px; border:2px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; font-family:var(--body); min-height:84px;}
  .fl-item:focus-visible,.fl-chip:focus-visible,.fl-card:focus-visible,.fl-key:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .fl-ic{width:52px; height:52px; flex:none; border-radius:14px; background:#EDE6FF; display:flex; align-items:center; justify-content:center; font-size:26px; color:#7F5AF0; font-weight:800;}
  .fl-ic.lv1{font-size:16px;} .fl-ic.lv2{font-size:15px;} .fl-ic.lv3{font-size:13px;}
  .fl-tx{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .fl-tx b{font-family:var(--display); font-weight:800; font-size:20px; line-height:1.1;}
  .fl-tx span{font-weight:700; font-size:14px; color:var(--soft);}
  .fl-dots{display:flex; gap:6px; flex-wrap:wrap;} .fl-dots i{width:12px; height:12px; border-radius:50%; background:var(--track);} .fl-dots i.done{background:var(--accent);} .fl-dots i.on{background:var(--sun); transform:scale(1.3);}
  .fl-pic{display:flex; justify-content:center; background:var(--track); border-radius:16px; padding:10px; overflow-x:auto;}
  .fl-pic .fl-svg{width:100%; max-width:150px; height:auto;}
  .fl-pic.wide .fl-svg{max-width:340px;}
  .fl-pic.staff{background:var(--card); border:2px solid var(--line); justify-content:flex-start;}
  .fl-pic .fl-staff{width:100%; height:auto; min-width:0;}
  .fl-note{display:grid; grid-template-columns:minmax(0,150px) minmax(0,1fr); gap:14px; align-items:start;}
  .fl-note-h{color:#7F5AF0;}
  .fl-side{display:flex; flex-direction:column; gap:10px; min-width:0;}
  .fl-cap{margin:0; font-weight:800; color:var(--soft);}
  .fl-dot{display:inline-block; width:14px; height:14px; border-radius:50%; margin-right:6px; vertical-align:-1px;}
  .fl-sys{display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-weight:800;}
  .fl-sys small{flex-basis:100%; font-weight:700; color:var(--soft); font-size:14px;}
  .fl-chip{min-height:42px; padding:4px 14px; border-radius:999px; border:2px solid var(--line); background:var(--card); color:var(--ink); font:800 15px/1.1 var(--body); cursor:pointer;}
  .fl-chip[aria-pressed="true"]{background:#7F5AF0; border-color:#7F5AF0; color:#FFFFFF;}
  .fl-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:8px;}
  .fl-card{position:relative; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 4px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; font-family:var(--body);}
  .fl-card b{font-family:var(--display); font-weight:800; font-size:18px;}
  .fl-mini{display:block; width:100%;} .fl-mini svg{display:block; width:100%; max-width:58px; height:auto; margin:0 auto;}
  .fl-card.sm .fl-mini svg{max-width:50px;}
  .fl-num{position:absolute; left:6px; top:4px; font-style:normal; font-weight:800; font-size:12px; color:var(--soft);}
  .fl-phrase{display:flex; flex-direction:column; gap:8px; padding:12px; border-radius:16px; background:var(--track);}
  .fl-phrase > b{font-family:var(--display); font-weight:800; font-size:18px;}
  .fl-names{margin:0; font-weight:800; font-size:16px; color:var(--soft);}
  .fl-stage{display:flex; flex-direction:column; gap:10px;}
  .fl-stage-top{display:grid; grid-template-columns:minmax(0,130px) minmax(0,1fr); gap:12px; align-items:center;}
  .fl-big{background:var(--track); border-radius:16px; padding:8px;} .fl-big svg{display:block; width:100%; height:auto;}
  .fl-now{display:flex; flex-direction:column; gap:6px;} .fl-now b{font-family:var(--display); font-weight:800; font-size:clamp(48px,14vw,80px); line-height:1; color:#7F5AF0;} .fl-now span{font-weight:800; color:var(--soft);}
  .fl-staves{display:flex; flex-direction:column; gap:8px;}
  .fl-pad{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px;}
  .fl-key{display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 2px; border-radius:14px; border:2px solid #C9B8FA; background:#F6F2FF; color:#2A1A66; cursor:pointer; font-family:var(--body);}
  .fl-key b{font-family:var(--display); font-weight:800; font-size:18px;}
  .fl-key .fl-mini svg{max-width:40px;}
  .fl-txt{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end;}
  .fl-txt label{display:flex; flex-direction:column; gap:4px; font-weight:800; font-size:15px; flex:1 1 220px; min-width:0;}
  .fl-txt input{min-height:48px; border-radius:14px; border:2px solid var(--line); padding:8px 12px; font:700 18px/1.2 var(--body); color:var(--ink); background:var(--card);}
  .fl-msg{margin:0; font-weight:800; color:var(--bad); min-height:0;}
  .fl-msg:empty{display:none;}
  @media (max-width:420px){ .fl-note{grid-template-columns:minmax(0,110px) minmax(0,1fr);} .fl-stage-top{grid-template-columns:minmax(0,100px) minmax(0,1fr);} }
  .fl-views{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;}
  .fl-view{margin:0; display:flex; flex-direction:column; gap:6px;}
  .fl-view figcaption{display:flex; flex-direction:column; gap:2px; text-align:center;}
  .fl-view figcaption b{font-family:var(--display); font-weight:800; font-size:17px;}
  .fl-view figcaption span{font-weight:700; font-size:14px; color:var(--soft);}
  .fl-pic .fl-hands{max-width:220px;}
  .fl-pic.side .fl-svg{max-width:400px;}
  .fl-learn{margin:0; padding:10px 14px; border-radius:14px; background:var(--track); font-weight:700; font-size:16px; line-height:1.45;}
  .fl-stage .fl-big{transition:box-shadow .2s;}
  .fl-stage.prep .fl-big{box-shadow:0 0 0 4px var(--sun);}
  .fl-stage.blow .fl-big{box-shadow:0 0 0 4px var(--accent);}
  .say-btn{align-self:flex-start; min-height:46px; font-size:18px;}
  .chart.sig svg.iclock{width:150px; height:auto; max-width:100%;}
  .chart.sig svg.iscene{width:100%; max-width:340px; height:auto;}
  .vocab{display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:10px;}
  .vcard{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 8px 10px; border-radius:16px; border:2px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; font-family:var(--body); text-align:center;}
  .vcard:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .vcard .ve{font-size:34px; line-height:1.1;}
  .vcard b{font-family:var(--display); font-weight:800; font-size:20px; line-height:1.1;}
  .vcard .vs{font-weight:700; font-size:14px; color:var(--soft);}
  .vcard .vh{position:absolute; top:6px; right:8px; font-size:14px; opacity:.7;}
  .clocks{display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:10px;}
  .clk{margin:0; display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px; border-radius:16px; background:#EEF4EA; cursor:pointer;}
  .clk svg{width:96px; height:96px;}
  .clk figcaption{font-weight:800; font-size:15px; color:#23304A; text-align:center;}
  /* plan de estudio (Inglés) */
  body.plan-on .wrap{max-width:1200px;}
  .plan-main{display:flex; flex-direction:column; gap:16px; min-width:0;}
  .plan-prog{display:flex; flex-direction:column; gap:6px;}
  .plan-prog p{margin:0; font-weight:800; font-size:17px;}
  .plan-prog .bar i{display:block; height:100%; width:0; border-radius:999px; background:var(--accent); transition:width .3s ease;}
  .plan-idx{display:flex; flex-direction:column; gap:6px;}
  .plan-chip{display:flex; align-items:center; gap:10px; min-height:46px; padding:6px 12px 6px 6px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); font-family:var(--body); font-weight:800; font-size:16px; text-align:left; cursor:pointer;}
  .plan-chip:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .plan-chip .pc-n{flex:none; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--track); color:var(--ink); font-family:var(--display); font-size:17px;}
  .plan-chip.on .pc-n{background:var(--accent); color:var(--on-accent);}
  .plan-chip.is-extra{border-style:dashed;}
  .pc-t{min-width:0;}
  .plan-ses.is-extra{border:2px dashed var(--line);}
  .ses-meta{margin:0; font-weight:700; font-size:16px; color:var(--soft); line-height:1.4;}
  .ses-done{align-self:flex-start;}
  .ses-done.on{background:var(--good-bg); color:var(--good); border-color:var(--good);}
  .phr{display:flex; flex-direction:column; gap:6px;}
  .phr-row{display:flex; align-items:center; gap:10px; text-align:left; padding:10px 12px; border-radius:14px; border:2px solid var(--line); background:var(--card); color:var(--ink); font-family:var(--body); cursor:pointer;}
  .phr-row:focus-visible{outline:3px solid var(--ink); outline-offset:2px;}
  .phr-ic{flex:none; font-size:18px;}
  .phr-tx{display:flex; flex-direction:column; gap:2px; min-width:0;}

<script>
(function(){
  var KEY = 'lupi-progreso-v1';

    var o;
    try { o = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { o = {}; }

  }
  function add(game, n){
    n = Number(n) || 0;
    if (n <= 0) return;
    var o = load();
    var k = dateKey(new Date());
    if (!o.days[k]) o.days[k] = {};
    o.days[k][game] = (o.days[k][game] || 0) + n;
    o.total[game] = (o.total[game] || 0) + n;
    var cut = new Date(); cut.setDate(cut.getDate() - 400);
    var cutKey = dateKey(cut);
    Object.keys(o.days).forEach(function(d){ if (d < cutKey) delete o.days[d]; });
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }
  /* Estrellas del mes en curso: el marcador vuelve a cero el día 1 de cada mes. */
  function month(){
    var o = load(), pre = dateKey(new Date()).slice(0, 7), per = {}, sum = 0;
    Object.keys(o.days).forEach(function(d){
      if (d.slice(0, 7) !== pre) return;
      Object.keys(o.days[d]).forEach(function(g){ var n = Number(o.days[d][g]) || 0; per[g] = (per[g] || 0) + n; sum += n; });
    });
    return { key: pre, sum: sum, per: per };
  }
  /* ----- tiempo dedicado: segundos por día y por juego, solo mientras se juega de verdad ----- */
  var TKEY = 'lupi-tiempo-v1';
  function loadTime(){ var o; try { o = JSON.parse(localStorage.getItem(TKEY) || '{}'); } catch (e) { o = {}; } return (o && typeof o === 'object') ? o : {}; }
  function addTime(game, secs){
    var o = loadTime(), k = dateKey(new Date());
    if (!o[k] || typeof o[k] !== 'object') o[k] = {};
    o[k][game] = (Number(o[k][game]) || 0) + secs;
    var cut = new Date(); cut.setDate(cut.getDate() - 400); var ck = dateKey(cut);
    Object.keys(o).forEach(function(d){ if (d < ck) delete o[d]; });
    try { localStorage.setItem(TKEY, JSON.stringify(o)); } catch (e) {}
  }
  function timeOf(key){ var r = loadTime()[key] || {}, per = {}, sum = 0; Object.keys(r).forEach(function(g){ var n = Number(r[g]) || 0; per[g] = n; sum += n; }); return { sum: sum, per: per }; }
  function fmtTime(s){ var m = Math.floor((Number(s) || 0) / 60); if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : ''); }
  /* cuenta de 5 en 5 segundos si la página está a la vista y ha habido actividad en los últimos 3 minutos */
  function startTimer(game, isActive){
    var last = Date.now(), STEP = 5000, IDLE = 180000;
    ['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll'].forEach(function(ev){ window.addEventListener(ev, function(){ last = Date.now(); }, { passive: true, capture: true }); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) last = Date.now(); });
    setInterval(function(){
      if (document.hidden || Date.now() - last > IDLE) return;
      if (isActive && !isActive()) return;
      addTime(game, STEP / 1000);
    }, STEP);
  }
  window.LupiScore = { add: add, load: load, dateKey: dateKey, month: month, timeOf: timeOf, fmtTime: fmtTime, startTimer: startTimer };
})();

        b: [

      { sec: 'p5', secs: ['s5'], title: 'Sesión 5 · Resolver problemas', time: '20 min', goal: 'Resolver problemas en tres partes (Datos, Operación y Solución), elegir bien la operación y hacer problemas de dos operaciones.',

        ['ex', 'Esta mañana han ido a la piscina 245 personas y esta tarde 318. ¿Cuántas personas han ido en total?\n**Datos**: 245 por la mañana y 318 por la tarde.\n**Operación**: 245 + 318 = 563.\n**Solución**: Han ido 563 personas.'],
        ['trick', 'Palabras pista: «en total», «juntos», «entre los tres» → **suma**. «Quedan», «faltan», «han vendido», «¿cuántos más que…?» → **resta**.'],
        ['oops', '¡Ojo con «**¿cuántos más que…?**»! Se resuelve con una **resta**. En un museo hay 142 paisajes y 98 retratos. ¿Cuántos paisajes **más que** retratos hay? → 142 − 98 = **44**. Si sumas, sabrías cuántos cuadros hay en total, que es otra pregunta.'],

    'ciencias-c1': { plan: true, intro: '¡Hola! Este es tu plan para preparar el examen de Ciencias del tema 1: tu cuerpo por fuera y por dentro, cómo funciona, cómo cambia y cómo cuidarlo. Son 8 sesiones cortitas: haz una cada día y en orden. Mira bien los dibujos, contesta las preguntas de «¡Ahora tú!» y luego practica. En la barra de palabras clave puedes buscar qué significa cada palabra importante.', parts: [
      { sec: 'p1', secs: ['s1', 's2'], title: 'Sesión 1 · Somos seres vivos y tenemos emociones', time: '20 min', goal: 'Conocer las tres funciones vitales y las cuatro emociones principales.',

  function rich(t){ return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

    else if (k === 'calc'){ n = el('pre', 'st-calc', v); }
    else if (k === 'fig'){ n = el('div', 'chart sig wide fig'); n.innerHTML = cfigStudy(v); }
    else if (k === 'vocab'){ n = el('div', 'vocab'); v.forEach(function(x){ var vb = button('', 'vcard', function(){ speakEn(x[1]); }); vb.setAttribute('aria-label', x[1] + ': ' + x[2] + '. Toca para oírlo'); vb.appendChild(el('span', 've', x[0])); vb.appendChild(el('b', '', x[1])); vb.appendChild(el('span', 'vs', x[2])); if (enCan()) vb.appendChild(el('span', 'vh', '🔊')); n.appendChild(vb); }); }
    else if (k === 'scene'){ n = el('div', 'chart sig'); n.innerHTML = iScene(v); }
    else if (k === 'chart'){ n = el('div', 'chart'); n.innerHTML = chartSvg(v); }
    else if (k === 'clocks'){ n = el('div', 'clocks'); v.forEach(function(x){ var f = el('figure', 'clk'); f.innerHTML = iClock(x[0], x[1]); f.appendChild(el('figcaption', '', x[2])); if (enCan()) f.addEventListener('click', function(){ speakEn(x[2]); }); n.appendChild(f); }); }
    else if (k === 'phr'){ n = el('div', 'phr'); v.forEach(function(x){
        var b = button('', 'phr-row', function(){ speakEn(x[0]); }); b.setAttribute('aria-label', x[0] + ' = ' + x[1] + (enCan() ? '. Toca para oírlo' : ''));
        if (enCan()) b.appendChild(el('span', 'phr-ic', '🔊'));
        var tx = el('span', 'phr-tx'); tx.appendChild(el('b', '', x[0])); tx.appendChild(el('span', '', x[1])); b.appendChild(tx); n.appendChild(b); }); }
    else if (k === 'try'){
      n = el('div', 'st-try'); n.appendChild(el('span', 'st-tag', '🎯 ¡Ahora tú!'));

    else { n = el(k === 'p' ? 'p' : 'div', 'st-' + k); if (k !== 'p') n.appendChild(el('span', 'st-tag', k === 'ex' ? 'Ejemplo' : 'Recuerda')); var tx3 = el('span'); tx3.innerHTML = rich(v); n.appendChild(tx3); }
    return n;

  var planObs = null;
  function planDone(p, key){ if (!Array.isArray(p.plan[key])) p.plan[key] = []; return p.plan[key]; }
  function planLabel(t){
    var key = studyKey(t), S = STUDY[key], n = S.parts.filter(function(pt){ return !pt.extra; }).length, d = planDone(loadP(), key).length;
    return '📖 Plan de estudio (' + Math.min(d, n) + ' de ' + n + ' sesiones)';
  }
  function vFold(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  function planWords(S){
    var seen = {}, groups = [];
    S.parts.forEach(function(pt, i){
      var items = [];
      function add(en, es){ var k = String(en).toLowerCase(); if (seen[k]) return; seen[k] = 1; items.push([en, es]); }
      pt.b.forEach(function(bl){ if (bl[0] === 'vocab') bl[1].forEach(function(x){ add(x[1], x[2]); }); else if (bl[0] === 'phr') bl[1].forEach(function(x){ add(x[0], x[1]); }); });
      (pt.words || []).forEach(function(x){ add(x[0], x[1]); });
      if (items.length) groups.push({ pt: pt, i: i, items: items });
    });
    return groups;
  }

    var tt = el('div'); tt.appendChild(el('h2', '', 'MODO EXAMEN')); tt.appendChild(el('p', 'sub', t.title)); hd.appendChild(tt); c.appendChild(hd);
    var ul = el('ul', 'modo-list');
    ['Cada examen es distinto: 20 preguntas al azar sobre ' + (MODO_SRC[studyKey(t)] || 'lo que explican las páginas del libro') + ', y siempre salen todas las partes del tema.', 'Haciendo varios exámenes van saliendo todos los conceptos y definiciones del tema.', 'No sabrás si aciertas hasta el final. Puedes volver atrás para cambiar una respuesta.', '¿No entiendes una pregunta? Pulsa «Profesor» y la profe te lo explica con un ejemplo.', 'Cada acierto sin ayuda vale 2 ★. Si has pedido ayuda a la profe, vale 1 ★.'].forEach(function(x){ ul.appendChild(el('li', '', x)); });
    c.appendChild(ul);
    c.appendChild(modoMeter(t));
    if (p.modo[t.id] != null) c.appendChild(el('p', 'note', 'Tu mejor nota en el MODO EXAMEN: ' + fmt(p.modo[t.id]) + ' sobre 10.'));
    var row = el('div', 'row');
    row.appendChild(button('Empezar el MODO EXAMEN', 'btn sun', function(){ modoRun(t, modoPick(t)); }));
    row.appendChild(button('Volver', 'btn ghost', function(){ openTema(t); }));
    c.appendChild(row); app.appendChild(c);
  }
  function modoRun(t, qs){
    var i = 0, given = qs.map(function(){ return null; }), helped = qs.map(function(){ return false; });
    function ask(){
      clear(); hush();
      var q = qs[i], c = el('section', 'card');
      var p0 = loadP(), s0 = modoStore(p0, studyKey(t)); if (s0.last.indexOf(q.mid) === -1){ s0.last.push(q.mid); saveP(p0); }
      var st = el('p', 'step'); st.appendChild(el('span', '', 'MODO EXAMEN · ' + q.sec)); st.appendChild(el('span', '', 'Pregunta ' + (i + 1) + ' de ' + qs.length)); c.appendChild(st);
      var bar = el('div', 'bar'), fill = el('i'); fill.style.width = Math.round(i / qs.length * 100) + '%'; bar.appendChild(fill); c.appendChild(bar);
      var nx = button(i + 1 < qs.length ? 'Siguiente' : 'Entregar el examen', 'btn', function(){ hush(); i += 1; if (i < qs.length) ask(); else end(); });
      var prev = given[i];
      drawQuestion(c, q, function(v, live){ given[i] = v; nx.disabled = v == null; if (!live && v != null) nx.focus(); }, false);
      /* al volver atrás, se ve marcada la respuesta que ya había */
      if (prev != null){
        if (q.type === 'choice'){ var ob = c.querySelectorAll('.opts .opt')[prev]; if (ob) ob.click(); }
        else String(prev).split('').forEach(function(d){ var kb = Array.prototype.filter.call(c.querySelectorAll('.keys .key'), function(x){ return x.textContent === d; })[0]; if (kb) kb.click(); });
      }
      nx.disabled = given[i] == null;
      var pb = profButton(), box = profBox(q, function(){ pb.setAttribute('aria-expanded', 'false'); pb.focus(); });
      box.hidden = true; if (helped[i]) pb.classList.add('used');
      pb.addEventListener('click', function(){
        helped[i] = true; pb.classList.add('used');
        box.hidden = !box.hidden; pb.setAttribute('aria-expanded', box.hidden ? 'false' : 'true');
        if (box.hidden) hush(); else box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      });
      var pr = el('div', 'row prof-row'); pr.appendChild(pb); c.appendChild(pr); c.appendChild(box);
      var row = el('div', 'row');
      if (i > 0) row.appendChild(button('Atrás', 'btn ghost', function(){ hush(); i -= 1; ask(); }));
      row.appendChild(nx); c.appendChild(row);
      app.appendChild(c);
      app.appendChild(button('Dejar el examen', 'btn ghost', function(){ hush(); openTema(t); }));
    }
    function end(){
      clear(); hush();
      var hits = 0, stars = 0, asks = 0;
      qs.forEach(function(q, k){ if (helped[k]) asks += 1; if (given[k] === q.ans){ hits += 1; stars += helped[k] ? 1 : 2; } });
      var nota = Math.round(hits / qs.length * 100) / 10;
      award(stars);
      var A = modoAnalysis(t, qs, given, helped);
      var p = loadP(); if (p.modo[t.id] == null || nota > p.modo[t.id]) p.modo[t.id] = nota;
      p.modoTips[t.id] = { red: A.red.map(function(x){ return x.s.id; }), yellow: A.yellow.map(function(x){ return x.s.id; }) };
      var ms = modoStore(p, studyKey(t)); qs.forEach(function(q){ if (ms.done.indexOf(q.mid) === -1) ms.done.push(q.mid); }); ms.last = []; saveP(p);
      var c = el('section', 'card');
      c.appendChild(el('p', 'step', t.name + ' · Resultado del MODO EXAMEN'));
      c.appendChild(el('p', 'nota', fmt(nota)));
      c.appendChild(el('h2', '', nota >= 9 ? '¡Sobresaliente! Estás preparadísimo.' : nota >= 7 ? '¡Notable! Vas muy bien.' : nota >= 5 ? 'Aprobado. Repasa lo que has fallado.' : 'Todavía hay que repasar. ¡Tú puedes!'));
      c.appendChild(el('p', 'note', 'Has acertado ' + hits + ' de ' + qs.length + ' y has ganado ' + pl(stars, 'estrella', 'estrellas') + '.' + (asks ? ' Has pedido ayuda a la profe en ' + pl(asks, 'pregunta', 'preguntas') + '.' : ' ¡Y sin pedir ayuda a la profe!')));
      c.appendChild(modoReport(t, A));
      var cv = modoCoverage(t); c.appendChild(modoMeter(t));
      if (cv.seen >= cv.total) c.appendChild(el('p', 'note', '🎉 ¡Ya han salido todos los conceptos del tema! El próximo MODO EXAMEN empieza una vuelta nueva.'));
      c.appendChild(el('h3', 'sub-h', 'Pregunta a pregunta'));
      var ul = el('ul', 'review');
      qs.forEach(function(q, k){
        var ok = given[k] === q.ans, li = el('li');
        li.appendChild(el('span', ok ? 'ok' : 'ko', (k + 1) + '. ' + (ok ? 'Bien' : 'Mal') + ' · ' + q.sec + (helped[k] ? ' · con ayuda de la profe' : '')));
        li.appendChild(el('span', 'rq', q.q + (q.big ? ' ' + q.big : '') + (q.say ? ' «' + q.say + '»' : '') + (q.listen ? ' 🔊 «' + q.speak + '»' : '')));
        if (q.chart){ var ch = el('div', 'chart'); ch.innerHTML = chartSvg(q.chart); li.appendChild(ch); }
        if (q.svg){ var sv = el('div', 'chart sig' + (q.wide ? ' wide' : '')); sv.innerHTML = q.svg; li.appendChild(sv); }
        var mine = given[k] == null ? 'sin contestar' : (q.type === 'choice' ? q.opts[given[k]] : String(given[k]));
        if (!ok) li.appendChild(el('span', 'ra', 'Tu respuesta: ' + mine));
        li.appendChild(el('span', 'ra', 'Respuesta correcta: ' + showAnswer(q) + '. ' + q.why));
        if (!ok){
          var pb = profButton(), box = profBox(q, function(){ pb.setAttribute('aria-expanded', 'false'); });
          box.hidden = true; pb.classList.add('mini');
          pb.addEventListener('click', function(){ box.hidden = !box.hidden; pb.setAttribute('aria-expanded', box.hidden ? 'false' : 'true'); if (box.hidden) hush(); });
          var pr = el('div', 'row'); pr.appendChild(pb); li.appendChild(pr); li.appendChild(box);
        }
        ul.appendChild(li);
      });
      c.appendChild(ul);
      var row = el('div', 'row');
      row.appendChild(button('Volver al tema', 'btn', function(){ openTema(t); }));
      row.appendChild(button('Hacer otro MODO EXAMEN', 'btn ghost', function(){ modoIntro(t); }));
      c.appendChild(row); app.appendChild(c);
    }
    ask();
  }
  /* análisis final del MODO EXAMEN: por cada parte del tema, cuenta fallos y ayudas de la profe.
     Fallar después de pedir ayuda pesa más que fallar sin ella; acertar con ayuda es «practica un poco más». */
  function modoAnalysis(t, qs, given, helped){
    var by = {};
    qs.forEach(function(q, k){
      var o = by[q.sid] || (by[q.sid] = { n: 0, fail: 0, help: 0, failHelp: 0, score: 0 }), ok = given[k] === q.ans;
      o.n += 1; if (!ok) o.fail += 1; if (helped[k]) o.help += 1; if (!ok && helped[k]) o.failHelp += 1;
      o.score += ok ? (helped[k] ? 1 : 0) : (helped[k] ? 3 : 2);
    });
    var red = [], yellow = [], green = [];
    t.secs.forEach(function(s){
      var o = by[s.id]; if (!o) return; var it = { s: s, o: o };
      if (o.failHelp || (o.fail && o.fail * 2 >= o.n)) red.push(it); else if (o.fail || o.help) yellow.push(it); else green.push(it);
    });
    function hard(a, b){ return b.o.score / b.o.n - a.o.score / a.o.n; }
    red.sort(hard); yellow.sort(hard);
    return { red: red, yellow: yellow, green: green };
  }
  function modoReason(o){
    var de = ' de ' + pl(o.n, 'pregunta', 'preguntas');
    if (o.failHelp) return 'Has fallado ' + o.fail + de + ', y ' + (o.failHelp === 1 ? 'en una' : 'en ' + o.failHelp) + ' ya te lo había explicado yo. Vamos a repasarlo con calma.';
    if (o.fail && o.help) return 'Has fallado ' + o.fail + de + ' y me has pedido ayuda en ' + pl(o.help, 'pregunta', 'preguntas') + '.';
    if (o.fail) return 'Has fallado ' + o.fail + de + '.';
    return 'Lo has acertado, pero has necesitado mi ayuda en ' + pl(o.help, 'pregunta', 'preguntas') + '.';
  }
  function modoReport(t, A){
    var box = el('div', 'prof-box report');
    var hd = el('div', 'prof-hd'), f = el('span', 'prof-pic'); f.innerHTML = PROF_FACE; hd.appendChild(f);
    var todo = A.red.length + A.yellow.length;
    hd.appendChild(el('b', '', todo ? 'Lo que te recomienda la profe' : '¡Enhorabuena! Lo dominas todo.')); box.appendChild(hd);
    if (!todo) box.appendChild(el('p', 'prof-p', 'No has fallado ninguna pregunta y no has necesitado mi ayuda. ¡Estás preparadísimo para el examen del cole!'));
    else box.appendChild(el('p', 'prof-p', 'Me he fijado en las preguntas que has fallado y en las que me has pedido ayuda. Empieza por «' + (A.red[0] || A.yellow[0]).s.name + '»: es lo que más te ha costado.'));
    [['📖 Estudia otra vez', 'rep-red', A.red, 'Lee el resumen de esta parte y después practica.'], ['✏️ Practica un poco más', 'rep-yel', A.yellow, '']].forEach(function(g){
      if (!g[2].length) return;
      var sec = el('div', 'rep-group ' + g[1]); sec.appendChild(el('p', 'rep-h', g[0]));
      g[2].forEach(function(it){
        var d = el('div', 'rep-item'); d.appendChild(el('b', '', it.s.name)); d.appendChild(el('span', '', modoReason(it.o)));
        var r = el('div', 'row');
        if (STUDY[studyKey(t)]) r.appendChild(button('📖 Estudiar', 'btn ghost', function(){ hush(); study(t, it.s.id); }));
        r.appendChild(button('✏️ Practicar', 'btn ghost', function(){ hush(); practice(t, it.s.name, makeSet(it.s, 10), t.id + '-' + it.s.id); }));
        d.appendChild(r); sec.appendChild(d);
      });
      box.appendChild(sec);
    });
    if (A.green.length && todo){
      var gs = el('div', 'rep-group rep-grn'); gs.appendChild(el('p', 'rep-h', '⭐ Esto ya lo dominas'));
      var chips = el('div', 'rep-chips'); A.green.forEach(function(it){ chips.appendChild(el('span', 'rep-chip', it.s.name)); }); gs.appendChild(chips);
      box.appendChild(gs);
    }
    if (todo) box.appendChild(el('p', 'note', 'En la página del tema verás marcadas estas partes. Cuando las practiques y saques 8 o más, la profe quitará la marca.'));
    return box;
  }
  /* @@MODO-FIN@@ */
  window.LupiFichasN = FICHAS.length;
  window.MatesDebug = { SUBJECTS: SUBJECTS, TEMAS: TEMAS, makeSet: makeSet, words: words, mix: mix };
  function route(){
    /* enlaces directos: #flauta abre la flauta y #estudio-mates-t2-s3 abre esa parte del apartado de estudio (los usa «Pregúntale a Lupi») */
    var h = location.hash, mus = SUBJECTS.filter(function(x){ return x.id === 'musica'; })[0], fl = mus && mus.temas[0];
    function clean(){ try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    if (fl && h === '#flauta'){ clean(); flautaHome(fl); return true; }
    if (h === '#padres'){ clean(); padres(); return true; }
    var fm = /^#imprimir-fichas-(\d+)$/.exec(h);
    if (fm){ var fw = FICHAS.filter(function(x){ return x.week === +fm[1]; })[0]; if (fw){ fichasRoute(fw); return true; } }
    var pm = /^#imprimir-([a-z]+)-([a-z0-9]+)-(plan|examenes)$/.exec(h);
    if (pm){
      var psj = SUBJECTS.filter(function(x){ return x.id === pm[1]; })[0], ptm = psj && psj.temas.filter(function(x){ return x.id === pm[2]; })[0];
      if (ptm && STUDY[studyKey(ptm)]){ printRoute(ptm, pm[3]); return true; }
    }
    var m = /^#estudio-([a-z]+)-([a-z0-9]+)-([a-z0-9]+)$/.exec(h);
    if (m){
      var sj = SUBJECTS.filter(function(x){ return x.id === m[1]; })[0], tm = sj && sj.temas.filter(function(x){ return x.id === m[2]; })[0];
      if (tm && STUDY[studyKey(tm)]){ clean(); study(tm, m[3]); return true; }
    }
    return false;
  }
  /* al salir de un juego de una asignatura (Tablas, Cuerpo Explorador) se vuelve a esa asignatura */
  if (!route()){
    var ref = document.referrer || '', back = SUBJECTS.filter(function(x){ return (x.games || []).some(function(g){ return ref.indexOf('/' + g.href) !== -1; }); })[0];
    if (back) openSubject(back); else home();
  }
  window.addEventListener('hashchange', route);
})();
</script>
