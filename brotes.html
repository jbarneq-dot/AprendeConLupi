/* ---- 00-core.js ---- */
/* Brotes · núcleo: utilidades DOM, azar, almacenamiento, audio y efectos. */
const B = { screens: {}, games: {}, art: {} };

B.h = function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
};

B.svg = (markup) => {
  const t = document.createElement('template');
  t.innerHTML = markup.trim();
  return t.content.firstElementChild;
};

B.rand = (n) => Math.floor(Math.random() * n);
B.pick = (a) => a[B.rand(a.length)];
B.shuffle = (a) => {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) {
    const j = B.rand(i + 1);
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
};
B.sample = (a, n) => B.shuffle(a).slice(0, n);
B.uid = () => Math.random().toString(36).slice(2, 10);
B.pad = (n) => String(n).padStart(2, '0');
B.today = (d = new Date()) => `${d.getFullYear()}-${B.pad(d.getMonth() + 1)}-${B.pad(d.getDate())}`;
B.daysBack = (n) => Array.from({ length: n }, (_, i) => {
  const d = new Date();
  d.setDate(d.getDate() - (n - 1 - i));
  return d;
});

/* ---------- Almacenamiento local (solo en este dispositivo) ---------- */
B.Store = class Store {
  constructor(key) {
    this.key = key;
    this.data = this.load();
  }

  static defaults() {
    return {
      v: 1,
      profiles: [],
      activeId: null,
      settings: { sfx: true, voice: true, rate: 0.9, accent: 'en-US', dailyLimit: 0 },
    };
  }

  static fixProfile(p) {
    return Object.assign({ stars: 0, stickers: [], acts: {}, path: 0, words: {}, time: {}, bonus: {}, log: [] }, p);
  }

  load() {
    const d = Store.defaults();
    try {
      const raw = localStorage.getItem(this.key);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.profiles)) {
          d.profiles = s.profiles.map(Store.fixProfile);
          d.activeId = s.activeId;
          Object.assign(d.settings, s.settings || {});
        }
      }
    } catch (e) {
      // Sin almacenamiento (modo privado, vista previa): la app funciona igual, sin guardar.
    }
    return d;
  }

  save() {
    try {
      localStorage.setItem(this.key, JSON.stringify(this.data));
    } catch (e) {
      // Ignorado a propósito: guardar es una comodidad, no un requisito.
    }
  }

  get settings() { return this.data.settings; }
  get profile() { return this.data.profiles.find((p) => p.id === this.data.activeId) || null; }

  addProfile({ name, age, avatar }) {
    const p = Store.fixProfile({ id: B.uid(), name, age, avatar, created: Date.now() });
    this.data.profiles.push(p);
    this.data.activeId = p.id;
    this.save();
    return p;
  }

  updateProfile(id, patch) {
    const p = this.data.profiles.find((x) => x.id === id);
    if (p) Object.assign(p, patch);
    this.save();
  }

  removeProfile(id) {
    this.data.profiles = this.data.profiles.filter((p) => p.id !== id);
    if (this.data.activeId === id) this.data.activeId = this.data.profiles[0]?.id || null;
    this.save();
  }

  select(id) {
    this.data.activeId = id;
    this.save();
  }

  record(key, result) {
    const p = this.profile;
    if (!p) return { sticker: null, first: false };
    const a = p.acts[key] || (p.acts[key] = { plays: 0, best: 0, last: 0 });
    const first = a.plays === 0;
    a.plays++;
    a.best = Math.max(a.best, result.stars);
    a.last = Date.now();
    p.stars += result.stars;
    for (const w of result.words || []) p.words[w] = (p.words[w] || 0) + 1;
    p.log.unshift({ t: Date.now(), key, stars: result.stars });
    if (p.log.length > 40) p.log.length = 40;
    let sticker = null;
    if (first || result.gift || Math.random() < 0.35) {
      const missing = B.STICKERS.filter((s) => !p.stickers.includes(s));
      if (missing.length) {
        sticker = B.pick(missing);
        p.stickers.push(sticker);
      }
    }
    this.save();
    return { sticker, first };
  }

  addTime(sec) {
    const p = this.profile;
    if (!p) return;
    const d = B.today();
    p.time[d] = (p.time[d] || 0) + sec;
    const keep = new Set(B.daysBack(60).map((x) => B.today(x)));
    for (const k of Object.keys(p.time)) if (!keep.has(k)) delete p.time[k];
    this.save();
  }

  usedToday(p = this.profile) { return (p && p.time[B.today()]) || 0; }

  limitReached() {
    const lim = this.settings.dailyLimit;
    const p = this.profile;
    if (!lim || !p) return false;
    return this.usedToday() >= (lim + (p.bonus[B.today()] || 0)) * 60;
  }

  reset() {
    this.data = Store.defaults();
    this.save();
  }
};

/* ---------- Audio: efectos sintetizados y voz del navegador ---------- */
B.Audio = class AudioKit {
  constructor(app) {
    this.app = app;
    this.ctx = null;
    this.gen = 0;
    this.voices = [];
    this.synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
    if (this.synth) {
      const load = () => { this.voices = this.synth.getVoices(); };
      load();
      this.synth.addEventListener?.('voiceschanged', load);
    }
  }

  get settings() { return this.app.store.settings; }

  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }

  tone(freq, dur, { type = 'sine', vol = 0.2, delay = 0, slide = 0 } = {}) {
    const c = this.ensure();
    if (!c) return;
    const t0 = c.currentTime + delay;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.03);
  }

  // Nota de "caja de música" para las canciones.
  note(freq, at, dur, vol = 0.18) {
    const c = this.ensure();
    if (!c) return;
    for (const [mult, v] of [[1, vol], [2, vol * 0.25], [3, vol * 0.08]]) {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * mult, at);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(v, at + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, at + Math.max(0.35, dur * 1.4));
      o.connect(g).connect(c.destination);
      o.start(at);
      o.stop(at + Math.max(0.4, dur * 1.5));
    }
  }

  sfx(name) {
    if (!this.settings.sfx || !this.ensure()) return;
    const T = (f, d, o) => this.tone(f, d, o);
    switch (name) {
      case 'tap': T(560, 0.07, { type: 'triangle', vol: 0.12 }); break;
      case 'pop': T(900, 0.1, { vol: 0.22, slide: -600 }); break;
      case 'flip': T(420, 0.07, { type: 'triangle', vol: 0.1, slide: 220 }); break;
      case 'good': [523, 659, 784].forEach((f, i) => T(f, 0.16, { type: 'triangle', vol: 0.16, delay: i * 0.08 })); break;
      case 'bad': T(240, 0.18, { vol: 0.14, slide: -70 }); T(190, 0.22, { vol: 0.1, delay: 0.12 }); break;
      case 'star': T(1047, 0.14, { vol: 0.12 }); T(1568, 0.2, { vol: 0.1, delay: 0.07 }); break;
      case 'win': [523, 659, 784, 1047, 784, 1047].forEach((f, i) => T(f, 0.2, { type: 'triangle', vol: 0.14, delay: i * 0.11 })); break;
      case 'drop': T(320, 0.12, { vol: 0.15, slide: 140 }); break;
      case 'lock': T(180, 0.12, { type: 'square', vol: 0.05 }); break;
      default: break;
    }
  }

  voice(lang) {
    const vs = this.voices;
    const norm = (l) => (l || '').replace('_', '-').toLowerCase();
    return vs.find((v) => norm(v.lang) === lang.toLowerCase())
      || vs.find((v) => norm(v.lang).startsWith(lang.slice(0, 2).toLowerCase()))
      || null;
  }

  sayOne(text, lang) {
    return new Promise((resolve) => {
      if (!this.settings.voice || !this.synth || !text) return resolve();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      const v = this.voice(lang);
      if (v) u.voice = v;
      u.rate = this.settings.rate;
      u.pitch = 1.12;
      let done = false;
      const end = () => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve();
      };
      const timer = setTimeout(end, 2500 + text.length * 95);
      u.onend = end;
      u.onerror = end;
      this.current = u; // evita que el recolector corte la frase en algunos navegadores
      this.synth.speak(u);
    });
  }

  // parts: [['es', 'texto'], ['en', 'word']] — una nueva llamada interrumpe la anterior.
  async talk(parts) {
    const g = ++this.gen;
    if (this.synth) this.synth.cancel();
    for (const [lang, text] of parts) {
      if (g !== this.gen) return false;
      await this.sayOne(text, lang === 'en' ? this.settings.accent : lang === 'es' ? 'es-ES' : lang);
    }
    return g === this.gen;
  }

  es(text) { return this.talk([['es', text]]); }
  en(text) { return this.talk([['en', text]]); }

  stop() {
    this.gen++;
    try { this.synth?.cancel(); } catch (e) { /* nada que parar */ }
  }
};

/* ---------- Efectos visuales ---------- */
B.confetti = (host) => {
  const r = host.getBoundingClientRect();
  if (!r.width) return;
  const cv = B.h('canvas', { class: 'confetti' });
  host.append(cv);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = r.width * dpr;
  cv.height = r.height * dpr;
  const ctx = cv.getContext('2d');
  ctx.scale(dpr, dpr);
  const colors = ['#ff6b9a', '#ffc93c', '#2ec4b6', '#6c4cf1', '#ff9f43', '#4dabf7'];
  const ps = Array.from({ length: 90 }, () => ({
    x: r.width / 2 + (Math.random() - 0.5) * 120,
    y: r.height * 0.42,
    vx: (Math.random() - 0.5) * 13,
    vy: -Math.random() * 12 - 5,
    s: 6 + Math.random() * 7,
    c: B.pick(colors),
    a: Math.random() * 6,
    va: (Math.random() - 0.5) * 0.3,
  }));
  let f = 0;
  const step = () => {
    ctx.clearRect(0, 0, r.width, r.height);
    for (const p of ps) {
      p.vy += 0.34;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.99;
      p.a += p.va;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.a);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 3, p.s, p.s * 0.6);
      ctx.restore();
    }
    if (++f < 120 && cv.isConnected) requestAnimationFrame(step);
    else cv.remove();
  };
  step();
};

B.burst = (el, text = '⭐') => {
  const s = B.h('span', { class: 'burst' }, text);
  el.append(s);
  setTimeout(() => s.remove(), 900);
};

B.shake = (el) => {
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
};

/* ---------- Arrastrar (ratón y táctil) con detección de toque ---------- */
B.drag = (el, { onTap, onDrop, onStart } = {}) => {
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', (e) => {
    if (el.classList.contains('placed')) return;
    e.preventDefault();
    try { el.setPointerCapture(e.pointerId); } catch (err) { /* sin captura */ }
    const sx = e.clientX;
    const sy = e.clientY;
    let moved = false;
    onStart?.(e);
    const move = (ev) => {
      const dx = ev.clientX - sx;
      const dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) > 8) {
        moved = true;
        el.classList.add('dragging');
      }
      if (moved) el.style.transform = `translate(${dx}px, ${dy}px) scale(1.08)`;
    };
    const up = (ev) => {
      el.removeEventListener('pointermove', move);
      el.removeEventListener('pointerup', up);
      el.removeEventListener('pointercancel', up);
      el.classList.remove('dragging');
      if (!moved) {
        el.style.transform = '';
        onTap?.(ev);
        return;
      }
      const kept = onDrop?.(ev);
      if (!kept) {
        el.style.transition = 'transform .25s ease';
        el.style.transform = '';
        setTimeout(() => { el.style.transition = ''; }, 260);
      }
    };
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
  });
};

B.hit = (ev, targets) => targets.find((t) => {
  const r = t.getBoundingClientRect();
  return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
});

B.sampleStroke = (segs) => {
  const pts = [];
  for (const s of segs) {
    if (s.t === 'l') {
      const n = Math.max(2, Math.ceil(Math.hypot(s.x2 - s.x1, s.y2 - s.y1) / 2));
      for (let i = 0; i <= n; i++) pts.push([s.x1 + ((s.x2 - s.x1) * i) / n, s.y1 + ((s.y2 - s.y1) * i) / n]);
    } else {
      const n = Math.max(4, Math.ceil(Math.abs(s.a1 - s.a0) / 4));
      for (let i = 0; i <= n; i++) {
        const a = ((s.a0 + ((s.a1 - s.a0) * i) / n) * Math.PI) / 180;
        pts.push([s.cx + s.rx * Math.cos(a), s.cy + s.ry * Math.sin(a)]);
      }
    }
  }
  return pts;
};

  }
  if (word.hex) return B.h('span', { class: `art swatch${word.hex === '#ffffff' ? ' light' : ''}`, style: `background:${word.hex}` });

    s.classList.add('art', 'shape');
    return s;
  }
  if (word.letter) return B.h('span', { class: 'art letter' }, word.letter);
  if (word.num != null) return B.h('span', { class: 'art num' }, word.num);
  return B.h('span', { class: 'art emoji' }, word.emoji);
};

};

button.chip { border:0; cursor:pointer; }

/* Efectos */

.burst { position:absolute; top:-10px; right:-6px; font-size:28px; pointer-events:none; animation:burst .9s ease forwards; z-index:5; }
.shake { animation:shake .42s; }
@keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
@keyframes pulse { 0%,100% { transform:translateX(var(--dx)) scale(1); } 50% { transform:translateX(var(--dx)) scale(1.09); } }
@keyframes bounce { 0% { transform:scale(1); } 40% { transform:scale(1.14); } 70% { transform:scale(.95); } 100% { transform:scale(1); } }
@keyframes shake { 0%,100% { transform:translateX(0); } 20% { transform:translateX(-10px); } 40% { transform:translateX(10px); } 60% { transform:translateX(-6px); } 80% { transform:translateX(6px); } }
@keyframes pop { 0% { transform:scale(.4); opacity:0; } 70% { transform:scale(1.08); opacity:1; } 100% { transform:scale(1); } }

@media (max-width:520px) {
  .stage { padding-bottom:96px; gap:14px; }
  .hbar { grid-template-columns:96px 1fr 56px; font-size:14px; }
  .bubble { font-size:15px; margin-bottom:34px; }
}
@media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }

/* Brotes · aplicación: navegación y pantallas para niños. */
B.KIDS_SCREENS = new Set(['home', 'world', 'play', 'story', 'song', 'album']);

B.App = class App {
  constructor(host, root, opts) {
    this.host = host;
    this.root = root;
    this.opts = opts;
    this.store = new B.Store(opts.storageKey);
    this.audio = new B.Audio(this);
    this.timers = new Set();
    this.cleanups = [];
    this.homeTab = 'path';
    root.append(B.h('style', {}, B.CSS));
    this.frame = B.h('div', { class: 'app' });
    root.append(this.frame);
    this.frame.addEventListener('pointerdown', () => this.audio.ensure(), { once: true });
    this.tick = setInterval(() => this.trackTime(), 10000);
    this.go(this.startScreen());
  }

  startScreen() {
    if (!this.store.data.profiles.length) return 'welcome';
    if (!this.store.profile) return 'who';
    return 'home';
  }

  go(name, params = {}) {
    this.audio.stop();
    this.clearScreen();
    this.screen = name;
    this.params = params;
    this.frame.replaceChildren();
    if (B.KIDS_SCREENS.has(name) && this.store.limitReached()) {
      this.screen = 'rest';
      B.screens.rest(this);
      return;
    }
    B.screens[name](this, params);
  }

  clearScreen() {
    for (const t of this.timers) clearTimeout(t);
    this.timers.clear();
    for (const f of this.cleanups.splice(0)) {
      try { f(); } catch (e) { /* limpieza best-effort */ }
    }
  }

  after(ms, fn) {
    const t = setTimeout(() => {
      this.timers.delete(t);
      fn();
    }, ms);
    this.timers.add(t);
    return t;
  }

  onLeave(fn) { this.cleanups.push(fn); }

  trackTime() {
    if (document.hidden || !B.KIDS_SCREENS.has(this.screen) || !this.store.profile) return;
    this.store.addTime(10);
    if (this.store.limitReached() && this.screen !== 'play') this.go('rest');
  }

  modal(content, { closable = true, onClose } = {}) {
    const box = B.h('div', { class: 'modal' });
    const wrap = B.h('div', { class: 'overlay' }, box);
    const close = () => {
      wrap.remove();
      onClose?.();
    };
    if (closable) box.append(B.h('button', { class: 'icon-btn close', 'aria-label': 'Cerrar', onClick: close }, '✕'));
    box.append(content);
    this.frame.append(wrap);
    return close;
  }

  exitToHost() {
    this.host.dispatchEvent(new CustomEvent('brotes-exit', { bubbles: true, composed: true }));
  }

  pause() {
    clearInterval(this.tick);
    this.audio.stop();
  }

  resume() {
    clearInterval(this.tick);
    this.tick = setInterval(() => this.trackTime(), 10000);
  }

  destroy() {
    this.pause();
    this.clearScreen();
  }
};

/* ---------- Barrera parental: números escritos con palabras ---------- */
B.gate = (app) => new Promise((resolve) => {
  const NAMES = ['cero', 'uno', 'dos', 'tres', 'cuatro', 'cinco', 'seis', 'siete', 'ocho', 'nueve'];
  let target = [];
  let typed = [];
  let ok = false;
  const ask = B.h('p', { class: 'muted', style: 'font-size:18px;margin-top:8px' });
  const code = B.h('div', { class: 'code' });
  const body = B.h('div', {},
    B.h('div', { style: 'font-size:40px' }, '🔒'),
    B.h('h2', {}, 'Solo para adultos'),
    ask, code,
    B.h('div', { class: 'keypad' },
      [1, 2, 3, 4, 5, 6, 7, 8, 9, null, 0, 'del'].map((n) => (n === null
        ? B.h('span')
        : B.h('button', { onClick: () => press(n), 'aria-label': n === 'del' ? 'Borrar' : String(n) }, n === 'del' ? '⌫' : n)))),
  );
  const fresh = () => {
    target = [B.rand(10), B.rand(10), B.rand(10)];
    typed = [];
    ask.textContent = `Pulsa los números: ${target.map((n) => NAMES[n]).join(', ')}`;
    draw();
  };
  const draw = () => code.replaceChildren(...[0, 1, 2].map((i) => B.h('i', { class: i < typed.length ? 'on' : '' })));
  const press = (n) => {
    app.audio.sfx('tap');
    if (n === 'del') typed.pop();
    else typed.push(n);
    draw();
    if (typed.length === 3) {
      if (typed.every((v, i) => v === target[i])) {
        ok = true;
        close();
      } else {
        app.audio.sfx('bad');
        B.shake(code);
        setTimeout(fresh, 450);
      }
    }
  };
  fresh();
  const close = app.modal(body, { onClose: () => resolve(ok) });
});

B.screens.profileForm = (app, { first = false, edit = null, back = 'home' } = {}) => {
  const current = edit ? app.store.data.profiles.find((p) => p.id === edit) : null;
  let age = current?.age ?? 4;
  let avatar = current?.avatar ?? B.rand(B.AVATARS.length);
  const name = B.h('input', { class: 'input', maxlength: '20', placeholder: 'Nombre del niño o la niña', value: current?.name || '' });
  const ages = B.h('div', { class: 'choices-row' });
  const avs = B.h('div', { class: 'choices-row' });
  const drawAges = () => ages.replaceChildren(...[2, 3, 4, 5, 6, 7, 8].map((a) => B.h('button', {
    class: `age${a === age ? ' on' : ''}`, onClick: () => { age = a; app.audio.sfx('tap'); drawAges(); },
  }, a)));
  const drawAvs = () => avs.replaceChildren(...B.AVATARS.map((_, i) => B.h('button', {
    class: `av${i === avatar ? ' on' : ''}`, 'aria-label': `Avatar ${i + 1}`, onClick: () => { avatar = i; app.audio.sfx('tap'); drawAvs(); },
  }, B.art.avatar(i))));
  drawAges();
  drawAvs();
  const save = () => {
    const n = name.value.trim();
    if (!n) {
      B.shake(name);
      name.focus();
      return;
    }
    if (current) app.store.updateProfile(current.id, { name: n, age, avatar });
    else app.store.addProfile({ name: n, age, avatar });
    app.audio.sfx('good');
    app.go(current ? back : 'home');
  };
  app.frame.append(
    B.h('div', { class: 'topbar' },
      first ? null : B.h('button', { class: 'icon-btn', 'aria-label': 'Volver', onClick: () => app.go(back) }, '←'),
      B.h('div', { class: 'grow' }, B.h('h2', {}, current ? 'Editar perfil' : 'Nuevo perfil'))),
    B.h('div', { class: 'scroll center' },
      first ? B.h('p', { class: 'muted' }, 'Para mamá, papá o un adulto: crea el perfil del peque.') : null,
      B.h('div', { class: 'form' },
        B.h('div', { class: 'field' }, B.h('label', {}, '¿Cómo se llama?'), name),
        B.h('div', { class: 'field' }, B.h('label', {}, '¿Cuántos años tiene?'), ages),
        B.h('div', { class: 'field' }, B.h('label', {}, 'Elige un avatar'), avs)),
      B.h('button', { class: 'btn', onClick: save }, current ? 'Guardar' : '¡Listo!')),
  );
};

B.screens.home = (app) => {
  const tabs = [['path', '🗺️ Camino'], ['worlds', '🌍 Mundos'], ['fun', '🎵 Canta y lee']];
  const body = B.h('div', { class: 'scroll' });
  const tabBar = B.h('div', { class: 'tabs' });
  const draw = () => {
    tabBar.replaceChildren(...tabs.map(([id, label]) => B.h('button', {
      class: `tab${app.homeTab === id ? ' on' : ''}`,
      onClick: () => { app.homeTab = id; app.audio.sfx('tap'); draw(); },
    }, label)));
    body.replaceChildren();
    body.scrollTop = 0;
    if (app.homeTab === 'path') B.renderPath(app, body);
    else if (app.homeTab === 'worlds') B.renderWorlds(app, body);
    else B.renderFun(app, body);
  };
  app.frame.append(B.kidBar(app), tabBar, body);
  draw();
};

B.renderPath = (app, body) => {
  const p = app.store.profile;
  const nodes = B.pathNodes(p.age);
  const wrap = B.h('div', { class: 'path' });
  const trail = B.svg('<svg class="trail" xmlns="http://www.w3.org/2000/svg"></svg>');
  wrap.append(trail);
  let lastUnit = -1;
  let currentEl = null;
  nodes.forEach((n, i) => {
    const world = B.world(n.world);
    if (n.unit !== lastUnit) {
      lastUnit = n.unit;
      wrap.append(B.h('div', { class: 'unit', style: `--wc:${world.color}` },
        B.h('span', {}, world.icon), `Unidad ${n.unit + 1} · ${world.es}`));
    }
    const state = i < p.path ? 'done' : i === p.path ? 'current' : 'locked';
    const act = n.gift ? null : p.acts[`${n.world}:${n.tpl}`];
    const best = act ? act.best : 0;
    const dx = `${Math.round(Math.sin(i * 0.95) * 90)}px`;
    const el = B.h('button', {
      class: `node ${state}${n.gift ? ' gift' : ''}`,
      style: `--wc:${world.color};--dx:${dx}`,
      'aria-label': n.gift ? 'Regalo' : `${B.TEMPLATES[n.tpl].es}, ${world.es}`,
      onClick: () => {
        if (state === 'locked') {
          app.audio.sfx('lock');
          B.shake(el);
          app.audio.es('Primero termina las actividades anteriores.');
          return;
        }
        if (n.gift) {
          B.openGift(app, i, state === 'current');
          return;
        }
        app.audio.sfx('tap');
        app.go('play', { world: n.world, tpl: n.tpl, pathIndex: i, from: 'home' });
      },
    },
    state === 'locked' ? '🔒' : n.gift ? (state === 'done' ? '📦' : '🎁') : B.TEMPLATES[n.tpl].icon,
    state === 'done' && !n.gift ? B.h('span', { class: 'st' }, '★'.repeat(best)) : null,
    state === 'current' ? B.h('span', { class: 'me' }, B.art.avatar(p.avatar)) : null);
    if (state === 'current') currentEl = el;
    wrap.append(el);
  });
  if (p.path >= nodes.length) {
    wrap.append(B.h('div', { class: 'center', style: 'margin-top:20px' },
      B.h('div', { style: 'font-size:60px' }, '🏆'),
      B.h('h2', {}, '¡Has completado el camino!'),
      B.h('p', { class: 'muted' }, 'Sigue jugando en los mundos para ganar más estrellas.')));
  }
  body.append(wrap);
  const drawTrail = () => {
    const pts = [...wrap.querySelectorAll('.node')].map((n) => [n.offsetLeft + n.offsetWidth / 2 + parseFloat(n.style.getPropertyValue('--dx')), n.offsetTop + n.offsetHeight / 2]);
    if (pts.length < 2) return;
    trail.setAttribute('width', wrap.offsetWidth);
    trail.setAttribute('height', wrap.offsetHeight);
    let d = `M${pts[0][0]} ${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1];
      const [x1, y1] = pts[i];
      const my = (y0 + y1) / 2;
      d += ` C${x0} ${my} ${x1} ${my} ${x1} ${y1}`;
    }
    trail.innerHTML = `<path d="${d}" fill="none" stroke="#e2d9f5" stroke-width="12" stroke-linecap="round" stroke-dasharray="2 20"/>`;
  };
  requestAnimationFrame(() => {
    drawTrail();
    if (currentEl) body.scrollTop = Math.max(0, currentEl.offsetTop - body.clientHeight / 2 + 40);
  });
  const ro = new ResizeObserver(drawTrail);
  ro.observe(wrap);
  app.onLeave(() => ro.disconnect());
};

/* ---------- Pantalla de juego: marco común para todas las plantillas ---------- */
B.screens.play = (app, params) => {
  const { world: wid, tpl, pathIndex = null, from = 'home' } = params;
  const world = B.world(wid);
  const p = app.store.profile;
  const T = B.TEMPLATES[tpl];
  const stage = B.h('div', { class: 'stage' });
  const dots = B.h('div', { class: 'dots' });
  const bubble = B.h('div', { class: 'bubble' });
  const mascotBox = B.h('div', { class: 'm' }, B.art.mascot(B.rand(2) ? 'tako' : 'lumi'));
  const who = mascotBox.firstElementChild.getAttribute('aria-label') === 'Lumi' ? 'lumi' : 'tako';
  const leave = () => {
    if (from === 'world') app.go('world', { id: wid });
    else app.go('home');
  };
  const screen = B.h('div', { class: 'play', style: `--wc:${world.color}` },
    B.h('div', { class: 'play-top' },
      B.h('button', { class: 'icon-btn', 'aria-label': 'Salir del juego', onClick: leave }, '✕'),
      B.h('div', { class: 'title' }, `${T.icon} ${T.es} · ${world.es}`),
      dots),
    stage,
    B.h('div', { class: 'helper' }, mascotBox, bubble));
  app.frame.append(screen);

  let alive = true;
  let intro = null;
  app.onLeave(() => { alive = false; });
  let mistakes = 0;
  let total = 1;
  const practiced = new Set();
  const level = p.age <= 3 ? 0 : p.age <= 5 ? 1 : 2;

  const api = {
    app, world, level, age: p.age, stage, screen,
    words: world.words,
    get alive() { return alive; },
    guard: (fn) => (...a) => { if (alive) fn(...a); },
    after: (ms, fn) => app.after(ms, fn),
    onLeave: (fn) => app.onLeave(fn),
    progress(i, n) {
      total = n;
      dots.replaceChildren(...Array.from({ length: n }, (_, k) => B.h('i', { class: `dot${k < i ? ' on' : ''}` })));
    },
    mood(m) { mascotBox.replaceChildren(B.art.mascot(who, m)); },
    tell(text, speak = true) {
      intro = null;
      bubble.textContent = text;
      bubble.style.animation = 'none';
      void bubble.offsetWidth;
      bubble.style.animation = '';
      return speak ? app.audio.es(text) : Promise.resolve();
    },
    // Instrucción que se lee justo antes de la primera frase del juego, sin bloquear la ronda.
    intro(text) {
      api.tell(text, false);
      intro = text;
    },
    talk(parts) {
      if (intro) {
        parts = [['es', intro], ...parts];
        intro = null;
      }
      return app.audio.talk(parts);
    },
    en: (text) => api.talk([['en', text]]),
    good(el, word) {
      app.audio.sfx('good');
      if (el) B.burst(el);
      if (word && word.en) practiced.add(word.en);
      api.mood('happy');
    },
    bad(el) {
      mistakes++;
      app.audio.sfx('bad');
      if (el) B.shake(el);
      api.mood('sad');
      app.after(900, () => alive && api.mood('happy'));
    },
    finish({ stars } = {}) {
      if (!alive) return;
      const s = stars ?? (mistakes === 0 ? 3 : mistakes <= Math.max(1, Math.round(total * 0.34)) ? 2 : 1);
      const key = `${wid}:${tpl}`;
      const res = app.store.record(key, { stars: s, words: [...practiced] });
      if (pathIndex != null && pathIndex === p.path) {
        p.path++;
        app.store.save();
      }
      B.showResult(app, { stars: s, sticker: res.sticker, again: () => app.go('play', params), next: leave, who });
    },
  };
  api.progress(0, 1);
  B.games[tpl](api);
};

B.screens.story = (app, { id }) => {

  const next = B.h('button', { class: 'btn', onClick: () => turn(1) }, 'Siguiente ▶');
  const counter = B.h('span', { class: 'pill' });
  const read = () => {
    const pg = st.pages[page];
    app.audio.talk([['es', pg.text], ['en', pg.key.en]]);
  };
  const draw = () => {
    const pg = st.pages[page];
    pageEl.style.background = pg.bg;
    pageEl.replaceChildren(
      ...pg.scene.map(([e, x, y, s], i) => B.h('span', { class: 'e', style: `left:${x}%;top:${y}%;font-size:${s}px;animation-delay:${i * 0.12}s` }, e)),

      B.h('span', { style: 'flex:1;min-width:200px' }, pg.text),
      B.h('button', { class: 'keyword', onClick: () => app.audio.en(pg.key.en) }, `🔊 ${pg.key.en}`));

    next.textContent = page === st.pages.length - 1 ? '¡Fin! ✓' : 'Siguiente ▶';

    B.h('div', { class: 'topbar' },
      B.h('button', { class: 'icon-btn', 'aria-label': 'Volver', onClick: () => { app.homeTab = 'fun'; app.go('home'); } }, '←'),

    pageEl, text,
    B.h('div', { class: 'storynav' }, prev, counter, next)));

B.screens.song = (app, { id }) => {
  const song = B.SONGS.find((s) => s.id === id);
  const lyrics = B.h('div', { class: 'lyrics' });
  const syls = [];
  song.lines.forEach((line) => {
    lyrics.append(B.h('div', { class: 'line' }, line.map((n) => {
      const el = B.h('span', { class: 'syl' }, n[2]);
      syls.push({ el, note: n });
      return el;
    })));
  });
  let playing = false;
  const play = B.h('button', { class: 'btn yellow', onClick: () => start() }, '▶ Cantar');
  const start = () => {
    if (playing) return;
    const ctx = app.audio.ensure();
    if (!ctx) return;
    playing = true;
    play.disabled = true;
    const beat = 60 / song.bpm;
    let t = ctx.currentTime + 0.25;
    const t0 = t;
    syls.forEach(({ el }) => { el.className = 'syl'; });
    syls.forEach(({ el, note }, i) => {
      const [nm, beats] = note;
      app.audio.note(B.NOTE[nm], t, beats * beat);
      const ms = (t - t0) * 1000 + 250;
      app.after(ms, () => {
        if (i > 0) syls[i - 1].el.className = 'syl past';
        el.className = 'syl now';
      });
      t += beats * beat;
    });
    app.after((t - t0) * 1000 + 600, () => {
      syls.at(-1).el.className = 'syl past';
      playing = false;
      play.disabled = false;
      play.textContent = '↻ Otra vez';
      const res = app.store.record(`song:${song.id}`, { stars: 3 });
      if (res.sticker) {
        app.audio.sfx('win');
        app.modal(B.h('div', {}, B.h('h2', {}, '¡Qué bien cantas!'), B.h('div', { class: 'newsticker' }, B.h('span', {}, res.sticker), '¡Nueva pegatina!')));
      }
    });
  };
  app.frame.append(B.h('div', { class: 'story', style: `--wc:${song.color}` },
    B.h('div', { class: 'topbar' },
      B.h('button', { class: 'icon-btn', 'aria-label': 'Volver', onClick: () => { app.homeTab = 'fun'; app.go('home'); } }, '←'),
      B.h('div', { class: 'grow' }, B.h('h3', {}, `${song.icon} ${song.es}`))),
    B.h('div', { class: 'scroll center' },
      B.h('div', { class: 'hero-duo' }, B.svg(B.art.tako('happy')), B.svg(B.art.lumi('happy'))),
      lyrics, play)));
};

/* ---- 50-games.js ---- */
/* Brotes · plantillas de juego. Cada una recibe la api del marco de juego (B.screens.play). */

/* Escucha y toca: oye la palabra en inglés y toca el dibujo. */
B.games.listen = (api) => {
  const { stage, words, level } = api;
  const rounds = Math.min(6, words.length);
  const targets = B.sample(words, rounds);
  let round = 0;
  const next = api.guard(() => {
    if (round >= rounds) return api.finish();
    api.progress(round, rounds);
    const target = targets[round];
    const opts = B.shuffle([target, ...B.sample(words.filter((x) => x !== target), level === 0 ? 2 : 3)]);
    let locked = false;
    const speak = () => api.en(B.spoken(target));
    stage.replaceChildren(
      B.h('button', { class: 'speak', 'aria-label': 'Escuchar otra vez', onClick: speak }, '🔊'),
      B.h('div', { class: 'choices' }, opts.map((o) => {
        const btn = B.h('button', {
          class: 'choice',
          onClick: () => {
            if (locked || btn.classList.contains('no')) return;
            if (o === target) {
              locked = true;
              btn.classList.add('ok');
              btn.append(B.h('span', { class: 'lab' }, target.en));
              api.good(btn, target);
              api.en(B.spoken(target));
              round++;
              api.after(1300, next);
            } else {
              btn.classList.add('no');
              api.bad(btn);
              api.after(500, speak);
            }
          },
        }, B.art.word(o));
        return btn;
      })),
    );
    speak();
  });
  api.intro('Escucha la palabra y toca el dibujo correcto.');
  next();
};

/* Parejas: memoria con dibujo + palabra (o número, letra, color). */
B.games.memory = (api) => {
  const { stage, words, level } = api;
  const pairs = Math.min([3, 4, 6][level], words.length);
  const chosen = B.sample(words, pairs);
  const cards = B.shuffle(chosen.flatMap((wd, i) => [{ wd, id: i, alt: false }, { wd, id: i, alt: level > 0 }]));
  const cols = cards.length <= 6 ? 3 : 4;
  let open = [];
  let matched = 0;
  let misses = 0;
  const grid = B.h('div', { class: 'mem', style: `--cols:${cols}` });
  cards.forEach((c) => {
    const el = B.h('button', { class: 'card', 'aria-label': 'Carta' },
      B.h('div', { class: 'in' },
        B.h('div', { class: 'face back' }, '✿'),
        B.h('div', { class: 'face front' }, B.art.word(c.wd, { alt: c.alt }))));
    c.el = el;
    el.addEventListener('click', () => {
      if (open.length === 2 || el.classList.contains('open') || el.classList.contains('done')) return;
      api.app.audio.sfx('flip');
      el.classList.add('open');
      api.en(c.wd.letter ? (c.alt ? c.wd.word : B.spoken(c.wd)) : c.wd.en);
      open.push(c);
      if (open.length < 2) return;
      const [a, b] = open;
      if (a.id === b.id) {
        api.after(350, () => {
          a.el.classList.add('done');
          b.el.classList.add('done');
          api.good(b.el, a.wd);
          open = [];
          matched++;
          api.progress(matched, pairs);
          if (matched === pairs) api.after(900, () => api.finish({ stars: misses <= pairs ? 3 : misses <= pairs * 2 ? 2 : 1 }));
        });
      } else {
        misses++;
        api.after(950, () => {
          a.el.classList.remove('open');
          b.el.classList.remove('open');
          open = [];
        });
      }
    });
    grid.append(el);
  });
  api.progress(0, pairs);
  stage.replaceChildren(grid);
  api.tell('Busca las parejas. Toca dos cartas.');
};

/* Globos: explota los globos que tienen la palabra pedida. */
B.games.pop = (api) => {
  const { stage, words, level, world } = api;
  const target = B.pick(words);
  const need = [4, 6, 8][level];
  const cross = [9, 7.5, 6][level];
  const pastel = ['#ff8fab', '#7cc6fe', '#ffd166', '#95e06c', '#c79bff', '#ffa86b', '#6fe3d2'];
  const isColors = world.id === 'colors';
  let popped = 0;
  let last = performance.now();
  let spawnIn = 300;
  let running = true;
  const sky = B.h('div', { class: 'sky' });
  const live = [];
  const say = () => api.talk([['es', isColors ? 'Explota los globos de color' : 'Explota los globos con'], ['en', B.spoken(target)]]);
  stage.replaceChildren(sky, B.h('div', { class: 'prompt', style: 'position:absolute;top:8px;z-index:3' },
    B.h('button', { class: 'speak', 'aria-label': 'Escuchar', onClick: say }, '🔊'),
    B.art.word(target), B.h('span', {}, target.en)));
  api.progress(0, need);

  const spawn = () => {
    const isT = Math.random() < 0.45;
    const wd = isT ? target : B.pick(words.filter((x) => x !== target));
    const el = B.h('button', {
      class: 'balloon',
      style: `left:${5 + Math.random() * 78}%;background:${isColors ? wd.hex : B.pick(pastel)};border-color:${isColors ? wd.hex : '#0000'}`,
      'aria-label': wd.en,
    }, isColors ? null : B.art.word(wd));
    const b = { el, y: stage.clientHeight + 20, t: wd === target, speed: (stage.clientHeight + 160) / cross, dx: Math.random() * 6.28 };
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!running || el.classList.contains('popped')) return;
      if (b.t) {
        el.classList.add('popped');
        api.app.audio.sfx('pop');
        api.good(null, target);
        popped++;
        api.progress(popped, need);
        api.after(300, () => el.remove());
        b.dead = true;
        if (popped >= need) {
          running = false;
          api.en(B.spoken(target));
          api.after(900, () => api.finish());
        }
      } else {
        el.classList.remove('wiggle');
        void el.offsetWidth;
        el.classList.add('wiggle');
        api.bad(null);
        api.after(400, say);
      }
    });
    sky.append(el);
    live.push(b);
  };

  let raf = 0;
  const frame = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (running) {
      spawnIn -= dt * 1000;
      if (spawnIn <= 0 && live.length < 7) {
        spawn();
        spawnIn = 800 + Math.random() * 500;
      }
    }
    for (let i = live.length - 1; i >= 0; i--) {
      const b = live[i];
      b.y -= b.speed * dt;
      b.dx += dt * 2;
      b.el.style.transform = `translate(${Math.sin(b.dx) * 10}px, ${b.y}px)`;
      if (b.dead || b.y < -200) {
        if (!b.dead) b.el.remove();
        live.splice(i, 1);
      }
    }
    raf = requestAnimationFrame(frame);
  };
  api.onLeave(() => cancelAnimationFrame(raf));
  raf = requestAnimationFrame(frame);
  say();
};

/* ¿Qué sigue?: completa la serie. */
B.games.pattern = (api) => {
  const { stage, words, level } = api;
  const rounds = 5;
  const kinds = [['AB'], ['AB', 'AAB', 'ABB'], ['AB', 'AAB', 'ABB', 'ABC']][level];
  const len = [4, 5, 6][level];
  let round = 0;
  const next = api.guard(() => {
    if (round >= rounds) return api.finish();
    api.progress(round, rounds);
    const unit = B.pick(kinds);
    const letters = [...new Set(unit)];
    const items = B.sample(words, letters.length);
    const map = Object.fromEntries(letters.map((l, i) => [l, items[i]]));
    const seq = Array.from({ length: len + 1 }, (_, i) => map[unit[i % unit.length]]);
    const answer = seq[len];
    const others = B.sample(words.filter((x) => x !== answer), level === 0 ? 1 : 2);
    const opts = B.shuffle([answer, ...new Set([...items.filter((x) => x !== answer), ...others])].slice(0, level === 0 ? 2 : 3));
    if (!opts.includes(answer)) opts[0] = answer;
    const q = B.h('div', { class: 'cell q' }, '?');
    let locked = false;
    stage.replaceChildren(
      B.h('div', { class: 'seq' }, seq.slice(0, len).map((x) => B.h('div', { class: 'cell' }, B.art.word(x))), q),
      B.h('div', { class: 'choices' }, B.shuffle(opts).map((o) => {
        const btn = B.h('button', {
          class: 'choice',
          onClick: () => {
            if (locked || btn.classList.contains('no')) return;
            if (o === answer) {
              locked = true;
              q.replaceChildren(B.art.word(answer));
              q.classList.add('fill');
              btn.classList.add('ok');
              api.good(btn, answer);
              api.en(answer.letter ? B.spoken(answer) : answer.en);
              round++;
              api.after(1300, next);
            } else {
              btn.classList.add('no');
              api.bad(btn);
            }
          },
        }, B.art.word(o));
        return btn;
      })),
    );
  });
  api.tell('¿Qué viene después? Mira la serie.');
  next();
};

/* Cuenta: toca cada objeto para contarlo y elige el número. */
B.games.count = (api) => {
  const { stage, words, level, world } = api;
  const rounds = 5;
  const max = [3, 5, 10][level];
  const things = world.id === 'numbers' ? ['🍎', '⭐', '🐞', '🎈', '🐟', '🌸', '🍪', '🚗'].map((e) => ({ emoji: e })) : words.filter((x) => x.emoji);
  const used = new Set();
  let round = 0;
  const next = api.guard(() => {
    if (round >= rounds) return api.finish();
    api.progress(round, rounds);
    let n;
    do { n = 1 + B.rand(max); } while (used.has(n) && used.size < max);
    used.add(n);
    const thing = B.pick(things);
    let counted = 0;
    let locked = false;
    const objs = B.h('div', { class: 'objs' }, Array.from({ length: n }, () => {
      const o = B.h('button', { class: 'obj', style: `--r:${Math.round((Math.random() - 0.5) * 24)}deg`, 'aria-label': 'Contar' }, thing.emoji);
      o.addEventListener('click', () => {
        if (o.classList.contains('counted')) return;
        counted++;
        o.classList.add('counted');
        o.append(B.h('span', { class: 'badge' }, counted));
        api.app.audio.sfx('tap');
        api.en(B.NUM_EN[counted]);
      });
      return o;
    }));
    const pool = Array.from({ length: Math.max(max, 3) }, (_, i) => i + 1).filter((x) => x !== n);
    const opts = B.shuffle([n, ...B.sample(pool, 2)]);
    stage.replaceChildren(objs, B.h('div', { class: 'nums' }, opts.map((v) => {
      const btn = B.h('button', {
        class: 'numbtn',
        onClick: () => {
          if (locked) return;
          if (v === n) {
            locked = true;
            btn.classList.add('ok');
            api.good(btn, world.id === 'numbers' ? words[n - 1] : thing);
            api.en(thing.en && n > 1 ? `${B.NUM_EN[n]}!` : B.NUM_EN[n]);
            round++;
            api.after(1300, next);
          } else {
            api.bad(btn);
          }
        },
      }, v);
      return btn;
    })));
  });
  api.tell('Toca cada dibujo para contarlo. ¿Cuántos hay?');
  next();
};

/* Traza: sigue el camino de la letra o el número. */
B.games.trace = (api) => {
  const { stage, words, level, world } = api;
  const isNum = world.id === 'numbers';
  const easy = isNum ? ['1', '7', '4', '0'] : ['L', 'T', 'I', 'O', 'C', 'V', 'X', 'E', 'F', 'H'];
  const all = isNum ? ['1', '2', '3', '4', '5', '6', '7', '8', '9'] : Object.keys(B.STROKES).filter((k) => /[A-Z]/.test(k));
  const glyphs = B.sample(level === 0 ? easy : all, 3);
  let gi = 0;
  const canvas = B.h('canvas');
  const ex = B.h('div', { class: 'ex' });
  stage.replaceChildren(B.h('div', { class: 'trace' }, canvas, ex));
  const ctx = canvas.getContext('2d');
  let size = 300;
  let strokes = [];
  let si = 0;
  let ci = 0;
  let ink = [];
  let drawing = false;

  const fit = () => {
    const r = stage.getBoundingClientRect();
    size = Math.max(200, Math.min(r.width - 32, r.height - 190, 440));
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = `${size}px`;
    canvas.style.height = `${size}px`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render();
  };
  const pad = () => size * 0.12;
  const sc = () => (size - 2 * pad()) / 100;
  const P = ([x, y]) => [pad() + x * sc(), pad() + y * sc()];
  const line = (pts, color, width, dash) => {
    if (pts.length < 2) return;
    ctx.beginPath();
    ctx.setLineDash(dash || []);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    pts.forEach((p, i) => (i ? ctx.lineTo(...P(p)) : ctx.moveTo(...P(p))));
    ctx.stroke();
    ctx.setLineDash([]);
  };
  const render = () => {
    ctx.clearRect(0, 0, size, size);
    const u = sc();
    strokes.forEach((s, k) => line(s.pts, k < si ? world.color : '#ece6fa', 14 * u));
    strokes.forEach((s) => line(s.pts, '#c9bfe6', 1.6 * u, [3 * u, 4 * u]));
    if (si < strokes.length) {
      const s = strokes[si];
      line(s.pts.slice(0, s.cps[ci - 1] != null ? s.cps[ci - 1] + 1 : 1), world.color, 14 * u);
      s.cps.forEach((idx, k) => {
        if (k < ci) return;
        const [x, y] = P(s.pts[idx]);
        ctx.beginPath();
        ctx.fillStyle = k === ci ? '#ffb020' : '#d8d0ec';
        ctx.arc(x, y, (k === ci ? 3.2 : 2) * u, 0, Math.PI * 2);
        ctx.fill();
      });
      const [sx, sy] = P(s.pts[0]);
      if (ci === 0) {
        ctx.beginPath();
        ctx.fillStyle = '#2ec4b6';
        ctx.arc(sx, sy, 5.5 * u, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = `700 ${7 * u}px Fredoka, sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(si + 1), sx, sy + 0.5);
      }
    }
    if (ink.length > 1) {
      ctx.beginPath();
      ctx.strokeStyle = 'rgba(108,76,241,.55)';
      ctx.lineWidth = 6 * u;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ink.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
      ctx.stroke();
    }
  };
  const load = () => {
    const g = glyphs[gi];
    strokes = B.STROKES[g].map((segs) => {
      const pts = B.sampleStroke(segs);
      const cps = [];
      for (let i = 4; i < pts.length - 1; i += 5) cps.push(i);
      cps.push(pts.length - 1);
      return { pts, cps };
    });
    si = 0;
    ci = 0;
    ink = [];
    ex.replaceChildren(B.h('span', { class: 'muted' }, `Traza ${isNum ? 'el número' : 'la letra'} ${g}`));
    api.progress(gi, glyphs.length);
    render();
  };
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  };
  const check = ([x, y]) => {
    if (si >= strokes.length) return;
    const s = strokes[si];
    const reach = 10 * sc();
    for (let look = 0; look < 3 && ci + look < s.cps.length; look++) {
      const [px, py] = P(s.pts[s.cps[ci + look]]);
      if (Math.hypot(px - x, py - y) < reach) {
        ci += look + 1;
        break;
      }
    }
    if (ci >= s.cps.length) {
      si++;
      ci = 0;
      ink = [];
      api.app.audio.sfx('star');
      if (si >= strokes.length) done();
    }
  };
  const done = () => {
    drawing = false;
    render();
    const g = glyphs[gi];
    const wd = isNum ? words[Number(g) - 1] : words.find((x) => x.letter === g);
    api.good(canvas, wd);
    ex.replaceChildren(isNum
      ? B.h('span', {}, `${g} · ${wd.en}`)
      : B.h('span', {}, `${g} is for `, B.h('b', {}, wd.word), ` ${wd.emoji}`));
    api.talk(isNum ? [['en', wd.en]] : [['en', `${g}. ${g} is for ${wd.word}!`]]);
    gi++;
    api.after(2200, () => (gi >= glyphs.length ? api.finish({ stars: 3 }) : load()));
  };
  canvas.addEventListener('pointerdown', (e) => {
    if (si >= strokes.length) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* sin captura */ }
    drawing = true;
    ink = [pos(e)];
    check(ink[0]);
    render();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    const p = pos(e);
    ink.push(p);
    check(p);
    render();
  });
  const stop = () => {
    drawing = false;
    ink = [];
    render();
  };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointercancel', stop);
  const ro = new ResizeObserver(fit);
  ro.observe(stage);
  api.onLeave(() => ro.disconnect());
  load();
  fit();
  api.tell('Empieza en el punto verde y sigue los puntos con el dedo.');
};

/* Colorea: pinta cada parte con el color que se pide en inglés. */
B.games.color = (api) => {
  const { stage, words } = api;
  const tasks = B.sample(B.SCENE_TASKS.filter((t, i, a) => a.findIndex((x) => x.r === t.r) === i), 4);
  const colorOf = (en) => words.find((x) => x.en === en);
  const scene = B.art.scene();
  const palette = B.h('div', { class: 'palette' });
  const task = B.h('div', { class: 'task' });
  let sel = null;
  let ti = 0;
  const say = () => {
    const t = tasks[ti];
    api.talk([['es', `Pinta ${t.es} de color`], ['en', t.color]]);
  };
  const drawTask = () => {
    const t = tasks[ti];
    const c = colorOf(t.color);
    task.replaceChildren(
      B.h('button', { class: 'speak', style: 'width:44px;height:44px;font-size:20px', 'aria-label': 'Escuchar', onClick: say }, '🔊'),
      `Pinta ${t.es} de`, B.h('span', { class: 'sw', style: `background:${c.hex}` }), B.h('b', {}, t.color));
    api.progress(ti, tasks.length);
  };
  const pots = words.filter((x) => x.en !== 'white').map((c) => {
    const pot = B.h('button', {
      class: 'pot', style: `background:${c.hex}`, 'aria-label': c.en,
      onClick: () => {
        sel = c;
        pots.forEach((x) => x.classList.toggle('sel', x === pot));
        api.app.audio.sfx('tap');
        api.en(c.en);
      },
    });
    return pot;
  });
  palette.append(...pots);
  scene.addEventListener('click', (e) => {
    const part = e.target.closest('[data-r]');
    if (!part || ti >= tasks.length) return;
    if (!sel) {
      api.tell('Primero elige un color.');
      B.shake(palette);
      return;
    }
    const r = part.dataset.r;
    const t = tasks[ti];
    if (r === t.r && sel.en !== t.color) {
      api.bad(null);
      api.talk([['es', 'Ese es'], ['en', sel.en], ['es', '. Busca'], ['en', t.color]]);
      return;
    }
    scene.querySelectorAll(`[data-r="${r}"]`).forEach((n) => n.setAttribute('fill', sel.hex));
    api.app.audio.sfx('drop');
    if (r === t.r) {
      api.good(null, colorOf(t.color));
      ti++;
      if (ti >= tasks.length) {
        api.progress(ti, tasks.length);
        task.replaceChildren('¡Precioso! 🎨');
        api.after(1400, () => api.finish());
      } else {
        api.after(700, () => { drawTask(); say(); });
      }
    }
  });
  stage.replaceChildren(B.h('div', { class: 'color-wrap' }, task, scene, palette));
  drawTask();
  api.intro('Elige un color y toca el dibujo.');
  say();
};

/* Encaja formas: arrastra (o toca) cada forma hasta su silueta. */
B.games.shapes = (api) => {
  const { stage, words, level } = api;
  const per = level === 2 ? 4 : 3;
  const rounds = level === 0 ? 1 : 2;
  const order = B.sample(words, per * rounds);
  let round = 0;
  let placedTotal = 0;
  const next = api.guard(() => {
    if (round >= rounds) return api.finish();
    const set = order.slice(round * per, round * per + per);
    let placed = 0;
    let selected = null;
    const slots = set.map((wd) => {
      const s = B.h('div', { class: 'slot', dataset: { shape: wd.shape } }, B.shapeSvg(wd.shape, { fill: '#efeaf8', stroke: '#b9add6', dashed: true }));
      s.addEventListener('click', () => selected && tryPlace(selected, s));
      return s;
    });
    const tray = B.h('div', { class: 'tray' });
    const tryPlace = (piece, slot) => {
      const wd = piece.wd;
      if (slot.dataset.shape !== wd.shape || slot.classList.contains('full')) {
        api.bad(piece.el);
        return false;
      }
      slot.classList.add('full');
      slot.replaceChildren(B.shapeSvg(wd.shape));
      piece.el.remove();
      selected = null;
      placed++;
      placedTotal++;
      api.progress(placedTotal, per * rounds);
      api.good(slot, wd);
      api.en(wd.en);
      if (placed === set.length) {
        round++;
        api.after(1200, next);
      }
      return true;
    };
    B.shuffle(set).forEach((wd) => {
      const el = B.h('button', { class: 'piece', 'aria-label': wd.en }, B.shapeSvg(wd.shape));
      const piece = { el, wd };
      B.drag(el, {
        onStart: () => { api.app.audio.sfx('tap'); api.en(wd.en); },
        onTap: () => {
          selected = piece;
          tray.querySelectorAll('.piece').forEach((x) => x.classList.toggle('sel', x === el));
        },
        onDrop: (ev) => {
          const slot = B.hit(ev, slots);
          return slot ? tryPlace(piece, slot) : false;
        },
      });
      tray.append(el);
    });
    stage.replaceChildren(B.h('div', { class: 'board', style: `--n:${per}` }, slots), tray);
  });
  api.progress(0, per * rounds);
  api.tell('Arrastra cada forma a su sombra.');
  next();
};

/* Ordena: lleva cada cosa a su cesta. */
B.games.sort = (api) => {
  const { stage, words, level, world } = api;
  const set = B.SORT[world.id];
  const bins = level === 0 ? set.bins.slice(0, 2) : set.bins;
  const ids = new Set(bins.map((b) => b.id));
  const source = (set.items || words).filter((x) => ids.has(x.g));
  const per = Math.ceil((level === 0 ? 6 : 8) / bins.length);
  const items = B.shuffle(bins.flatMap((b) => B.sample(source.filter((x) => x.g === b.id), per)));
  let i = 0;
  const binEls = bins.map((b) => {
    const el = B.h('div', { class: 'bin', dataset: { id: b.id } },
      b.hex ? B.h('span', { class: 'ic sw', style: `background:${b.hex}` }) : B.h('span', { class: 'ic' }, b.icon),
      B.h('b', {}, b.es), B.h('small', {}, b.en), B.h('div', { class: 'got' }));
    el.addEventListener('click', () => current && place(el));
    return el;
  });
  const holder = B.h('div', { style: 'min-height:140px;display:grid;place-items:center' });
  let current = null;
  const place = (binEl) => {
    const it = current.item;
    if (binEl.dataset.id !== it.g) {
      api.bad(current.el);
      api.tell('Ese va en otra cesta.', false);
      return false;
    }
    binEl.querySelector('.got').append(B.h('span', {}, it.emoji));
    current.el.remove();
    api.good(binEl, it.en ? it : null);
    const bin = bins.find((b) => b.id === it.g);
    api.talk(it.en ? [['en', it.en]] : [['en', bin.en]]);
    current = null;
    i++;
    api.progress(i, items.length);
    if (i >= items.length) api.after(1000, () => api.finish());
    else api.after(600, show);
    return true;
  };
  const show = api.guard(() => {
    const item = items[i];
    const el = B.h('button', { class: 'item', 'aria-label': item.en || 'objeto' }, item.emoji);
    current = { el, item };
    B.drag(el, {
      onStart: () => item.en && api.en(item.en),
      onTap: () => {
        el.classList.add('sel');
        api.tell('Ahora toca la cesta correcta.', false);
      },
      onDrop: (ev) => {
        const target = B.hit(ev, binEls);
        return target ? place(target) : false;
      },
    });
    holder.replaceChildren(el);
  });
  stage.replaceChildren(holder, B.h('div', { class: 'bins' }, binEls));
  api.progress(0, items.length);
  api.talk([['es', 'Lleva cada dibujo a su cesta:'], ...bins.flatMap((b) => [['es', b.es], ['en', b.en]])]);
  api.tell('Arrastra cada dibujo a su cesta.', false);
  show();
};

/* Deletrea: forma la palabra en inglés tocando las letras en orden. */
B.games.spell = (api) => {
  const { stage, words, level } = api;
  const maxLen = level === 2 ? 6 : 5;
  const pool = words
    .map((x) => ({ wd: x, text: (x.word || x.en).toLowerCase() }))
    .filter((x) => /^[a-z]+$/.test(x.text) && x.text.length >= 3 && x.text.length <= maxLen);
  const rounds = Math.min(4, pool.length);
  const list = B.sample(pool, rounds);
  let round = 0;
  const next = api.guard(() => {
    if (round >= rounds) return api.finish();
    api.progress(round, rounds);
    const { wd, text } = list[round];
    let pos = 0;
    const slots = [...text].map(() => B.h('div', { class: 'slotL' }));
    const extra = level === 2 ? B.sample([...'abcdefghijklmnoprstuw'].filter((c) => !text.includes(c)), 2) : [];
    const say = () => api.en(text);
    const tiles = B.shuffle([...text, ...extra]).map((ch) => {
      const t = B.h('button', { class: 'tile' }, ch);
      t.addEventListener('click', () => {
        if (pos >= text.length || t.classList.contains('used')) return;
        if (ch === text[pos]) {
          t.classList.add('used');
          slots[pos].textContent = ch;
          slots[pos].classList.add('fill');
          pos++;
          api.app.audio.sfx('tap');
          if (pos === text.length) {
            api.good(slots.at(-1), wd);
            say();
            round++;
            api.after(1500, next);
          }
        } else {
          api.bad(t);
        }
      });
      return t;
    });
    stage.replaceChildren(
      B.h('div', { style: 'display:flex;align-items:center;gap:16px' },
        B.h('div', { class: 'word-pic' }, wd.letter ? wd.emoji : B.art.word(wd)),
        B.h('button', { class: 'speak', 'aria-label': 'Escuchar', onClick: say }, '🔊')),
      B.h('div', { class: 'slots' }, slots),
      B.h('div', { class: 'tiles' }, tiles));
    say();
  });
  api.intro('Escucha la palabra y toca las letras en orden.');
  next();
};

/* ---- 60-parents.js ---- */
/* Brotes · área de padres: progreso, perfiles y ajustes. */
B.actName = (key) => {
  const [a, b] = key.split(':');
  if (a === 'story') return `📖 ${B.STORIES.find((s) => s.id === b)?.es || 'Cuento'}`;
  if (a === 'song') return `🎵 ${B.SONGS.find((s) => s.id === b)?.es || 'Canción'}`;
  if (a === 'gift') return '🎁 Regalo del camino';
  const wd = B.world(a);
  const t = B.TEMPLATES[b];
  return wd && t ? `${t.icon} ${t.es} · ${wd.es}` : key;
};

B.screens.parents = (app, { tab = 'progress', pid = null } = {}) => {
  const s = app.store;
  const body = B.h('div', { class: 'scroll' });
  const tabs = [['progress', 'Progreso'], ['profiles', 'Perfiles'], ['settings', 'Ajustes']];
  const go = (t, extra = {}) => app.go('parents', { tab: t, pid, ...extra });
  app.frame.append(B.h('div', { class: 'parents' },
    B.h('div', { class: 'ptop' },
      B.h('h2', {}, 'Área de padres'),
      B.h('button', { class: 'btn small', onClick: () => app.go(s.profile ? 'home' : s.data.profiles.length ? 'who' : 'welcome') }, 'Volver al juego')),
    B.h('div', { class: 'ptabs' }, tabs.map(([id, label]) => B.h('button', { class: `ptab${id === tab ? ' on' : ''}`, onClick: () => go(id) }, label))),
    body));
  if (tab === 'progress') B.parentsProgress(app, body, pid);
  else if (tab === 'profiles') B.parentsProfiles(app, body);
  else B.parentsSettings(app, body);
};

B.parentsProgress = (app, body, pid) => {
  const s = app.store;
  const profiles = s.data.profiles;
  if (!profiles.length) {
    body.append(B.h('p', { class: 'muted' }, 'Todavía no hay perfiles.'));
    return;
  }
  const p = profiles.find((x) => x.id === pid) || s.profile || profiles[0];
  if (profiles.length > 1) {
    body.append(B.h('div', { class: 'chips', style: 'margin-bottom:14px' }, profiles.map((x) => B.h('button', {
      class: `chip${x.id === p.id ? ' on' : ''}`, onClick: () => app.go('parents', { tab: 'progress', pid: x.id }),
    }, `${B.AVATARS[x.avatar][0]} ${x.name}`))));
  }
  const plays = Object.values(p.acts).reduce((n, a) => n + a.plays, 0);
  const days = B.daysBack(7);
  const mins = days.map((d) => Math.round((p.time[B.today(d)] || 0) / 60));
  const learned = Object.entries(p.words).sort((a, b) => b[1] - a[1]);
  const kpi = (v, label) => B.h('div', { class: 'kpi' }, B.h('b', {}, v), B.h('span', {}, label));
  body.append(B.h('div', { class: 'kpis' },
    kpi(`⭐ ${p.stars}`, 'Estrellas'),
    kpi(plays, 'Actividades terminadas'),
    kpi(`${mins.at(-1)} min`, 'Jugado hoy'),
    kpi(`${mins.reduce((a, b) => a + b, 0)} min`, 'Últimos 7 días'),
    kpi(learned.length, 'Palabras en inglés practicadas'),
    kpi(`${p.stickers.length}/${B.STICKERS.length}`, 'Pegatinas'),
  ));

  const maxMin = Math.max(5, ...mins);
  const DAYS = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
  body.append(B.h('div', { class: 'psec' },
    B.h('h3', {}, 'Minutos de juego por día'),
    B.h('div', { class: 'week' }, days.map((d, i) => B.h('div', { class: 'col' },
      B.h('em', {}, mins[i]),
      B.h('div', { class: `bar${i === 6 ? ' today' : ''}`, style: `height:${(mins[i] / maxMin) * 100}%` }),
      B.h('small', {}, i === 6 ? 'Hoy' : DAYS[d.getDay()]))))));

  const byWorld = B.WORLDS.map((wd) => {
    const acts = B.actsFor(wd, p.age);
    const st = acts.reduce((n, t) => n + (p.acts[`${wd.id}:${t}`]?.best || 0), 0);
    return { wd, pct: Math.round((st / (acts.length * 3)) * 100), st, maxSt: acts.length * 3 };
  });
  body.append(B.h('div', { class: 'psec' },
    B.h('h3', {}, 'Dominio por mundo (mejores estrellas)'),
    B.h('div', { class: 'hbars' }, byWorld.map(({ wd, pct, st, maxSt }) => B.h('div', { class: 'hbar' },
      B.h('span', {}, `${wd.icon} ${wd.es}`),
      B.h('div', { class: 'track' }, B.h('div', { class: 'fill', style: `width:${pct}%;background:${wd.color}` })),
      B.h('span', { class: 'v' }, `${st}/${maxSt}`))))));

  body.append(B.h('div', { class: 'psec' },
    B.h('h3', {}, 'Palabras en inglés que ha practicado'),
    learned.length
      ? B.h('div', { class: 'chips' }, learned.slice(0, 60).map(([en, n]) => B.h('span', { class: 'chip' }, `${en} ×${n}`)))
      : B.h('p', { class: 'note' }, 'Aparecerán aquí cuando acierte palabras en los juegos.')));

  body.append(B.h('div', { class: 'psec' },
    B.h('h3', {}, 'Actividad reciente'),
    p.log.length
      ? B.h('ul', { class: 'log' }, p.log.slice(0, 12).map((e) => B.h('li', {},
        B.h('span', {}, B.actName(e.key), e.stars ? ` · ${'★'.repeat(e.stars)}` : ''),
        B.h('span', {}, new Date(e.t).toLocaleString('es-ES', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })))))
      : B.h('p', { class: 'note' }, 'Sin actividad todavía.')));
};

B.parentsProfiles = (app, body) => {
  const s = app.store;
  const list = B.h('div', { class: 'psec' }, B.h('h3', {}, 'Perfiles (máximo 4)'));
  s.data.profiles.forEach((p) => {
    list.append(B.h('div', { class: 'prow' },
      B.art.avatar(p.avatar),
      B.h('div', { class: 'grow' }, B.h('b', {}, p.name), B.h('div', { class: 'note' }, `${p.age} años · ⭐ ${p.stars}`)),
      B.h('button', { class: 'btn light small', onClick: () => app.go('profileForm', { edit: p.id, back: 'parents' }) }, 'Editar'),
      B.h('button', {
        class: 'btn danger small',
        onClick: () => {
          const close = app.modal(B.h('div', {},
            B.h('h2', {}, `¿Borrar a ${p.name}?`),
            B.h('p', { class: 'muted', style: 'margin-top:8px' }, 'Se perderán su progreso y sus pegatinas en este dispositivo.'),
            B.h('div', { class: 'row' },
              B.h('button', { class: 'btn light', onClick: () => close() }, 'Cancelar'),
              B.h('button', {
                class: 'btn danger',
                onClick: () => {
                  s.removeProfile(p.id);
                  close();
                  app.go(s.data.profiles.length ? 'parents' : 'welcome', { tab: 'profiles' });
                },
              }, 'Borrar'))));
        },
      }, 'Borrar')));
  });
  body.append(list);
  if (s.data.profiles.length < 4) {
    body.append(B.h('button', { class: 'btn', onClick: () => app.go('profileForm', { back: 'parents' }) }, '+ Añadir perfil'));
  }
};

B.parentsSettings = (app, body) => {
  const s = app.store;
  const st = s.settings;
  const refresh = () => app.go('parents', { tab: 'settings' });
  const toggle = (key) => B.h('button', {
    class: `switch${st[key] ? ' on' : ''}`, role: 'switch', 'aria-checked': String(!!st[key]),
    onClick: () => { st[key] = !st[key]; s.save(); refresh(); },
  });
  const seg = (key, options) => B.h('div', { class: 'seg' }, options.map(([v, label]) => B.h('button', {
    class: `chip${st[key] === v ? ' on' : ''}`, onClick: () => { st[key] = v; s.save(); refresh(); },
  }, label)));
  const row = (title, desc, control) => B.h('div', { class: 'setting' }, B.h('div', {}, B.h('b', {}, title), desc ? B.h('p', {}, desc) : null), control);
  body.append(B.h('div', { class: 'psec' },
    B.h('h3', {}, 'Sonido y voz'),
    row('Efectos de sonido', null, toggle('sfx')),
    row('Voz', 'Lee instrucciones en español y palabras en inglés con la voz del dispositivo.', toggle('voice')),
    row('Velocidad de la voz', null, seg('rate', [[0.75, 'Lenta'], [0.9, 'Normal'], [1.05, 'Rápida']])),
    row('Acento del inglés', null, seg('accent', [['en-US', 'EE. UU.'], ['en-GB', 'Reino Unido']])),
    B.h('div', { style: 'margin-top:10px' }, B.h('button', {
      class: 'btn light small', onClick: () => app.audio.talk([['es', 'Hola, soy Tako.'], ['en', 'Hello! Let’s play!']]),
    }, '🔊 Probar la voz'))));
  body.append(B.h('div', { class: 'psec' },
    B.h('h3', {}, 'Tiempo de pantalla'),
    row('Límite diario por perfil', 'Al llegar al límite aparece una pantalla de descanso; un adulto puede dar 15 minutos más.',
      seg('dailyLimit', [[0, 'Sin límite'], [15, '15 min'], [30, '30 min'], [45, '45 min'], [60, '60 min']]))));
  body.append(B.h('div', { class: 'psec' },
    B.h('h3', {}, 'Privacidad'),
    B.h('p', { class: 'note' }, 'Juega en Inglés no tiene anuncios, no usa analítica de terceros y no envía datos a ningún servidor: los perfiles y el progreso se guardan solo en este navegador. La voz usa el sintetizador del propio dispositivo.')));
  const danger = B.h('div', { class: 'psec' },
    B.h('h3', {}, 'Datos'),
    B.h('button', {
      class: 'btn danger small',
      onClick: () => {
        const close = app.modal(B.h('div', {},
          B.h('h2', {}, '¿Borrar todo?'),
          B.h('p', { class: 'muted', style: 'margin-top:8px' }, 'Se eliminarán todos los perfiles, el progreso y los ajustes de este dispositivo.'),
          B.h('div', { class: 'row' },
            B.h('button', { class: 'btn light', onClick: () => close() }, 'Cancelar'),
            B.h('button', { class: 'btn danger', onClick: () => { s.reset(); close(); app.go('welcome'); } }, 'Borrar todo'))));
      },
    }, 'Borrar todos los datos'));
  body.append(danger);
  if (app.opts.exitLabel) {
    body.append(B.h('button', { class: 'btn', onClick: () => app.exitToHost() }, app.opts.exitLabel));
  }
};

/* ---- 90-element.js ---- */
/* Brotes · componente web <brotes-app> y API de montaje para integrarlo en otra app.
   Atributos: storage-key (espacio de guardado), exit-label (muestra un botón "volver" en el área de padres
   que emite el evento 'brotes-exit'), home-button (añade ese mismo botón, como 🏠, en la barra de los niños). */
(() => {
  if (!document.querySelector('link[data-brotes-font]')) {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap';
    link.dataset.brotesFont = '';
    document.head.append(link);
  }

  class BrotesElement extends HTMLElement {
    connectedCallback() {
      if (this.app) {
        this.app.resume();
        return;
      }
      const root = this.shadowRoot || this.attachShadow({ mode: 'open' });
      this.app = new B.App(this, root, {
        storageKey: this.getAttribute('storage-key') || 'brotes.v1',
        exitLabel: this.getAttribute('exit-label') || '',
        homeButton: this.hasAttribute('home-button'),
      });
    }

    disconnectedCallback() {
      this.app?.pause();
    }
  }

  if (!customElements.get('brotes-app')) customElements.define('brotes-app', BrotesElement);

  window.Brotes = {
    version: '1.0.0',
    mount(container, { storageKey, exitLabel, onExit } = {}) {
      const el = document.createElement('brotes-app');
      if (storageKey) el.setAttribute('storage-key', storageKey);
      if (exitLabel) el.setAttribute('exit-label', exitLabel);
      if (onExit) el.addEventListener('brotes-exit', onExit);
      el.style.height = '100%';
      container.append(el);
      return el;
    },
  };
})();

})();

document.querySelector('brotes-app').addEventListener('brotes-exit', () => {
  /* vuelve a la portada igual que los demás juegos de Aprende con Lupi */
  const r = document.referrer;
  try { if (r && new URL(r).origin === location.origin && new URL(r).pathname !== location.pathname) { location.href = r; return; } } catch (e) { /* sin referencia */ }
  location.href = './';
});
</script>
