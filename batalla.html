<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Batalla de Lupi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
  /* Un tablero de campaña: mapa de 25 fuertes, tienda del castillo y academia. Mismo mundo que Aprende con Lupi, con banderas azul (tú) y roja (enemigo). */
  :root{
    --sky:#A9DDF5;
    --grass:#5DBB55;
    --grass-d:#3E9A3A;
    --path:#E9D3A2;
    --ink:#2B2250;
    --ink-soft:#5A5170;
    --card:#FFFFFF;
    --line:#D3DCE8;
    --track:#E6EEF6;
    --coral:#FF6B4A;
    --gold:#FFC83D;
    --star:#D98A00;
    --blue:#3E7BD6;
    --red:#D9344B;
    --ok:#2E9B6A;
    --display:'Baloo 2', ui-rounded, system-ui, sans-serif;
    --body:'Nunito', system-ui, sans-serif;
    color-scheme:light;
  }
  html,body{background:var(--sky);}
  body{color:var(--ink); font-family:var(--body); font-size:16px;}
  *{box-sizing:border-box;}
  button{font:inherit; color:inherit;}
  button:focus-visible,a:focus-visible{outline:4px solid var(--ink); outline-offset:3px;}
  .bl-app{max-width:760px; margin:0 auto; padding-inline:16px; padding-block:14px 110px; display:flex; flex-direction:column; gap:16px;}
  .bl-top{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .bl-top h1{margin:0; font-family:var(--display); font-weight:800; font-size:clamp(26px,6vw,40px); line-height:1; flex:1 1 auto; text-wrap:balance;}
  .bl-stars{display:inline-flex; align-items:center; gap:6px; background:var(--ink); color:#FFFFFF; border-radius:999px; padding:6px 14px 6px 10px; font-family:var(--display); font-weight:800; font-size:22px; font-variant-numeric:tabular-nums;}
  .bl-stars svg{width:24px; height:24px; fill:var(--gold);}
  .bl-pop{animation:bl-pop .5s ease;}
  @keyframes bl-pop{50%{transform:scale(1.18)}}
  .bl-back{min-height:44px; padding:0 16px; border-radius:999px; border:2px solid var(--ink); background:var(--card); font-family:var(--display); font-weight:800; font-size:18px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  .bl-back svg{width:20px; height:20px;}
  .bl-card{background:var(--card); border-radius:24px; padding:18px; box-shadow:0 6px 0 rgba(43,34,80,.12); display:flex; flex-direction:column; gap:12px; min-width:0;}
  .bl-card h2{margin:0; font-family:var(--display); font-weight:800; font-size:24px; line-height:1.1;}
  .bl-card h3{margin:0; font-family:var(--display); font-weight:800; font-size:19px; line-height:1.15;}
  .bl-p{margin:0; font-weight:700; font-size:16px; line-height:1.4; color:var(--ink-soft); max-width:62ch;}
  .bl-small{font-size:14px;}

  /* ---- Mapa ---- */
  .bl-map{position:relative; border-radius:30px; overflow:hidden; background:var(--grass); box-shadow:0 12px 30px rgba(20,60,40,.25);}
  .bl-map svg{display:block; width:100%; height:auto;}
  .bl-node{cursor:pointer;}
  .bl-node:focus{outline:none;}
  .bl-node:focus-visible circle.bl-ring{stroke:var(--ink); stroke-width:6;}
  .bl-node.is-locked{cursor:default;}
  .bl-node .bl-num{font-family:var(--display); font-weight:800;}
  .bl-pulse{animation:bl-pulse 1.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
  @keyframes bl-pulse{50%{transform:scale(1.12)}}

  .bl-menu{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
  .bl-tile{display:flex; align-items:center; gap:12px; padding:14px; min-height:84px; border-radius:22px; border:none; cursor:pointer; text-align:left; box-shadow:0 6px 0 rgba(0,0,0,.15); color:#FFFFFF;}
  .bl-tile:active{transform:translateY(3px); box-shadow:0 3px 0 rgba(0,0,0,.15);}
  .bl-tile svg{width:46px; height:46px; flex:none;}
  .bl-tile b{display:block; font-family:var(--display); font-weight:800; font-size:21px; line-height:1.05;}
  .bl-tile span{display:block; font-weight:700; font-size:13px; line-height:1.25; opacity:.95;}
  .bl-tile-txt{min-width:0;}
  .t-acad{background:#8A5CF6;} .t-cuartel{background:var(--blue);} .t-herr{background:#C0803A;} .t-ayu{background:var(--ok);}

  .bl-armybar{display:flex; flex-wrap:wrap; gap:8px;}
  .bl-chip{display:inline-flex; align-items:center; gap:6px; padding:5px 12px 5px 6px; border-radius:999px; background:var(--track); font-weight:800; font-size:15px; font-variant-numeric:tabular-nums;}
  .bl-chip svg{width:26px; height:26px;}

  /* ---- Unidades ---- */
  .bl-ic{width:44px; height:44px; flex:none; border-radius:14px; display:flex; align-items:center; justify-content:center;}
  .bl-ic svg{width:80%; height:80%;}
  .bl-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  .bl-row-txt{flex:1 1 140px; min-width:0;}
  .bl-row-txt b{display:block; font-family:var(--display); font-weight:800; font-size:19px; line-height:1.1;}
  .bl-row-txt span{display:block; font-weight:700; font-size:14px; color:var(--ink-soft); line-height:1.3;}
  .bl-list{display:flex; flex-direction:column; gap:10px;}
  .bl-step{display:flex; align-items:center; gap:4px;}
  .bl-step button{min-width:44px; height:44px; border-radius:12px; border:2px solid var(--line); background:var(--card); font-family:var(--display); font-weight:800; font-size:17px; cursor:pointer; padding:0 6px;}
  .bl-step button:disabled{opacity:.35; cursor:default;}
  .bl-step output{min-width:52px; text-align:center; font-family:var(--display); font-weight:800; font-size:24px; font-variant-numeric:tabular-nums;}
  .bl-meter{height:16px; border-radius:999px; background:var(--track); overflow:hidden;}
  .bl-meter i{display:block; height:100%; background:var(--blue); border-radius:999px; transition:width .3s;}
  .bl-meter.is-full i{background:var(--coral);}
  .bl-btn{min-height:52px; padding:0 22px; border-radius:999px; border:none; background:var(--coral); color:#FFFFFF; font-family:var(--display); font-weight:800; font-size:21px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.18); display:inline-flex; align-items:center; justify-content:center; gap:8px;}
  .bl-btn:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .bl-btn:disabled{opacity:.45; cursor:default; transform:none;}
  .bl-btn.is-ghost{background:var(--card); color:var(--ink); border:2px solid var(--line); box-shadow:none;}
  .bl-btn.is-gold{background:var(--gold); color:#3A2A00;}
  .bl-btn.is-blue{background:var(--blue);}
  .bl-btn.is-small{min-height:44px; font-size:17px; padding:0 16px;}
  .bl-btn svg{width:22px; height:22px;}
  .bl-cost{display:inline-flex; align-items:center; gap:3px; font-variant-numeric:tabular-nums;}
  .bl-cost svg{width:18px; height:18px; fill:currentColor;}
  .bl-actions{display:flex; flex-wrap:wrap; gap:10px;}

  .bl-enemy{display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px;}
  .bl-eg{display:flex; align-items:center; gap:10px; padding:10px; border-radius:16px; border:2px solid var(--line); min-width:0;}
  .bl-eg b{display:block; font-family:var(--display); font-weight:800; font-size:24px; line-height:1; font-variant-numeric:tabular-nums;}
  .bl-eg span{display:block; font-weight:700; font-size:14px; color:var(--ink-soft);}
  .bl-eg.is-hidden{border-style:dashed; background:var(--track);}
  .bl-trait{display:flex; gap:12px; align-items:flex-start; padding:12px; border-radius:16px; background:#FFF1D6;}
  .bl-trait svg{width:52px; height:52px; flex:none;}
  .bl-trait.is-wall{background:#EFE7DF;}

  .bl-tri{display:block; width:100%; max-width:340px; height:auto; margin:0 auto;}

  .bl-help{display:flex; flex-wrap:wrap; gap:8px;}
  .bl-toggle{display:inline-flex; align-items:center; gap:8px; min-height:48px; padding:6px 14px 6px 8px; border-radius:999px; border:2px solid var(--line); background:var(--card); cursor:pointer; font-weight:800; font-size:15px; text-align:left;}
  .bl-toggle svg{width:30px; height:30px; flex:none;}
  .bl-toggle[aria-pressed="true"]{border-color:var(--ok); background:#DDF3E7;}
  .bl-toggle small{display:block; font-weight:700; font-size:12px; color:var(--ink-soft);}
  .bl-advice{padding:12px 14px; border-radius:16px; background:#EDE6FF; font-weight:800; font-size:16px; line-height:1.4;}
  .bl-warn{padding:10px 14px; border-radius:14px; background:#FFE3DC; color:#7A1E10; font-weight:800; font-size:15px;}

  /* ---- Batalla ---- */
  .bl-field{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px;}
  .bl-side{border-radius:20px; padding:12px; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .bl-side.me{background:#DCE9FB;} .bl-side.foe{background:#FBDDE2;}
  .bl-side h3{margin:0; font-family:var(--display); font-weight:800; font-size:18px;}
  .bl-g{display:flex; align-items:center; gap:8px; min-width:0;}
  .bl-g .bl-ic{width:36px; height:36px; border-radius:10px;}
  .bl-g-in{flex:1; min-width:0;}
  .bl-g-top{display:flex; justify-content:space-between; gap:6px; font-weight:800; font-size:14px; font-variant-numeric:tabular-nums;}
  .bl-g-top span:first-child{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bl-hp{height:10px; border-radius:999px; background:rgba(255,255,255,.8); overflow:hidden; margin-top:3px;}
  .bl-hp i{display:block; height:100%; border-radius:999px; transition:width .55s ease;}
  .me .bl-hp i{background:var(--blue);} .foe .bl-hp i{background:var(--red);}
  .bl-hp.wall i{background:#8A5A3C;}
  .bl-hit{animation:bl-hit .45s ease;}
  @keyframes bl-hit{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .bl-round{font-family:var(--display); font-weight:800; font-size:26px; text-align:center; margin:0;}
  .bl-log{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto;}
  .bl-log li{padding:8px 12px; border-radius:12px; background:var(--track); font-weight:700; font-size:15px; line-height:1.35;}
  .bl-log li b{font-family:var(--display);}
  .bl-result{text-align:center; align-items:center;}
  .bl-result h2{font-size:38px;}
  .bl-crowns{display:flex; gap:8px; justify-content:center;}
  .bl-crowns svg{width:54px; height:54px;}


  /* ---- Tablero ---- */
  .bl-fhead{display:flex; align-items:flex-end; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .bl-turn{margin:0; font-family:var(--display); font-weight:800; font-size:26px; line-height:1.05;}
  .bl-board{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:3px; padding:6px; border-radius:22px; background:#3E9A3A; width:100%; max-width:480px; margin:0 auto; box-shadow:0 10px 24px rgba(20,60,40,.25); touch-action:manipulation;}
  .bl-cell{position:relative; aspect-ratio:1 / 1; max-width:100%; border:none; border-radius:9px; background:#6FC966; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center; overflow:visible;}
  .bl-cell:nth-child(odd){background:#69C160;}
  .bl-cell.is-home{background:#8FD487;}
  .bl-cell.is-deploy{box-shadow:inset 0 0 0 2px rgba(255,255,255,.7);}
  .bl-cell.is-rubble{background:#B9A88E;}
  .bl-cell.is-wall{background:#C9B79C;}
  .bl-cell.is-move{background:#BFE3FF; box-shadow:inset 0 0 0 3px #3E7BD6;}
  .bl-cell.is-target{box-shadow:inset 0 0 0 3px #D9344B, 0 0 0 2px #FFFFFF; animation:bl-glow 1s ease-in-out infinite;}
  @keyframes bl-glow{50%{box-shadow:inset 0 0 0 5px #D9344B, 0 0 0 2px #FFFFFF;}}
  .bl-cell.is-sel{box-shadow:inset 0 0 0 4px #FFC83D, 0 0 0 2px #2B2250; z-index:1;}
  .bl-tok{width:82%; height:82%; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#FFFFFF;}
  .is-me .bl-tok{box-shadow:0 0 0 3px #3E7BD6;}
  .is-foe .bl-tok{box-shadow:0 0 0 3px #D9344B;}
  .is-boss .bl-tok{width:96%; height:96%; background:#FFF1D6;}
  .bl-tok svg{width:70%; height:70%;}
  .is-done .bl-tok{opacity:.45;}
  .bl-n{position:absolute; right:-2px; bottom:-3px; min-width:20px; padding:0 4px; border-radius:999px; font-family:var(--display); font-weight:800; font-size:13px; line-height:18px; color:#FFFFFF; text-align:center; font-variant-numeric:tabular-nums;}
  .is-me .bl-n{background:#3E7BD6;} .is-foe .bl-n{background:#D9344B;}
  .bl-hitp{position:absolute; left:50%; top:-8px; transform:translateX(-50%); padding:0 5px; border-radius:999px; background:#2B2250; color:#FFFFFF; font-family:var(--display); font-weight:800; font-size:12px; line-height:17px; white-space:nowrap; z-index:2; pointer-events:none;}
  .bl-wall{width:86%; height:70%; display:flex;}
  .bl-wall svg{width:100%; height:100%;}
  .bl-cell .bl-bar{position:absolute; left:10%; right:10%; bottom:4px; height:5px; border-radius:999px; background:rgba(255,255,255,.8); overflow:hidden;}
  .bl-cell .bl-bar i{display:block; height:100%; background:#8A5A3C;}
  .is-boss .bl-bar i{background:#D9344B;}
  .bl-cell.bl-hit{animation:bl-hit .45s ease;}
  .bl-info{padding:12px 14px; min-height:72px;}
  .bl-pend{background:#FFF1D6;}
  @media (max-width:420px){ .bl-board{gap:2px; padding:4px; border-radius:16px;} .bl-cell{border-radius:6px;} .bl-n{font-size:11px; line-height:15px; min-width:16px;} .bl-hitp{font-size:10px; line-height:15px;} }
  @media (prefers-reduced-motion: reduce){ .bl-cell.is-target{animation:none;} }

  /* ---- Batalla en directo ---- */
  html.lv-lock, html.lv-lock body{overflow:hidden; overscroll-behavior:none;}
  .lv-root{position:fixed; inset:0; z-index:3000; display:flex; flex-direction:column; background:#2E5E2A; color:#FFFFFF; font-family:var(--body);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); user-select:none; -webkit-user-select:none;}
  .lv-hud{display:flex; align-items:center; gap:8px; padding:8px 10px; background:linear-gradient(#3A2A1A,#2B1F14); border-bottom:3px solid #C9952B; flex:none;}
  .lv-hbtn{width:44px; height:44px; flex:none; border-radius:12px; border:2px solid #C9952B; background:#5A3E22; color:#FFE9B0; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;}
  .lv-hbtn svg{width:22px; height:22px; fill:currentColor;}
  .lv-hmid{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; line-height:1.05;}
  .lv-lvl{font-weight:800; font-size:12px; color:#FFE9B0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
  .lv-time{font-family:var(--display); font-weight:800; font-size:26px; font-variant-numeric:tabular-nums;}
  .lv-time.is-low{color:#FF8A6B;}
  .lv-hstat{display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex:none;}
  .lv-foes,.lv-camp{display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-family:var(--display); font-weight:800; font-size:15px; font-variant-numeric:tabular-nums; line-height:20px;}
  .lv-foes{background:#8E1B2C;} .lv-foes i{width:10px; height:10px; border-radius:50%; background:#FF8FA3;}
  .lv-camp{background:#24508F;} .lv-camp svg{width:13px; height:13px; fill:#FF8FA3;}
  .lv-field{flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#3E7A34;}
  .lv-field canvas{display:block; touch-action:none; border-radius:6px; box-shadow:0 0 0 2px rgba(0,0,0,.25);}
  .lv-sel{position:absolute; left:8px; top:8px; display:flex; flex-direction:column; align-items:flex-start; gap:6px; z-index:2;}
  .lv-all{min-height:40px; padding:0 14px; border-radius:999px; border:2px solid #FFFFFF; background:rgba(36,80,143,.9); color:#FFFFFF; font-family:var(--display); font-weight:800; font-size:16px; cursor:pointer;}
  .lv-selk{display:flex; align-items:center; gap:4px; min-height:34px; padding:0 10px 0 4px; border-radius:999px; border:2px solid rgba(255,255,255,.85); background:rgba(36,80,143,.78); color:#FFFFFF; font-family:var(--display); font-weight:800; font-size:13px; cursor:pointer;}
  .lv-selk[hidden]{display:none;}
  .lv-selk .lv-ic{width:26px; height:26px; display:inline-flex; background:#FFFFFF; border-radius:50%; padding:2px;}
  .lv-selk .lv-ic svg{width:100%; height:100%;}
  .lv-all.is-on, .lv-selk.is-on{background:#FFC83D; color:#2B2250; border-color:#FFFFFF;}
  .lv-pista{margin:10px 0; padding:10px 12px; border-radius:14px; background:#FFF4CF; border:2px solid #FFC83D; color:#2B2250; font-weight:700; font-size:15px; line-height:1.35; text-align:left;}
  .lv-pista b{display:block; font-family:var(--display); font-size:16px; margin-bottom:2px;}
  .lv-hflag{width:18px; height:18px; vertical-align:-3px; margin-right:3px;}
  .lv-tip{position:absolute; left:50%; bottom:10px; transform:translateX(-50%); max-width:calc(100% - 24px); padding:8px 14px; border-radius:14px; background:rgba(43,34,80,.88); color:#FFFFFF; font-weight:800; font-size:15px; text-align:center; pointer-events:none;}
  .lv-bar{flex:none; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:5px; padding:6px; background:linear-gradient(#5A3E22,#3A2A1A); border-top:3px solid #C9952B;}
  .lv-item{position:relative; min-height:62px; border-radius:12px; border:2px solid #C9952B; background:linear-gradient(#FFF3D6,#F2D9A6); color:#3A2A00; cursor:pointer; padding:3px 2px 3px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; overflow:hidden; min-width:0;}
  .lv-item:active{transform:translateY(2px);}
  .lv-item:focus-visible{outline:3px solid #FFFFFF; outline-offset:1px;}
  .lv-item .lv-ic{width:26px; height:26px;}
  .lv-ic{display:inline-flex; flex:none;} .lv-ic svg{width:100%; height:100%;}
  .lv-iname{font-family:var(--display); font-weight:800; font-size:11.5px; line-height:1.05; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%;}
  .lv-cost{font-weight:800; font-size:10px; line-height:1.1; padding:1px 6px; border-radius:999px; background:#8A5CF6; color:#FFFFFF; white-space:nowrap;}
  .lv-cd{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:24px; color:#FFFFFF;
    background:conic-gradient(rgba(30,20,10,.72) calc(var(--p,0) * 360deg), transparent 0); pointer-events:none; text-shadow:0 2px 0 rgba(0,0,0,.4);}
  .lv-item.is-locked{filter:grayscale(1); opacity:.55;}
  .lv-item.is-locked .lv-cost{background:#5A5170;}
  .lv-item.is-aim{border-color:#FFFFFF; box-shadow:0 0 0 3px #FFC83D; animation:bl-pulse 1s infinite;}
  .lv-root .bl-modal{z-index:3100;}
  .lv-root .bl-card{color:var(--ink);}
  .lv-qhead{display:flex; align-items:center; gap:10px;}
  .lv-qhead .lv-ic{width:44px; height:44px;}
  .lv-qhead b{display:block; font-family:var(--display); font-weight:800; font-size:20px; line-height:1.1;}
  .lv-qhead span{display:block; font-weight:800; font-size:14px; color:var(--ink-soft);}
  .lv-memseq{font-size:clamp(34px,10vw,52px); letter-spacing:.1em;}
  .lv-minis{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px;}
  .lv-mini{display:flex; gap:10px; align-items:flex-start; font-weight:700; font-size:15px; line-height:1.35; color:var(--ink-soft); min-width:0;}
  .lv-mini .lv-ic{width:34px; height:34px;}
  .lv-mini b{color:var(--ink);} .lv-mini i{font-style:normal; color:#8A5CF6; font-weight:800;}
  @media (max-height:640px){ .lv-item{min-height:52px;} .lv-item .lv-ic{width:20px; height:20px;} .lv-time{font-size:21px;} .lv-hbtn{width:38px; height:38px;} }

  .lv-qcard{gap:10px;}
  .lv-q3{margin:0; font-family:var(--display); font-weight:800; font-size:clamp(19px,4.6vw,24px); line-height:1.2; text-wrap:balance;}
  .lv-big{margin:0; text-align:center; font-family:var(--display); font-weight:800; font-size:clamp(34px,10vw,48px); line-height:1.05; letter-spacing:.04em; color:#24508F; overflow-wrap:anywhere;}
  .lv-big.is-long{font-size:clamp(22px,6vw,30px);}

<script>
(function(){
  var KEY = 'lupi-progreso-v1';
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function load(){
    var o;
    try { o = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { o = {}; }
    if (!o || typeof o !== 'object') o = {};
    if (!o.days || typeof o.days !== 'object') o.days = {};
    if (!o.total || typeof o.total !== 'object') o.total = {};
    return o;
  }
  function add(game, n){
    n = Number(n) || 0;
    if (n <= 0) return;
    var o = load();
    var k = dateKey(new Date());
    if (!o.days[k]) o.days[k] = {};
    o.days[k][game] = (o.days[k][game] || 0) + n;
    o.total[game] = (o.total[game] || 0) + n;
    var cut = new Date(); cut.setDate(cut.getDate() - 400);
    var cutKey = dateKey(cut);
    Object.keys(o.days).forEach(function(d){ if (d < cutKey) delete o.days[d]; });
    try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
  }
  /* Estrellas del mes en curso: el marcador vuelve a cero el día 1 de cada mes. */
  function month(){
    var o = load(), pre = dateKey(new Date()).slice(0, 7), per = {}, sum = 0;
    Object.keys(o.days).forEach(function(d){
      if (d.slice(0, 7) !== pre) return;
      Object.keys(o.days[d]).forEach(function(g){ var n = Number(o.days[d][g]) || 0; per[g] = (per[g] || 0) + n; sum += n; });
    });
    return { key: pre, sum: sum, per: per };
  }
  /* ----- tiempo dedicado: segundos por día y por juego, solo mientras se juega de verdad ----- */
  var TKEY = 'lupi-tiempo-v1';
  function loadTime(){ var o; try { o = JSON.parse(localStorage.getItem(TKEY) || '{}'); } catch (e) { o = {}; } return (o && typeof o === 'object') ? o : {}; }
  function addTime(game, secs){
    var o = loadTime(), k = dateKey(new Date());
    if (!o[k] || typeof o[k] !== 'object') o[k] = {};
    o[k][game] = (Number(o[k][game]) || 0) + secs;
    var cut = new Date(); cut.setDate(cut.getDate() - 400); var ck = dateKey(cut);
    Object.keys(o).forEach(function(d){ if (d < ck) delete o[d]; });
    try { localStorage.setItem(TKEY, JSON.stringify(o)); } catch (e) {}
  }
  function timeOf(key){ var r = loadTime()[key] || {}, per = {}, sum = 0; Object.keys(r).forEach(function(g){ var n = Number(r[g]) || 0; per[g] = n; sum += n; }); return { sum: sum, per: per }; }
  function fmtTime(s){ var m = Math.floor((Number(s) || 0) / 60); if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : ''); }
  /* cuenta de 5 en 5 segundos si la página está a la vista y ha habido actividad en los últimos 3 minutos */
  function startTimer(game, isActive){
    var last = Date.now(), STEP = 5000, IDLE = 180000;
    ['pointerdown', 'keydown', 'touchstart', 'wheel', 'scroll'].forEach(function(ev){ window.addEventListener(ev, function(){ last = Date.now(); }, { passive: true, capture: true }); });
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) last = Date.now(); });
    setInterval(function(){
      if (document.hidden || Date.now() - last > IDLE) return;
      if (isActive && !isActive()) return;
      addTime(game, STEP / 1000);
    }, STEP);
  }
  window.LupiScore = { add: add, load: load, dateKey: dateKey, month: month, timeOf: timeOf, fmtTime: fmtTime, startTimer: startTimer };
})();
(function(){var a=document.getElementById("lupiExitBtn");if(!a)return;a.addEventListener("click",function(e){var r=document.referrer;try{if(r&&new URL(r).origin===location.origin&&new URL(r).pathname!==location.pathname){e.preventDefault();location.href=r;}}catch(err){}});})();
</script>

var BEATS = {esp:'jin', jin:'arq', arq:'esp'};
var BOSS = {
  ogro:{n:'Ogro', hp:900, dps:60, sp:12, mod:{arq:2}},

  dragon:{n:'Dragón', hp:2600, dps:50, sp:14, aoe:{every:2.5, r:140, d:90}, mod:{esp:.3, jin:.5, arq:2.5, cat:.5}},
  hidra:{n:'Hidra', hp:3600, dps:110, sp:10, regen:.02, mod:{jin:2.2, arq:.8, cat:.6}},
  sombra:{n:'Rey de las Sombras', hp:5000, dps:140, sp:10, aoe:{every:5, r:150, d:110}, shield:6, mod:{}}
};
var ITEMS = [
  {id:'esp', n:'Espadas', k:'esp', c:10, cd:15, q:1, from:1},
  {id:'arq', n:'Arqueros', k:'arq', c:8, cd:15, q:1, from:1},
  {id:'jin', n:'Jinetes', k:'jin', c:6, cd:18, q:1, from:3},
  {id:'cat', n:'Catapultas', k:'cat', c:2, cd:22, q:2, from:4},
  {id:'lluvia', n:'Lluvia de flechas', cd:20, q:1, from:6, aim:1},
  {id:'topos', n:'Topos', cd:22, q:1, from:7, aim:1},
  {id:'muros', n:'Muros', cd:20, q:1, from:8, aim:1},
  {id:'escudo', n:'Escudos', cd:30, q:2, from:12}
];
var ITEM = {}; ITEMS.forEach(function(i){ ITEM[i.id] = i; });
var TOWER_RG = 150, MOLE_R = 55, MOLE_T = 6, FLAG_R = 40, FLAG_T = 6, BLOCK_W = 72, BLOCK_H = 7;
function rng(seed){ var s = (seed >>> 0) || 1; return function(){ s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; }
function cnt(s){ return s.hp <= 0 ? 0 : (s.one ? 1 : Math.ceil(s.hp / s.uhp - 1e-9)); }
function rad(s){ if (s.k === 'boss') return 22; if (s.k === 'tor') return 15; if (s.k === 'cua') return 22; var r = 5 + Math.sqrt(cnt(s)) * 3.2; return s.k === 'jin' ? r * 1.25 : s.k === 'cat' ? r * 1.3 : r; }
function d2(a, b){ var dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy); }
function tier(L){ return 1 + L * .06; }
function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
function inAny(list, s, extra){ for (var i = 0; i < list.length; i++){ var h = list[i]; if (d2(s, h) <= h.r + (extra || 0)) return h; } return null; }
function struct(s){ return s.k === 'tor' || s.k === 'cua'; }
function Sq(){ this.id = 0; this.side = 'e'; this.k = 'esp'; this.uhp = 1; this.hp = 0; this.hpMax = 0; this.max = 1; this.dps = 0; this.x = 0; this.y = 0; this.hx = 0; this.hy = 0;
  this.dest = null; this.tgt = null; this.wave = null; this.hitT = -9; this.born = 0; this.one = 0; this.fixed = 0; this.b = null; this.every = 0; this.next = 0; this.kinds = null; this.cc = 0; this.nk = 0;
  this.px = 0; this.py = 0; this.inF = false; this.nb = false; this.rd = 0; this.face = 0; this.moving = false; this.atkT = -9; this.fireAt = null; this.lostT = -9; this.healT = -9; this.nextAoe = 0; this.nextShot = 0; }
function mk(o){ var s = new Sq(); for (var k in o) s[k] = o[k]; return s; }

function newGame(lv, L, seed, str){
  str = str || lv.str || 1;
  var MH = lv.h || H, cm = 400 + L * 40;
  var surv = lv.goal === 'survive';
  var g = { W:W, H:MH, t:0, tl:surv ? lv.surv : (L >= 5 ? (lv.time || 150 + L * 5) : Math.max(240, 150 + L * 5)), tl0:surv ? lv.surv : (lv.time || 150 + L * 5), goal:lv.goal || 'all', L:L, sq:[], obs:[], id:0,
    camp:{x:180, y:MH - 26, hp:cm, max:cm}, buf:{furia:0, escudo:0}, cd:{}, fx:[], res:null, rnd:rng(seed || 7), str:str,
    hills:(lv.hills || []).map(function(h){ return {x:h[0], y:h[1], r:h[2]}; }),
    forests:(lv.forests || []).map(function(h){ return {x:h[0], y:h[1], r:h[2]}; }),
    flags:(lv.flags || []).map(function(f){ return {x:f[0], y:f[1], r:FLAG_R, prog:0, own:null}; }),
    blocks:[], moles:[], pending:[], newAi:L >= 5, alarm:lv.alarm || 170 };
  ITEMS.forEach(function(i){ g.cd[i.id] = 0; });
  (lv.obs || []).forEach(function(o){
    if (o.kind === 'river') g.obs.push({kind:'river', y:o.y, h:13, br:o.br, bw:30});
    else { var segs = [], n = 9, w = W / n, hp = Math.round(o.hp * str); for (var i = 0; i < n; i++) segs.push({x0:i * w, x1:(i + 1) * w, hp:hp, max:hp, y:o.y}); g.obs.push({kind:'wall', y:o.y, h:9, seg:segs}); }
  });
  var ks = Object.keys(lv.start).filter(function(k){ return lv.start[k] > 0; });
  ks.forEach(function(k, i){ spawn(g, 'p', k, lv.start[k], 180 + (i - (ks.length - 1) / 2) * 70, k === 'esp' || k === 'jin' ? MH - 100 : MH - 68); });
  lv.e.forEach(function(e){
    var c = Math.max(1, Math.round(e[1] * str));
    if (e[5]) g.pending.push({ k:e[0], c:c, x:e[2], y:e[3], t:e[4] });
    else { var es = spawn(g, 'e', e[0], c, e[2], e[3], e[4], 1); if (e[6]) es.dps *= e[6]; }
  });
  (lv.towers || []).forEach(function(t){
    var hp = Math.round(500 * str * tier(L) * (t[2] || 1));
    g.sq.push(mk({ id:++g.id, side:'e', k:'tor', one:1, fixed:1, uhp:hp, hp:hp, hpMax:hp, max:1, dps:30 * Math.sqrt(str) * tier(L), x:t[0], y:t[1], hx:t[0], hy:t[1], hitT:-9 }));
  });
  [lv.cuartel, lv.cuartel2].forEach(function(cq){
    if (!cq) return; var hp2 = Math.round(900 * str * tier(L) * (cq.hp || 1));
    g.sq.push(mk({ id:++g.id, side:'e', k:'cua', one:1, fixed:1, uhp:hp2, hp:hp2, hpMax:hp2, max:1, dps:0, x:cq.x, y:cq.y, hx:cq.x, hy:cq.y, hitT:-9,
      every:cq.every, next:cq.first || cq.every, kinds:cq.k, cc:cq.c, nk:0 }));
  });
  (lv.pblocks || []).forEach(function(b){ addBlock(g, b[0], b[1], b[2] || BLOCK_W, 1.5); });
  if (lv.b){
    var B = BOSS[lv.b.b], bh = Math.round(B.hp * str * tier(L));
    g.sq.push(mk({ id:++g.id, side:'e', k:'boss', one:1, b:lv.b.b, uhp:bh, hp:bh, hpMax:bh, max:1, dps:B.dps * str * tier(L), x:lv.b.x, y:lv.b.y, hx:lv.b.x, hy:lv.b.y, dest:null, tgt:null, wave:lv.b.wave == null ? null : lv.b.wave, hitT:-9 }));
  }
  return g;
}
function spawn(g, side, k, c, x, y, wave, extra){
  var m = tier(g.L) * (extra || 1), uhp = T[k].hp * m;
  var s = mk({ id:++g.id, side:side, k:k, uhp:uhp, hp:uhp * c, hpMax:uhp * c, max:c, dps:T[k].dps * m, x:x, y:y, hx:x, hy:y, dest:null, tgt:null, wave:wave == null ? null : wave, hitT:-9, born:g.t });
  g.sq.push(s); return s;
}
/* ---- muros que pone el jugador ---- */
function addBlock(g, x, y, w, hpMul, check){
  w = w || BLOCK_W;
  // si se pone cerca de un puente o del hueco de una muralla, se coloca justo tapándolo
  g.obs.forEach(function(o){
    if (Math.abs(y - o.y) > o.h + 45) return;
    var spans = [];
    if (o.kind === 'river') o.br.forEach(function(bx){ spans.push([bx - o.bw, bx + o.bw]); });
    else o.seg.forEach(function(sg){ if (sg.hp <= 0) spans.push([sg.x0, sg.x1]); });
    spans.forEach(function(sp){ var c = (sp[0] + sp[1]) / 2; if (Math.abs(x - c) < 45){ x = c; w = Math.max(w, sp[1] - sp[0] + 8); y = o.y + (y < o.y ? -1 : 1) * (o.h + BLOCK_H + 4); } });
  });
  var hp = Math.round((300 + 40 * g.L) * (hpMul || 1));
  var b = { x0:clamp(x - w / 2, 0, W), x1:clamp(x + w / 2, 0, W), y:clamp(y, 20, g.H - 60), h:BLOCK_H, hp:hp, max:hp, id:++g.id };
  if (check && g.sq.some(function(s){ return s.hp > 0 && !s.fixed && inBlock(b, s, rad(s) * .6); })) return null;
  if (check) return b;
  g.blocks.push(b); g.fx.push({ type:'block', x:x, y:b.y, t:g.t });

var KEY = 'lupi-batalla-v1';
function loadS(){
  var o; try { o = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { o = null; }
  if (!o || typeof o !== 'object') o = {};
  o.open = Math.max(0, Math.min(24, Number(o.open) || 0));
  if (!Array.isArray(o.crowns)) o.crowns = [];
  return { open:o.open, crowns:o.crowns };
}

/* ---------- Estrellas compartidas con Aprende con Lupi ---------- */
var AKEY = 'lupi-avatar-v1';
function avatar(){
  var o; try { o = JSON.parse(localStorage.getItem(AKEY) || '{}'); } catch (e) { o = {}; }
  if (!o || typeof o !== 'object') o = {};
  o.spent = Number(o.spent) || 0;
  var mk = window.LupiScore.dateKey(new Date()).slice(0, 7);
  if (!o.sm || o.sm.m !== mk) o.sm = { m: mk, n: o.sm ? 0 : o.spent };
  return o;
}
function stars(){ return Math.max(0, window.LupiScore.month().sum - avatar().sm.n); }
function spend(n){
  var a = avatar(); if (window.LupiScore.month().sum - a.sm.n < n) return false;
  a.spent += n; a.sm.n += n;
  try { localStorage.setItem(AKEY, JSON.stringify(a)); } catch (e) { return false; }
  paintStars(); return true;
}
function earn(n){ window.LupiScore.add('batalla', n); paintStars(true); }
function paintStars(pop){
  var el = $('blStarN'); if (!el) return; el.textContent = stars();
  if (pop){ var p = el.parentNode; p.classList.remove('bl-pop'); void p.offsetWidth; p.classList.add('bl-pop'); }
}
function toast(t){
  var d = document.createElement('div'); d.className = 'bl-toast'; d.setAttribute('role', 'status'); d.textContent = t;
  document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 2200);
}
function needStars(n){
  toast('Te faltan ' + (n - stars()) + ' estrellas. ¡Gánalas en la Academia!');
}
